/* MathLive(수식 입력기)는 무거워서(약 220KB) 처음부터 안 받고,
   수식 입력기를 실제로 열 때만 불러온다. 학생은 받을 일이 거의 없다. */
function mathliveReady() {
  try { return !!(window.customElements && window.customElements.get("math-field")); } catch (e) { return false; }
}
let __mathlivePromise = null;
function loadMathLive() {
  if (mathliveReady()) return Promise.resolve();
  if (__mathlivePromise) return __mathlivePromise;
  __mathlivePromise = new Promise((resolve) => {
    try {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/mathlive@0.110.0";
      s.onload = () => {
        try { if (window.MathfieldElement) window.MathfieldElement.soundsDirectory = null; } catch (e) {}
        if (window.customElements && window.customElements.whenDefined)
          window.customElements.whenDefined("math-field").then(() => resolve(), () => resolve());
        else resolve();
      };
      s.onerror = () => resolve(); // 실패해도 앱은 죽지 않게
      document.head.appendChild(s);
    } catch (e) { resolve(); }
  });
  return __mathlivePromise;
}

/* ====== 주소(URL) 라우팅 ======
   /               홈
   /column         칼럼 목록      /column/110001  칼럼 글
   /notice         공지 목록      /notice/200003  공지 글
   /exam /game /records /admin /account /privacy /changelog
   Cloudflare 에 _redirects 파일이 있어야 새로고침/직접입력이 동작합니다. */
const TAB_PATH = {
  notices: "/column",
  announce: "/notice",
  exams: "/exam",
  game: "/game",
  records: "/records",
  admin: "/admin",
  account: "/account",
  privacy: "/privacy",
  changelog: "/changelog",
};
const PATH_TAB = {};
Object.keys(TAB_PATH).forEach((k) => { PATH_TAB[TAB_PATH[k]] = k; });
const pathOfTab = (t) => (t && t !== "home" ? TAB_PATH[t] || "/" : "/");

function parsePath() {
  try {
    const p = (String(window.location.pathname || "").replace(/\/+$/, "")) || "/";
    const seg = p.split("/").filter(Boolean);
    if (!seg.length) return null;
    // /rules 는 규칙으로 지정된 공지를 연다. 규칙 글을 새로 써도 주소는 그대로다
    if (seg[0] === "rules") return { tab: "announce", sub: "rules", no: null };
    const tab = PATH_TAB["/" + seg[0]];
    if (!tab) return null;
    const s2 = seg[1] || null;
    if (s2 && /^\d+$/.test(s2)) return { tab, no: Number(s2), sub: null };
    return { tab, sub: s2, no: null };
  } catch (e) { return null; }
}
// 글번호로 찾기 — 분류가 바뀌기 전의 옛 번호로 들어와도 열리게
// 검색용: 본문 HTML 에서 글자만 뽑기
function plainText(html) {
  return String(html || "").replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ").replace(/&[a-z]+;/gi, " ");
}
function matchPost(n, kw) {
  if (!kw) return true;
  const k = kw.toLowerCase();
  return (
    String(n.title || "").toLowerCase().indexOf(k) !== -1 ||
    plainText(n.body).toLowerCase().indexOf(k) !== -1 ||
    String(n.author || "").toLowerCase().indexOf(k) !== -1
  );
}
function findByNo(list, no) {
  return (list || []).find(
    (x) => x.no === no || (x.prevNos || []).indexOf(no) !== -1
  );
}
function pushUrl(path) {
  try { if (window.location.pathname !== path) window.history.pushState({}, "", path); } catch (e) {}
}

const uid = () => Math.random().toString(36).slice(2, 10);
const fmtDate = (ts) => {
  const d = new Date(ts);
  const y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "." : "";
  return `${y}${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(
    d.getMinutes()
  ).padStart(2, "0")}`;
};

function maxScore(exam) {
  return exam.questions.reduce((s, q) => s + (Number(q.points) || 0), 0);
}
function isShortCorrect(q, ans) {
  const key = String(q.accept ?? "").trim();
  if (key === "") return false;
  return String(ans ?? "").trim() === key;
}
function questionScore(q, sub) {
  const a = sub.answers[q.id];
  const ov = sub.manualScores?.[q.id];
  if (ov !== undefined && ov !== null && ov !== "") {
    return Math.max(0, Math.min(Number(q.points) || 0, Number(ov) || 0));
  }
  if (q.type === "mc") return a === q.answer ? Number(q.points) || 0 : 0;
  return isShortCorrect(q, a) ? Number(q.points) || 0 : 0;
}
function autoScore(exam, answers) {
  return exam.questions.reduce((s, q) => {
    if (q.type === "mc") return s + (answers[q.id] === q.answer ? Number(q.points) || 0 : 0);
    return s + (isShortCorrect(q, answers[q.id]) ? Number(q.points) || 0 : 0);
  }, 0);
}
function totalScore(exam, sub) {
  return exam.questions.reduce((s, q) => s + questionScore(q, sub), 0);
}
/* 정답을 빼고 내려온 시험인지. 서버는 아직 안 푼 사람에게 정답을 지우고 준다 */
function answersHidden(exam) {
  const qs = (exam && exam.questions) || [];
  if (!qs.length) return false;
  return qs.every((q) => q.answer === undefined && (q.accept === undefined || q.accept === null));
}
/* 제출한 뒤 서버가 내준 정답을 문제에 합친다. 채점 화면은 이걸 쓴다 */
function withAnswers(exam, qs) {
  if (!exam || !Array.isArray(qs) || !qs.length) return exam;
  const by = {};
  qs.forEach((q) => { if (q && q.id) by[q.id] = q; });
  return { ...exam, questions: exam.questions.map((q) => (by[q.id] ? { ...q, ...by[q.id] } : q)) };
}
// 한 문항을 '맞춤'으로 볼지 (회원정답률 계산용) — 자동 정답 또는 보정으로 만점인 경우
function isQCorrect(q, sub) {
  const answers = (sub && sub.answers) || {}; // 비회원 집계 행은 answers가 null일 수 있음 → 크래시 방지
  if (q.type === "mc") return answers[q.id] === q.answer;
  const ov = sub.manualScores && sub.manualScores[q.id];
  if (ov !== undefined && ov !== null && ov !== "") return Number(ov) >= (Number(q.points) || 0) && (Number(q.points) || 0) > 0;
  return isShortCorrect(q, answers[q.id]);
}
// 표시용 이름: 현재 회원 목록에 없으면 '탈퇴한 회원 (원래아이디)'
function studentName(name, users) {
  if (!name) return "익명";
  if (users && users.some((u) => u.username === name)) return name;
  return "탈퇴한 회원 (" + name + ")";
}
// 정답률 구간별 색 (어두운 화면에서는 밝은 쪽 색을 써야 읽힌다)
function rateColor(rate) {
  let dark = false;
  try { dark = document.documentElement.dataset.theme === "dark"; } catch (e) {}
  if (rate === null || rate === undefined) return dark ? "#9c93b5" : "#8B95A1"; // 데이터 없음(회색)
  if (rate >= 80) return dark ? "#3ddb9a" : "#00B262"; // 초록
  if (rate >= 50) return dark ? "#f0c04e" : "#E5A300"; // 노랑
  if (rate >= 20) return dark ? "#ff9d5c" : "#F97316"; // 주황
  if (rate >= 10) return dark ? "#ff7d95" : "#F04452"; // 빨강
  return dark ? "#ff5c7a" : "#6A0012"; // 10% 미만: 가장 어려운 색
}
// 시험 통계(회원+비회원)를 합친 평균 정답률 하나로. 데이터 없으면 null
function combinedRate(stat) {
  if (!stat) return null;
  const tot = Number(stat.total || 0) + Number(stat.gtotal || 0);
  const cor = Number(stat.correct || 0) + Number(stat.gcorrect || 0);
  return tot ? Math.round((100 * cor) / tot) : null;
}
// 평균 정답률로 난이도를 나눔 (높을수록 쉬움). 데이터 없으면 null
function difficultyOf(rate) {
  if (rate === null || rate === undefined) return null;
  if (rate >= 70) return { label: "쉬움", cls: "easy" };
  if (rate >= 40) return { label: "보통", cls: "mid" };
  return { label: "어려움", cls: "hard" };
}
/* ===== 홈 화면에 추가 안내 ===== */
// 이미 홈 화면에서 열었는지 (그러면 안내가 필요 없다)
function isStandalone() {
  try {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  } catch (e) { return false; }
}
function isIOS() {
  try { return /iPad|iPhone|iPod/.test(navigator.userAgent); } catch (e) { return false; }
}
function isAndroid() {
  try { return /Android/.test(navigator.userAgent); } catch (e) { return false; }
}
// 카톡 등 앱 안 브라우저에서는 홈 화면에 추가가 안 된다
function isInAppBrowser() {
  try { return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent); } catch (e) { return false; }
}
// 저장된 화면 모드 (없으면 기기 설정을 따름)
function getTheme() {
  try {
    const t = localStorage.getItem("mr-theme");
    if (t === "dark" || t === "light") return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (e) { return "light"; }
}

        sb.from("profiles").select("*").order("created_at", { ascending: false }),
      ]);
      setNotices((c.data || []).map(mapColumn));
      setExams((e.data || []).map(mapExam));
      setSubs((s.data || []).map(mapSub));
      setUsers((p.data || []).map(mapProfile));
    } catch (err) {
      console.warn("데이터 불러오기 실패:", err);
    }
    // 활동 기록은 관리자만 읽을 수 있으니 따로 불러온다 (실패해도 칼럼·시험엔 영향 없음)
    try {
      const l = await sb.from("audit_log").select("*").order("created_at", { ascending: false }).limit(300);
      setAuditLog(l.data || []);
    } catch (err) {
      setAuditLog([]);
    }
    // 비회원 익명 집계(관리자만 읽힘)
    try {
      const g = await sb.from("guest_submissions").select("*").order("created_at", { ascending: false }).limit(5000);
      setGuestSubs(g.data || []);
    } catch (err) {
      setGuestSubs([]);
    }
  }, []);

  useEffect(() => {
    let active = true;
    const safety = setTimeout(() => active && setLoading(false), 5000);
    (async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (active && session && session.user) {
          const p = await loadProfile(session.user.id);
          if (active) setAuth(p);
        }
      } catch (err) {
        console.warn("세션 확인 실패:", err);
      }
      if (active) setLoading(false);
      clearTimeout(safety);
      refresh();
    })();
    const { data: listener } = sb.auth.onAuthStateChange((evt, session) => {
      // 첫 구독 시 오는 INITIAL_SESSION 은 아래 초기 로드가 이미 처리하므로 건너뛴다 (중복 요청 방지)
      if (evt === "INITIAL_SESSION") return;
      setTimeout(async () => {
        if (session && session.user) {
          const p = await loadProfile(session.user.id);
          if (p) setAuth(p);
        } else {
          setAuth(null);
        }
        refresh();
      }, 0);
    });
    return () => {
      active = false;
      clearTimeout(safety);
      listener.subscription.unsubscribe();
    };
  }, [refresh]);

  const currentId = async () => {
    const { data } = await sb.auth.getUser();
    return data && data.user ? data.user.id : null;
  };

  /* ---- 인증 ---- */
  const onLogin = async (id, pw) => {
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(id), password: padPw(pw) });
      if (error || !data || !data.user) return { error: "아이디 또는 비밀번호가 올바르지 않아요." };
      setAuth({ id: data.user.id, username: id.trim(), kakaoId: "", isAdmin: false });
      setAuthOpen(false);
      loadProfile(data.user.id).then((p) => { if (p) setAuth(p); }).catch(() => {});
      return {};
    } catch (e) {
      console.warn("login error:", e);
      return { error: "로그인 중 오류가 났어요. 잠시 후 다시 시도해 주세요." };
    }
  };
  /* 채팅방 닉네임 중복 검사 (빈 값은 여러 명이 써도 됨).
     화면 검사는 안내용이고, 최종 방어는 DB 유니크 인덱스가 함 */
  const KAKAO_DUP_MSG = "이미 다른 회원이 쓰고 있는 닉네임이에요. 다른 이름을 써주세요.";
  const isDupError = (err) =>
    !!err && (err.code === "23505" || /duplicate key|unique constraint|profiles_kakao/i.test(err.message || ""));
  const kakaoTaken = async (kakao, exceptId) => {
    const v = (kakao || "").trim();
    if (!v) return false; // 닉네임 안 쓰는 건 자유
    try {
      const { data, error } = await sb.from("profiles").select("id,kakao_id");
      if (error || !data) return false; // 조회 실패 시엔 DB 제약에 맡김
      return data.some(
        (r) => (r.kakao_id || "").trim().toLowerCase() === v.toLowerCase() && r.id !== exceptId
      );
    } catch (e) {
      return false;
    }
  };
  const onSignup = async (id, pw, kakao) => {
    const uname = id.trim();
    if (!uname) return { error: "아이디를 입력하세요." };
    if (await kakaoTaken(kakao, null)) return { error: KAKAO_DUP_MSG };
    try {
      const { data, error } = await sb.auth.signUp({
        email: emailOf(uname),
        password: padPw(pw),
        options: { data: { username: uname, kakao_id: (kakao || "").trim() } },
      });
      if (error) {
        if (isDupError(error) || /Database error saving new user/i.test(error.message || ""))
          return { error: KAKAO_DUP_MSG };
        const dup = /registered|already|exists|duplicate/i.test(error.message || "");
        return { error: dup ? "이미 사용 중인 아이디예요." : error.message };
      }
      if (!data || !data.session || !data.user) {
        return { error: "가입은 됐어요. 로그인이 안 되면 Supabase에서 'Confirm email'을 꺼주세요." };
      }
      setAuth({ id: data.user.id, username: uname, kakaoId: (kakao || "").trim(), isAdmin: false });
      setAuthOpen(false);
      loadProfile(data.user.id).then((p) => { if (p) setAuth(p); }).catch(() => {});
      return {};
    } catch (e) {
      console.warn("signup error:", e);
      return { error: "가입 중 오류가 났어요. 잠시 후 다시 시도해 주세요." };
    }
  };
  const onLogout = async () => {
    await sb.auth.signOut();
    go("home");
  };
  const onChangePassword = async (curPw, newPw) => {
    if (!auth) return { error: "로그인이 필요해요." };
    const check = await sb.auth.signInWithPassword({ email: emailOf(auth.username), password: padPw(curPw) });
    if (check.error) return { error: "현재 비밀번호가 올바르지 않아요." };
    const { error } = await sb.auth.updateUser({ password: padPw(newPw) });
    if (error) return { error: error.message };
    return {};
  };
  const onUpdateKakao = async (kakao) => {
    if (!auth) return { error: "로그인이 필요해요." };
    const v = (kakao || "").trim();
    if (v && (await kakaoTaken(v, auth.id))) return { error: KAKAO_DUP_MSG };
    const { error } = await sb.from("profiles").update({ kakao_id: v }).eq("id", auth.id);
    if (error) return { error: isDupError(error) ? KAKAO_DUP_MSG : error.message };
    setAuth({ ...auth, kakaoId: v });
    await refresh();
    return {};
  };
  const onDeleteMe = async (pw) => {
    if (!auth) return { error: "로그인이 필요해요." };
    const check = await sb.auth.signInWithPassword({ email: emailOf(auth.username), password: padPw(pw) });
    if (check.error) return { error: "비밀번호가 올바르지 않아요." };
    const { error } = await sb.rpc("delete_my_account");
    if (error) return { error: error.message };
    await sb.auth.signOut();
    setAuth(null);
    return {};
  };

  /* ---- 데이터 ---- */
  const logAction = async (action, target) => {
    try {
      await sb.from("audit_log").insert({
        actor: auth ? auth.username : "?",
        actor_id: auth ? auth.id : null,
        action,
        target: target || "",
      });
    } catch (e) {
      console.warn("로그 기록 실패:", e);
    }
  };
  const onAddColumn = async (post) => {
    const id = await currentId();
    const { data, error } = await sb.from("columns")
      .insert({ title: post.title, body: post.body, author: post.author, author_id: id, is_draft: !!post.isDraft, category: post.category || "elem" })
      .select().maybeSingle();
    if (error) { alert("칼럼 저장에 실패했어요: " + error.message); return null; }
    await logAction(post.isDraft ? "칼럼 임시저장" : "칼럼 작성", post.title);
    await refresh();
    return data ? data.id : true; // id를 못 받아도 insert 자체는 성공 → 실패로 오인하지 않기
  };
  const onDeleteColumn = async (id) => {
    const n = notices.find((x) => x.id === id);
    const { error } = await sb.from("columns").delete().eq("id", id);
    if (error) { alert("칼럼 삭제에 실패했어요: " + error.message); return; }
    await logAction("칼럼 삭제", n ? n.title : id);
    await refresh();
  };
  const onEditColumn = async (id, title, body, isDraft, category) => {
    const patch = { title, body };
    if (typeof isDraft === "boolean") patch.is_draft = isDraft;
    if (category) patch.category = category;
    const { error } = await sb.from("columns").update(patch).eq("id", id);
    if (error) { alert("칼럼 수정에 실패했어요: " + error.message); return null; }
    await logAction(isDraft ? "칼럼 임시저장" : "칼럼 수정", title);
    await refresh();
    return true;
  };
  // 메인규칙은 하나뿐이므로 먼저 전부 내리고 고른 글만 올린다
  const onSetRule = async (id) => {
    const clear = await sb.from("columns").update({ is_rule: false }).eq("is_rule", true);
    if (clear.error) { alert("규칙 지정에 실패했어요: " + clear.error.message); return; }
    if (id) {
      const { error } = await sb.from("columns").update({ is_rule: true }).eq("id", id);
      if (error) { alert("규칙 지정에 실패했어요: " + error.message); return; }
    }
    const n = notices.find((x) => x.id === id);
    await logAction(id ? "메인규칙 지정" : "메인규칙 해제", n ? n.title : "");
    await refresh();
  };
  const onReorderColumns = async (ids) => {
    const results = await Promise.all(ids.map((cid, i) => sb.from("columns").update({ sort_order: i + 1 }).eq("id", cid)));
    const failed = results.find((r) => r && r.error);
    if (failed) { alert("순서 변경에 실패했어요: " + failed.error.message); await refresh(); return; }
    await logAction("칼럼 순서변경", "");
    await refresh();
  };
  const onAddExam = async (exam) => {
    const id = await currentId();
    const author = auth ? ((auth.kakaoId || "").trim() || auth.username || "") : "";
    const { error } = await sb.from("exams").insert({ title: exam.title, questions: exam.questions, author_id: id, author, exam_type: exam.examType || "level", publish_at: exam.publishAt ? new Date(exam.publishAt).toISOString() : null });
    if (error) { alert("시험 저장에 실패했어요: " + error.message); return; }
    await logAction("시험 출제", exam.title);
    await refresh();
  };
  const onEditExam = async (id, exam) => {
    const { error } = await sb.from("exams").update({ title: exam.title, questions: exam.questions, exam_type: exam.examType || "level", publish_at: exam.publishAt ? new Date(exam.publishAt).toISOString() : null }).eq("id", id);
    if (error) { alert("시험 수정에 실패했어요: " + error.message); return; }
    await logAction("시험 수정", exam.title);
    await refresh();
  };
  const onDeleteExam = async (id) => {
    const ex = exams.find((e) => e.id === id);
    const { error } = await sb.from("exams").delete().eq("id", id);
    if (error) { alert("시험 삭제에 실패했어요: " + error.message); return; }
    await logAction("시험 삭제", ex ? ex.title : id);
    await refresh();
  };
  const onGradeSub = async (sub) => {
    const { error } = await sb.from("submissions").update({ manual_scores: sub.manualScores || {}, graded: true }).eq("id", sub.id);
    if (error) { alert("채점 저장에 실패했어요: " + error.message); return; }
    await logAction("채점 수정", sub.student);
    await refresh();
  };
  const onAddSub = async (sub) => {
    const id = await currentId();
    const { error } = await sb.from("submissions").insert({
      exam_id: sub.examId, student: sub.student, student_id: id,
      answers: sub.answers, manual_scores: sub.manualScores || {}, graded: sub.graded,
    });
    if (error) return { error: error.message };
    await refresh();
    return {};
  };
  // 비회원: IP 기준 24시간 중복 방지 함수로 보냄 (개인정보 없이 익명 집계)
  // 비회원은 사람을 알아볼 수 없어서 서버가 제출 응답에 정답을 실어 보낸다.
  // 예전 함수는 true/false 만 주므로 그때는 null 을 돌려 원래 방식대로 채점한다
  const onGuestSubmit = async (examId, answers) => {
    try {
      const { data } = await sb.rpc("submit_guest_attempt", { p_exam_id: examId, p_answers: answers });
      if (data && typeof data === "object" && Array.isArray(data.questions)) return data.questions;
    } catch (e) {
      console.warn("비회원 집계 실패:", e);
    }
    return null;
  };
  // 회원은 제출하고 나면 서버가 그 시험의 정답을 내준다
  const getAnswers = async (examId) => {
    for (const t of ["exams_view", "exams"]) {
      try {
        const { data, error } = await sb.from(t).select("questions").eq("id", examId).maybeSingle();
        if (!error && data && Array.isArray(data.questions)) return data.questions;
      } catch (e) {}
    }
    return null;
  };
  // root 전용 동작 검사 (일반 관리자는 시도조차 못 하게)
  const superOnly = () => {
    if (!auth || !auth.isSuper) { alert("root만 할 수 있는 작업이에요."); return false; }
    return true;
  };
  const isSuperUser = (username) => users.some((u) => u.username === username && u.isSuper);
  const onToggleAdmin = async (username, next) => {
    if (!superOnly()) return;
    if (isSuperUser(username)) { alert("root의 권한은 바꿀 수 없어요."); return; }
    const { error } = await sb.from("profiles").update({ is_admin: next }).eq("username", username);
    if (error) { alert("권한 변경에 실패했어요: " + error.message); return; }
    await logAction(next ? "관리자 지정" : "관리자 해제", username);
    await refresh();
  };
  const onDeleteUser = async (username) => {
    if (!superOnly()) return;
    if (isSuperUser(username)) { alert("root 계정은 삭제할 수 없어요."); return; }
    const { error } = await sb.rpc("admin_delete_user", { p_username: username });
    if (error) {
      // 함수가 아직 없거나 실패하면, 최소한 프로필이라도 제거
      await sb.from("profiles").delete().eq("username", username);
      alert("인증 계정 삭제에 실패했어요(프로필만 제거됨): " + error.message);
    }
    await logAction("회원 삭제", username);
    await refresh();
  };
  const onResetPassword = async (username) => {
    if (!superOnly()) return;
    if (isSuperUser(username)) { alert("root의 비밀번호는 여기서 바꿀 수 없어요."); return; }
    const { data, error } = await sb.rpc("admin_reset_password", { p_username: username });
    if (error) { alert("초기화 실패: " + error.message); return; }
    if (data === false) { alert("해당 회원을 찾지 못했어요."); return; }
    await logAction("비밀번호 초기화", username);
    alert(username + " 님의 비밀번호를 0000 으로 초기화했어요.\n로그인 후 계정 화면에서 바꾸도록 안내해주세요.");
  };

  // 같은 columns 테이블을 쓰되 category 로 칼럼/공지사항을 구분
  const columnPosts = notices.filter((n) => (n.category || "elem") !== "notice");
  const noticePosts = notices.filter((n) => n.category === "notice");

  const homeView = (
    <Home role={role} student={student} loggedIn={loggedIn} noticeCount={columnPosts.filter((n) => !n.isDraft).length} columnUnread={columnUnreadCount(columnPosts, readColIds)} announceCount={noticePosts.filter((n) => !n.isDraft).length} announceUnread={columnUnreadCount(noticePosts, readColIds)} examUnread={todayUnreadCount(exams.filter(isPublished), readExamIds)} examCount={role === "admin" ? exams.length : exams.filter(isPublished).length} onGo={openOver} />
  );

  const screenFor = (key) => {
    switch (key) {
      case "records": return loggedIn ? <MyRecords key={"r" + nav} initialSub={route && route.tab === "records" ? route.sub : null} pushUrl={pushUrl} student={student} exams={exams} subs={subs} /> : homeView;
      case "admin": return role === "admin" ? <Admin key={"a" + nav} initialSub={route && route.tab === "admin" ? route.sub : null} pushUrl={pushUrl} auth={auth} isSuper={isSuper} users={users} notices={notices} exams={exams} subs={subs} auditLog={auditLog} onToggleAdmin={onToggleAdmin} onDeleteUser={onDeleteUser} onResetPassword={onResetPassword} /> : homeView;
      case "account": return loggedIn ? <Account auth={auth} theme={theme} onToggleTheme={toggleTheme} onChangePassword={onChangePassword} onUpdateKakao={onUpdateKakao} onDeleteMe={onDeleteMe} onLogout={onLogout} /> : homeView;
      case "notices": return <Notices key={"c" + nav} loggedIn={loggedIn} requireLogin={requireLogin} initialNo={route && route.tab === "notices" ? route.no : null} initialCat={route && route.tab === "notices" ? route.sub : null} urlBase="column" pushUrl={pushUrl} role={role} student={student} kakaoId={auth ? auth.kakaoId : ""} notices={columnPosts} onAdd={onAddColumn} onDelete={onDeleteColumn} onEdit={onEditColumn} onReorder={onReorderColumns} readIds={readColIds} onRead={markColumnRead} />;
      case "announce": return <Announcements key={"n" + nav} initialNo={route && route.tab === "announce" ? route.no : null} initialSub={route && route.tab === "announce" ? route.sub : null} urlBase="notice" pushUrl={pushUrl} role={role} student={student} kakaoId={auth ? auth.kakaoId : ""} posts={noticePosts} onAdd={onAddColumn} onDelete={onDeleteColumn} onEdit={onEditColumn} onReorder={onReorderColumns} onSetRule={onSetRule} readIds={readColIds} onRead={markColumnRead} />;
      case "privacy": return <Privacy onBack={() => go("home")} />;
      case "changelog": return <Changelog onBack={() => go("home")} isAdmin={role === "admin"} />;
      case "game": return <SpeedGame key={"g" + nav} initialSub={route && route.tab === "game" ? route.sub : null} pushUrl={pushUrl} onBack={closeOver} auth={auth} onGoAccount={() => { setOver(null); go("account"); }} onLogin={() => setAuthOpen(true)} />;
      case "exams": return <Exams key={"e" + nav} initialSub={route && route.tab === "exams" ? route.sub : null} initialNo={route && route.tab === "exams" ? route.no : null} pushUrl={pushUrl} role={role} isSuper={isSuper} student={student} myId={auth ? auth.id : null} users={users} loggedIn={loggedIn} requireLogin={requireLogin} exams={exams} subs={subs} onAddExam={onAddExam} onEditExam={onEditExam} onDeleteExam={onDeleteExam} onGradeSub={onGradeSub} onAddSub={onAddSub} onGuestSubmit={onGuestSubmit} getAnswers={getAnswers} guestSubs={guestSubs} readIds={readExamIds} onView={markExamRead} />;
      default: return homeView;
    }
  };

  return (
    <div className="mr-root">
      <style>{CSS}</style>
      {over && (
        <div className="mr-ov-scrim" style={{ opacity: over.expanded ? 1 : 0 }} onClick={closeOver} />
      )}
      {over && (
        <div
          className="mr-ov"
          style={over.expanded
            ? { position: "fixed", zIndex: 150, overflow: "hidden", top: "74px", left: "0px", width: "100vw", height: "calc(100vh - 74px)", borderRadius: "0px" }
            : { position: "fixed", zIndex: 150, overflow: "hidden", top: over.rect.top + "px", left: over.rect.left + "px", width: over.rect.width + "px", height: over.rect.height + "px", borderRadius: "26px" }}
        >
          <div
            className="mr-ov-inner"
            style={{
              opacity: over.expanded ? 1 : 0,
              transform: over.expanded ? "none" : "translateY(10px)",
              transition: over.expanded ? "opacity .34s ease .15s, transform .42s cubic-bezier(.22,1,.36,1) .12s" : "opacity .15s ease, transform .15s ease",
            }}
          >
            <main className="mr-main">
              {/* content-flow so it shares the scroll box width with the cards */}
              <button className="mr-page-back" onClick={closeOver}>홈</button>
              {screenFor(over.key)}
            </main>
          </div>
        </div>
      )}

      <header className="mr-header">
        <div className="mr-brand" onClick={() => { setOver(null); go("home"); }} role="button">
          <span className="mr-logo">∫</span>
          <div>
            <div className="mr-brand-name">수학질문방</div>
          </div>
        </div>

        <div className="mr-rolebox">
          {loggedIn ? (
            <button
              className={"mr-account-btn" + (tab === "account" ? " active" : "")}
              onClick={() => { setOver(null); go("account"); }}
              aria-label="회원정보"
            >
              <PersonIcon />
            </button>
          ) : (
            <button className="mr-login-btn" onClick={() => setAuthOpen(true)}>
              로그인
            </button>
          )}
        </div>
      </header>

      <main className="mr-main">
        <div className="mr-screen-in" key={tab}>
        {!loading && tab !== "home" && (
          <button className="mr-page-back" onClick={() => go("home")}>홈</button>
        )}
        {loading ? (
          <div className="mr-loading">불러오는 중…</div>
        ) : tab === "home" ? (
          homeView
        ) : (
          screenFor(tab)
        )}
        </div>

        <div className="mr-foot-row">
          <span className="mr-foot-copy">© suhakjilmoon</span>
          <span className="mr-foot-sep">·</span>
          <button className="mr-foot-link" onClick={() => go("changelog")}>v{APP_VERSION}</button>
          <span className="mr-foot-sep">·</span>
          <button className="mr-foot-link" onClick={() => go("privacy")}>개인정보 처리방침</button>

        {!installed && (

/* ===================== 회원정보 ===================== */
function Account({ auth, theme, onToggleTheme, onChangePassword, onUpdateKakao, onDeleteMe, onLogout }) {
  const [curPw, setCurPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [done, setDone] = useState(false);
  const [kakao, setKakao] = useState(auth.kakaoId || "");
  const [kakaoDone, setKakaoDone] = useState(false);
  const [withdraw, setWithdraw] = useState(false);
  const [delPw, setDelPw] = useState("");

  const changePw = async () => {
    if (!curPw || !newPw) return alert("현재 비밀번호와 새 비밀번호를 입력하세요.");
    const { error } = await onChangePassword(curPw, newPw);
    if (error) return alert(error);
    setCurPw("");
    setNewPw("");
    setDone(true);
  };

  const saveKakao = async () => {
    const { error } = await onUpdateKakao(kakao.trim());
    if (error) return alert(error);
    setKakaoDone(true);
  };

  const deleteMe = async () => {
    if (!delPw) return alert("비밀번호를 입력하세요.");
    if (!confirm("정말 탈퇴할까요? 계정과 기록이 삭제되며 되돌릴 수 없어요.")) return;
    const { error } = await onDeleteMe(delPw);
    if (error) return alert(error);
    alert("탈퇴가 완료됐어요. 그동안 이용해주셔서 감사합니다.");
  };

  return (
    <div className="mr-col">
      <section className="mr-card mr-account-card">
        <div className="mr-account-avatar">
          <PersonIcon />
        </div>
        <div className="mr-account-name">{auth.username}</div>
        <div className="mr-account-role">
          {auth.isSuper ? "root" : auth.isAdmin ? "관리자" : "일반 회원"}
          {!auth.isAdmin && auth.kakaoId ? ` · 채팅방 ${auth.kakaoId}` : ""}
        </div>
      </section>

      <section className="mr-card">
        <div className="mr-card-tag">내 정보</div>
        <div className="mr-cat-label">채팅방 닉네임</div>
        <input
          className="mr-input"
          placeholder="채팅방에서 쓰는 이름"
          value={kakao}
          onChange={(e) => { setKakao(e.target.value); setKakaoDone(false); }}
        />
        <div className="mr-row-between" style={{ marginTop: "14px" }}>
          <span className="mr-ok-msg">{kakaoDone ? "저장됐어요" : ""}</span>
          <button className="mr-btn" onClick={saveKakao}>저장</button>
        </div>
      </section>

      <section className="mr-card">
        <div className="mr-card-tag">비밀번호 변경</div>
        <input
          className="mr-input"
          type="password"
          placeholder="현재 비밀번호"
          value={curPw}
          onChange={(e) => {
            setCurPw(e.target.value);
            setDone(false);
          }}
        />
        <input
          className="mr-input"
          type="password"
          placeholder="새 비밀번호"
          value={newPw}
          onChange={(e) => {
            setNewPw(e.target.value);
            setDone(false);
          }}
        />
        <div className="mr-row-between" style={{ marginTop: "14px" }}>
          <span className="mr-ok-msg">{done ? "비밀번호가 변경됐어요" : ""}</span>
          <button className="mr-btn" onClick={changePw}>
            변경하기
          </button>
        </div>
      </section>

      <section className="mr-card">
        <div className="mr-card-tag">화면 설정</div>
        <div className="mr-setting-row">
          <div className="mr-setting-text">
            <div className="mr-setting-name">어두운 화면 모드</div>
            <div className="mr-setting-desc">{theme === "dark" ? "지금은 어두운 화면이에요" : "지금은 밝은 화면이에요"}</div>
          </div>
          <button
            className={"mr-switch" + (theme === "dark" ? " on" : "")}
            onClick={onToggleTheme}
            role="switch"
            aria-checked={theme === "dark"}
            aria-label="어두운 화면 모드"
          >
            <span className="mr-switch-dot" />
          </button>
        </div>
      </section>

      <button className="mr-logout-full" onClick={onLogout}>
        로그아웃
      </button>

      {!withdraw ? (
        <button className="mr-withdraw-link" onClick={() => setWithdraw(true)}>
          회원 탈퇴
        </button>
      ) : (
        <section className="mr-card mr-withdraw-card">
          <div className="mr-card-tag">회원 탈퇴</div>
          <p className="mr-withdraw-warn">탈퇴하면 계정과 시험 기록이 삭제되며 되돌릴 수 없어요. 계속하려면 비밀번호를 입력하세요.</p>
          <input
            className="mr-input"
            type="password"
            placeholder="비밀번호 확인"
            value={delPw}
            onChange={(e) => setDelPw(e.target.value)}
          />
          <div className="mr-row-end" style={{ marginTop: "14px", gap: "8px" }}>
            <button className="mr-btn-ghost" onClick={() => { setWithdraw(false); setDelPw(""); }}>
              취소
            </button>
            <button className="mr-btn mr-btn-danger" onClick={deleteMe}>
              탈퇴하기
            </button>
          </div>
        </section>
      )}
    </div>
  );
}

/* ===================== 내 시험 기록 / 오답노트 ===================== */
function MyRecords({ student, exams, subs, initialSub, pushUrl }) {
  const [open, setOpen] = useState(null);
  const step = useStep(open ? 1 : 0);
  const [sub0, setSub0] = useState(initialSub === "wrong" ? "wrong" : "exams");
  const goSub = (t) => {
    setSub0(t);
    setOpen(null);
    if (pushUrl) pushUrl(t === "wrong" ? "/records/wrong" : "/records");
  };

  const mine = subs
    .filter((s) => s.student === student)
    .map((s) => ({ sub: s, exam: exams.find((e) => e.id === s.examId) }))
    .filter((r) => r.exam)
    .sort((a, b) => (b.sub.submittedAt || 0) - (a.sub.submittedAt || 0));

  // 틀린 문항만 모으기 (최근 응시부터)
  const wrong = [];
  mine.forEach(({ sub, exam }) => {
    exam.questions.forEach((q, qi) => {
      if (!isQCorrect(q, sub)) wrong.push({ exam, sub, q, qi });
    });
  });

  // 대시보드용 통계 (점수 비율 %)
  const recStats = mine.map(({ sub, exam }) => {
    const m = maxScore(exam);
    return m ? Math.round((totalScore(exam, sub) / m) * 100) : 0;
  });
  const avgPct = recStats.length ? Math.round(recStats.reduce((s, x) => s + x, 0) / recStats.length) : 0;
  const bestPct = recStats.length ? Math.max.apply(null, recStats) : 0;
  const trend = recStats.slice(0, 10).reverse(); // 오래된→최근 순으로 표시

  if (open) {
    const { sub, exam } = open;
    const score = totalScore(exam, sub);
    const max = maxScore(exam);
    const ratio = max ? score / max : 0;
    const tone = ratio >= 0.8 ? "good" : ratio >= 0.5 ? "mid" : "low";
    return (
      <div className={"mr-col" + step} key="detail">
        <button className="mr-back" onClick={() => setOpen(null)}>내 시험 기록</button>
        <section className="mr-card" style={{ textAlign: "center", padding: "28px 20px" }}>
          <div className="mr-card-tag" style={{ marginBottom: "10px" }}>{exam.title}</div>
          <div className={"mr-record-score " + tone} style={{ fontSize: "40px" }}>
            {score}
            <span className="mr-record-max"> / {max}</span>
          </div>
          <div className="mr-record-meta" style={{ marginTop: "10px" }}>{fmtDate(sub.submittedAt)}</div>
        </section>
        <div className="mr-list-top">
          <span className="mr-list-title">채점 결과</span>
        </div>
        <ReviewList exam={exam} sub={sub} />
      </div>
    );
  }

  return (
    <div className={"mr-col" + step} key="list">
      <div className="mr-list-top">
        <span className="mr-list-title">내 시험 기록</span>
      </div>

      <SegBar cls="mr-subtabs" n={2} i={sub0 === "exams" ? 0 : 1} onPick={(k) => goSub(k === 0 ? "exams" : "wrong")}>
        <button className={sub0 === "exams" ? "on" : ""} onClick={() => goSub("exams")}>
          시험별 {mine.length}
        </button>
        <button className={sub0 === "wrong" ? "on" : ""} onClick={() => goSub("wrong")}>
          틀린 문제 {wrong.length}
        </button>
      </SegBar>

      {sub0 === "wrong" ? (
        wrong.length === 0 ? (
          <Empty text={mine.length === 0 ? "아직 응시한 시험이 없어요." : "틀린 문제가 없어요. 대단해요!"} />
        ) : (
          <>
            <div className="mr-wrong-hint">틀린 문제만 모았어요. 해설이 있으면 함께 볼 수 있어요.</div>
            {wrong.map(({ exam, sub, q, qi }, i) => {
              const mine2 = sub.answers[q.id];
              return (
                <section className="mr-card mr-take-q wrong" key={sub.id + ":" + q.id} style={{ animationDelay: `${Math.min(i, 5) * 45}ms` }}>
                  <div className="mr-wrong-from">{exam.title} · Q{qi + 1} · {fmtDate(sub.submittedAt)}</div>
                  {q.image && <img className="mr-q-img" src={q.image} alt={"문제 " + (qi + 1)} />}
                  <QBody q={q} />
                  {q.type === "mc" ? (
                    <div className="mr-take-options">
                      {q.options.map((opt, oi) => {
                        const isAns = oi === q.answer;
                        const isMine = mine2 === oi;
                        let cls = "mr-take-opt review";
                        if (isAns) cls += " ans";
                        if (isMine && !isAns) cls += " mychoice";
                        return (
                          <div key={oi} className={cls}>
                            <span className="mr-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                            {opt}
                            {isAns && <span className="mr-opt-flag ans">정답</span>}
                            {isMine && !isAns && <span className="mr-opt-flag mine">내 답</span>}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="mr-short-review">
                      <div className="mr-sr-row">
                        <span className="mr-sr-k">내 답</span>
                        <span className="mr-sr-v no">{(mine2 && String(mine2).trim()) || "(미작성)"}</span>
                      </div>
                      <div className="mr-sr-row">
                        <span className="mr-sr-k">정답</span>
                        <span className="mr-sr-v ans">{q.accept || "—"}</span>
                      </div>
                    </div>
                  )}
                  <ExplainBlock q={q} exam={exam} />
                </section>
              );
            })}
          </>
        )
      ) : mine.length === 0 ? (
        <Empty text="아직 응시한 시험이 없어요." />
      ) : (
        <>
          <div className="mr-stat-grid">
            <div className="mr-stat"><div className="mr-stat-num">{mine.length}</div><div className="mr-stat-label">응시</div></div>
            <div className="mr-stat"><div className="mr-stat-num">{avgPct}%</div><div className="mr-stat-label">평균</div></div>
            <div className="mr-stat"><div className="mr-stat-num">{bestPct}%</div><div className="mr-stat-label">최고</div></div>
            <div className="mr-stat"><div className="mr-stat-num">{wrong.length}</div><div className="mr-stat-label">오답</div></div>
          </div>
          {trend.length >= 2 && (
            <>
              <div className="mr-dash-title">최근 점수 흐름</div>
              <div className="mr-spark">
                {trend.map((pct, i) => (
                  <div className="mr-spark-col" key={i}>
                    <div className="mr-spark-bar" style={{ height: pct + "%" }} />
                    <span className="mr-spark-cap">{pct}</span>
                  </div>
                ))}
              </div>
            </>
          )}
          <div className="mr-dash-title">시험별 기록</div>
          <div className="mr-postlist">
            {mine.map(({ sub, exam }, i) => {
              const score = totalScore(exam, sub);
              const max = maxScore(exam);
              const ratio = max ? score / max : 0;
              const tone = ratio >= 0.8 ? "good" : ratio >= 0.5 ? "mid" : "low";
              return (
                <button className="mr-record mr-record-btn" key={sub.id} style={{ animationDelay: `${Math.min(i, 5) * 45}ms` }} onClick={() => setOpen({ sub, exam })}>
                  <div className="mr-record-info">
                    <div className="mr-record-title">{exam.title}</div>
                    <div className="mr-record-meta">{fmtDate(sub.submittedAt)} · 채점 결과 보기</div>
                  </div>
                  <div className={"mr-record-score " + tone}>
                    {score}
                    <span className="mr-record-max"> / {max}</span>
                  </div>
                </button>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

/* ===================== 관리자 페이지 ===================== */
function Admin({ auth, isSuper, users, notices, exams, subs, auditLog, onToggleAdmin, onDeleteUser, onResetPassword, initialSub, pushUrl }) {
  const [subtab0, setSubtab0] = useState(
    initialSub === "members" || initialSub === "log" ? initialSub : "dash"
  );
  const setSubtab = (t) => {
    setSubtab0(t);
    if (pushUrl) pushUrl(t === "dash" ? "/admin" : "/admin/" + t);
  };
  // 회원 관리는 root 전용 — 일반 관리자에겐 탭도, 상세도 안 보임
  const subtab = !isSuper && subtab0 === "members" ? "dash" : subtab0;
  const adminTabs = isSuper ? ["dash", "members", "log"] : ["dash", "log"];
  const [selUser, setSelUser] = useState(null);
  const [q, setQ] = useState("");

  const stats = [
    { label: "회원", value: users.length },
    { label: "칼럼", value: notices.length },
    { label: "시험", value: exams.length },
    { label: "제출", value: subs.length },
  ];

  const toggleAdmin = async (username) => {
    const u = users.find((x) => x.username === username);
    await onToggleAdmin(username, !(u && u.isAdmin));
  };
  const removeUser = async (username) => {
    if (!confirm(`'${username}' 회원을 삭제할까요?`)) return;
    await onDeleteUser(username);
    if (selUser === username) setSelUser(null);
  };
  const resetPw = async (username) => {
    if (!confirm(`'${username}' 회원의 비밀번호를 0000 으로 초기화할까요?`)) return;
    await onResetPassword(username);
  };

  // 회원 관리 관련 기록은 root 에게만 (일반 관리자에겐 칼럼·시험 기록만)
  const MEMBER_ACTIONS = ["관리자 지정", "관리자 해제", "회원 삭제", "비밀번호 초기화"];
  const visibleLog = (auditLog || []).filter((g) => isSuper || !MEMBER_ACTIONS.includes(g.action));

  const sorted = [...users].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const kw = q.trim().toLowerCase();
  const filtered = kw
    ? sorted.filter(
        (u) =>
          u.username.toLowerCase().includes(kw) || (u.kakaoId || "").toLowerCase().includes(kw)
      )
    : sorted;

  const scoreTone = (ratio) => (ratio >= 0.8 ? "good" : ratio >= 0.5 ? "mid" : "low");

  if (selUser && isSuper) {
    const u = users.find((x) => x.username === selUser);
    const theirs = subs
      .filter((s) => s.student === selUser)
      .map((s) => ({ sub: s, exam: exams.find((e) => e.id === s.examId) }))
      .filter((r) => r.exam)
      .sort((a, b) => (b.sub.submittedAt || 0) - (a.sub.submittedAt || 0));

    return (
      <div className="mr-col">
        <button className="mr-back" onClick={() => setSelUser(null)}>
          회원 목록
        </button>
        {!u ? (
          <Empty text="회원을 찾을 수 없어요." />
        ) : (
          <>
            <section className="mr-card mr-account-card">
              <div className="mr-account-avatar">
                <PersonIcon />
              </div>
              <div className="mr-account-name">
                {u.username}
                {u.isSuper ? <span className="mr-user-badge super">root</span> : u.isAdmin && <span className="mr-user-badge">관리자</span>}
              </div>
              <div className="mr-account-role">
                {u.kakaoId ? `채팅방 ${u.kakaoId}` : "채팅방 미입력"}
                {u.createdAt ? ` · 가입 ${fmtDate(u.createdAt)}` : ""}

function AuthModal({ onClose, onLogin, onSignup }) {
  const [mode, setMode] = useState("login");
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [kakao, setKakao] = useState("");
  const [agree, setAgree] = useState(false);
  const [showPolicy, setShowPolicy] = useState(false);

  const doLogin = async () => {
    const { error } = await onLogin(id, pw);
    if (error) alert(error);
  };

  const doSignup = async () => {
    if (!agree) {
      alert("개인정보 수집·이용에 동의해주세요.");
      return;
    }
    const { error } = await onSignup(id, pw, kakao);
    if (error) alert(error);
  };

  const onEnter = (e) => {
    if (e.key === "Enter" && !e.nativeEvent.isComposing) (mode === "login" ? doLogin : doSignup)();
  };

  return (
    <div className="mr-modal-overlay" onClick={onClose}>
      <div className="mr-modal" onClick={(e) => e.stopPropagation()}>
        <div className="mr-modal-head">
          <span className="mr-modal-title">{mode === "login" ? "로그인" : "회원가입"}</span>

            ×
          </button>
        </div>

        <input
          className="mr-input"
          placeholder="아이디"
          value={id}
          onChange={(e) => setId(e.target.value)}
          onKeyDown={onEnter}
        />
        <input
          className="mr-input"
          type="password"
          placeholder="비밀번호"
          value={pw}
          onChange={(e) => setPw(e.target.value)}
          onKeyDown={onEnter}
        />
        {mode === "signup" && (
          <input
            className="mr-input"
            placeholder="채팅방 닉네임 (선택)"
            value={kakao}
            onChange={(e) => setKakao(e.target.value)}
            onKeyDown={onEnter}
          />
        )}

        {mode === "signup" && (
          <label className="mr-consent">
            <input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} />
            <span>
              <button type="button" className="mr-consent-link" onClick={() => setShowPolicy(true)}>개인정보 처리방침</button>
              에 동의하며, 만 14세 이상이고 개인정보 수집·이용에 동의합니다. (필수)
            </span>
          </label>
        )}

        <button
          className="mr-btn mr-modal-submit"
          onClick={mode === "login" ? doLogin : doSignup}
        >
          {mode === "login" ? "로그인" : "가입하고 시작하기"}
        </button>

        <div className="mr-modal-switch">
          {mode === "login" ? (
            <>
              아직 회원이 아니신가요?{" "}
              <button onClick={() => setMode("signup")}>회원가입</button>
            </>
          ) : (
            <>
              이미 계정이 있나요?{" "}
              <button onClick={() => setMode("login")}>로그인</button>
            </>
          )}
        </div>
      </div>

      {showPolicy && <PolicyModal onClose={() => setShowPolicy(false)} />}
    </div>
  );
}

/* 글 링크 공유. 폰에서는 기본 공유 시트가 뜨고, 안 되는 곳에서는 주소를 복사한다 */
function ShareButton({ path, title }) {
  const [msg, setMsg] = useState("");
  const share = async () => {
    const url = window.location.origin + path;
    const nav = window.navigator;
    try {
      if (nav.share) {
        await nav.share({ title, url });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return; // 사용자가 공유를 취소한 것
    }
    let ok = false;
    try {
      await nav.clipboard.writeText(url);
      ok = true;
    } catch (e) {}
    setMsg(ok ? "주소를 복사했어요" : "주소 복사가 안 돼요");
    setTimeout(() => setMsg(""), 1800);
  };
  return (
    <button className="mr-share" onClick={share}>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none"
        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M8 1.6 L8 9.6" />
        <path d="M5 4.5 L8 1.5 L11 4.5" />
        <path d="M3.2 8.6 L3.2 14 L12.8 14 L12.8 8.6" />
      </svg>
      {msg || "공유"}
    </button>
  );
}

/* 한 화면 안에서 목록과 글 사이를 오갈 때 들어오는 방향을 정한다.
   깊이가 커지면 오른쪽에서, 되돌아오면 왼쪽에서 들어온다.
   처음 들어올 때는 화면 전체 전환이 이미 돌고 있어서 아무것도 하지 않는다 */
function useStep(depth) {
  const prev = React.useRef(depth);
  const dir = React.useRef(null);
  if (depth !== prev.current) {
    dir.current = depth > prev.current ? "fwd" : "back";
    prev.current = depth;
  }
  return dir.current ? " mr-step-" + dir.current : "";
}

/* 칸을 눌러도 되고 알약을 잡아 끌어도 되는 토글.
   끄는 동안에는 --i 에 소수를 넣어 손가락을 그대로 따라가고, 손을 떼면 가까운 칸으로 붙는다.
   끌고 나서 나오는 click 은 막는다. 안 그러면 처음 누른 칸이 다시 선택된다 */
function SegBar({ cls, n, i, onPick, children }) {
  const ref = React.useRef(null);
  const start = React.useRef(null);
  const moved = React.useRef(false);
  const dragEndAt = React.useRef(0);
  const [at, setAt] = useState(null);

  // 칸 하나가 차지하는 가로 폭. 버튼 자리에서 직접 재야 여백과 간격이 달라도 맞는다
  const stepOf = () => {
    const el = ref.current;
    if (!el) return 0;
    const b = el.querySelectorAll("button");
    if (b.length < 2) return 0;
    return b[1].getBoundingClientRect().left - b[0].getBoundingClientRect().left;
  };

  const down = (e) => {
    if (n < 2) return;
    const step = stepOf();
    if (!step) return;
    start.current = { x: e.clientX, i, step };
    moved.current = false;
    dragEndAt.current = 0; // 새로 누르면 지난번 끌기의 흔적을 지운다
  };
  const move = (e) => {
    const s = start.current;
    if (!s) return;
    const dx = e.clientX - s.x;
    if (!moved.current) {
      if (Math.abs(dx) <= 4) return; // 아직 끄는 게 아니라 누르는 중
      moved.current = true;
      // 포인터는 진짜로 끌기 시작한 뒤에 붙잡는다. 누르자마자 붙잡으면
      // 뒤따라오는 click 이 버튼 대신 이 상자로 가서 그냥 누르기가 먹지 않는다
      try { ref.current.setPointerCapture(e.pointerId); } catch (err) {}
    }
    setAt(Math.max(0, Math.min(n - 1, s.i + dx / s.step)));
  };
  const up = () => {
    const s = start.current;
    start.current = null;
    if (!s) return;
    if (moved.current) {
      dragEndAt.current = Date.now();
      const target = at === null ? s.i : Math.round(at);
      setAt(null);
      if (target !== s.i) onPick(target);
    }
    moved.current = false;
  };
  // 끌고 난 직후에 딸려오는 click 만 막는다. 시각으로 재야 클릭이 안 오는 경우에도
  // 표시가 남아 다음 누르기를 잡아먹지 않는다
  const clickCapture = (e) => {
    if (Date.now() - dragEndAt.current > 400) return;
    dragEndAt.current = 0;
    e.stopPropagation();
    e.preventDefault();
  };

  return (
    <div
      ref={ref}
      className={cls + " mr-slide" + (at === null ? "" : " mr-dragging")}
      style={{ "--n": n, "--i": at === null ? i : at }}
      onPointerDown={down}
      onPointerMove={move}
      onPointerUp={up}
      onPointerCancel={up}
      onClickCapture={clickCapture}
    >
      {children}
    </div>
  );
}
