function Notices({ role, student, kakaoId, notices, onAdd, onDelete, onEdit, onReorder, readIds, onRead, initialNo, initialCat, urlBase, pushUrl, loggedIn, requireLogin }) {
  const goUrl = (path) => { if (pushUrl) pushUrl(path); };
  const CAT = { elem: "초등학교", mid: "중학교", high: "고등학교" };
  const CATS = ["elem", "mid", "high"];
  const [view, setView] = useState("list"); // list | write | read | edit
  const step = useStep({ list: 0, read: 1, write: 1, edit: 2 }[view] || 0);
  const CAT_KEYS = ["elem", "mid", "high"];
  const [cat, setCat0] = useState(
    CAT_KEYS.indexOf(initialCat) !== -1 ? initialCat : "elem"
  ); // 목록에서 보고 있는 분류 탭
  const setCat = (k) => { setCat0(k); goUrl("/column/" + k); };
  const [editCat, setEditCat] = useState("elem"); // 글 작성/수정 시 선택한 분류
  const [openId, setOpenId] = useState(null);
  const [draftId, setDraftId] = useState(null);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [savedNote, setSavedNote] = useState("");
  const [q, setQ] = useState("");

  const authorName = () => (kakaoId || "").trim() || (student || "").trim() || "익명";

  const newWrite = () => {
    setTitle("");
    setBody("");
    setDraftId(null);
    setEditCat(cat);
    setSavedNote("");
    setView("write");
  };
  const resumeDraft = (d) => {
    setTitle(d.title === "(제목 없음)" ? "" : d.title);
    setBody(d.body);
    setDraftId(d.id);
    setEditCat(d.category || "elem");
    setSavedNote("");
    setView("write");
  };

  // 임시저장 (발행 안 함)
  const saveDraft = async () => {
    if (!title.trim() && !body.trim()) return alert("내용을 입력하세요.");
    let ok;
    if (draftId) {
      ok = await onEdit(draftId, title.trim() || "(제목 없음)", body, true, editCat);
    } else {
      const newId = await onAdd({ title: title.trim() || "(제목 없음)", body, author: authorName(), isDraft: true, category: editCat });
      if (newId && newId !== true) setDraftId(newId);
      ok = !!newId;
    }
    if (ok) setSavedNote("임시저장됐어요"); // 실패하면 alert만 뜨고 작성 내용은 그대로 유지
  };

  // 발행 (목록에 공개)
  const post = async () => {
    if (!title.trim()) return alert("제목을 입력하세요.");
    let ok;
    if (draftId) {
      ok = await onEdit(draftId, title.trim(), body, false, editCat);
    } else {
      ok = await onAdd({ title: title.trim(), body, author: authorName(), isDraft: false, category: editCat });
    }
    if (!ok) return; // 발행 실패: 작성 내용을 지우지 않고 화면 유지
    setTitle("");
    setBody("");
    setDraftId(null);
    setCat(editCat);
    setView("list");
  };

  const remove = async (id) => {
    if (!confirm("이 칼럼을 삭제할까요?")) return;
    await onDelete(id);
    setOpenId(null);
    setView("list");
  };

  const saveEdit = async () => {
    if (!title.trim()) return alert("제목을 입력하세요.");
    const ok = await onEdit(openId, title.trim(), body, false, editCat);
    if (ok) setView("read"); // 실패 시 수정 화면 유지 (내용 보존)
  };

  // 주소로 들어온 글이 있으면 자동으로 열기 (데이터가 늦게 오므로 도착 후 처리)
  useEffect(() => {
    if (!initialNo) return;
    const n = findByNo(notices, initialNo);
    if (n) {
      setOpenId(n.id);
      setCat0(n.category || "elem");
      setView("read");
      if (onRead) onRead(n.id);
    }
  }, [notices, initialNo]);

  const openPost = (n) => {
    if (onRead) onRead(n.id);
    setOpenId(n.id);
    setView("read");
    if (n.no) goUrl("/" + urlBase + "/" + n.no);
  };
  const backToList = () => { setView("list"); goUrl("/column/" + cat); };

  const CatPicker = (
    <>
      <div className="mr-cat-label">대상</div>
      <SegBar cls="mr-cat-seg" n={CATS.length} i={Math.max(0, CATS.indexOf(editCat))} onPick={(k) => setEditCat(CATS[k])}>
        {CATS.map((k) => (
          <button key={k} className={editCat === k ? "on" : ""} onClick={() => setEditCat(k)}>
            {CAT[k]}
          </button>
        ))}
      </SegBar>
    </>
  );

  // 비회원: 목록 대신 로그인 안내
  if (!loggedIn)
    return (
      <div className="mr-col">
        <div className="mr-list-top">
          <span className="mr-list-title">칼럼</span>
        </div>
        <section className="mr-card mr-need-login">
          <div className="mr-need-icon">🔒</div>
          <h3 className="mr-need-title">칼럼은 회원만 볼 수 있어요</h3>
          <p className="mr-need-sub">
            로그인하면 초등·중학·고등 칼럼을 모두 읽을 수 있어요.
          </p>
          <button className="mr-btn mr-need-btn" onClick={requireLogin}>로그인하기</button>
        </section>
      </div>
    );

  // 글쓰기 / 임시저장 이어쓰기
  if (view === "write")
    return (
      <div className={"mr-col" + step} key="write">
        <button className="mr-back" onClick={() => setView("list")}>
          칼럼 목록
        </button>
        <section className="mr-card mr-writer">
          <div className="mr-card-tag">{draftId ? "임시저장 이어쓰기" : "새 칼럼 쓰기"}</div>
          <input
            className="mr-input mr-title-input"
            placeholder="제목"
            value={title}
            onChange={(e) => { setTitle(e.target.value); setSavedNote(""); }}
          />
          {CatPicker}
          <RichEditor
            value={body}
            onChange={(v) => { setBody(v); setSavedNote(""); }}
            placeholder="이야기를 자유롭게 풀어보세요. 풀이 접근법, 개념 정리, 공부 팁 무엇이든 좋아요."
          />
          <div className="mr-row-between" style={{ marginTop: "14px" }}>
            <span className="mr-ok-msg">{savedNote}</span>
            <div className="mr-gap">
              <button className="mr-btn-ghost" onClick={saveDraft}>
                임시저장
              </button>
              <button className="mr-btn" onClick={post}>
                발행하기
              </button>
            </div>
          </div>
        </section>
      </div>
    );

  // 글 수정하기 (발행된 글)
  if (view === "edit")
    return (
      <div className={"mr-col" + step} key="edit">
        <button className="mr-back" onClick={() => setView("read")}>
          칼럼 보기
        </button>
        <section className="mr-card mr-writer">
          <div className="mr-card-tag">칼럼 수정하기</div>
          <input
            className="mr-input mr-title-input"
            placeholder="제목"
            value={title}
            onChange={(e) => setTitle(e.target.value)}
          />
          {CatPicker}
          <RichEditor
            value={body}
            onChange={setBody}
            placeholder="내용을 입력하세요."
          />
          <div className="mr-row-end">
            <button className="mr-btn" onClick={saveEdit}>
              수정 완료
            </button>
          </div>
        </section>
      </div>
    );

  // 글 보기
  if (view === "read") {
    const n = notices.find((x) => x.id === openId);
    return (
      <div className={"mr-col" + step} key="read">
        <button className="mr-back" onClick={backToList}>
          칼럼 목록
        </button>
        {!n ? (
          <Empty text="글을 찾을 수 없어요." />
        ) : (
          <article className="mr-card mr-notice mr-post">
            <h1 className="mr-post-title">{n.title}</h1>
            <div className="mr-post-byline">
              {/* the rules post shows the date only, no author */}
              {!n.isRule && <span className="mr-avatar sm">{(n.author || "익")[0]}</span>}
              {n.isRule ? fmtDate(n.createdAt) : (n.author || "익명") + " · " + fmtDate(n.createdAt)}
              {n.no && (
                <span className="mr-post-share">
                  <ShareButton path={"/" + urlBase + "/" + n.no} title={n.title} />
                </span>
              )}
            </div>
            <div className="mr-post-divider" />
            {n.body ? <div className="mr-notice-body" dangerouslySetInnerHTML={{ __html: n.body }} /> : <p className="mr-muted">내용이 없어요.</p>}
            {role === "admin" && (
              <div className="mr-detail-actions" style={{ marginTop: "20px", justifyContent: "flex-end" }}>
                <button className="mr-mini-btn" onClick={() => { setTitle(n.title); setBody(n.body); setEditCat(n.category || "elem"); setDraftId(null); setView("edit"); }}>
                  수정
                </button>
                <button className="mr-mini-btn danger" onClick={() => remove(n.id)}>
                  삭제
                </button>
              </div>
            )}
          </article>
        )}
      </div>
    );
  }

  // 목록
  const inCat = (n) => (n.category || "elem") === cat;
  const kw = q.trim();
  const published = notices
    .filter((n) => !n.isDraft && inCat(n) && matchPost(n, kw))
    .sort((a, b) => (a.sortOrder - b.sortOrder) || (b.createdAt - a.createdAt));
  const drafts = notices.filter((n) => n.isDraft && inCat(n));

  const move = async (idx, dir) => {
    const j = idx + dir;
    if (j < 0 || j >= published.length) return;
    const ids = published.map((n) => n.id);
    const t = ids[idx];
    ids[idx] = ids[j];
    ids[j] = t;
    await onReorder(ids);
  };

  return (
    <div className={"mr-col" + step} key="list">
      <div className="mr-list-top">
        <span className="mr-list-title">칼럼</span>
        {role === "admin" && (
          <button className="mr-btn" onClick={newWrite}>
            글쓰기
          </button>
        )}
      </div>

      <SegBar cls="mr-subtabs" n={CATS.length} i={Math.max(0, CATS.indexOf(cat))} onPick={(k) => setCat(CATS[k])}>
        {CATS.map((k) => (
          <button key={k} className={cat === k ? "on" : ""} onClick={() => setCat(k)}>
            {CAT[k]}
          </button>
        ))}
      </SegBar>

      <input
        className="mr-input mr-search"
        placeholder="제목 · 내용 · 글쓴이 검색"
        value={q}
        onChange={(e) => setQ(e.target.value)}
      />

      {role === "admin" && drafts.length > 0 && (
        <>
          <div className="mr-draft-head">임시저장 {drafts.length}</div>
          <div className="mr-postlist">
            {drafts.map((n) => (
              <button key={n.id} className="mr-post-row" onClick={() => resumeDraft(n)}>
                <span className="mr-post-row-title">
                  {n.title}
                  <span className="mr-draft-badge">임시저장</span>
                </span>
                <span className="mr-post-row-meta">{fmtDate(n.createdAt)}</span>
              </button>
            ))}
          </div>
        </>
      )}

      {published.length === 0 ? (
        <Empty text={kw ? `\u0027${kw}\u0027 검색 결과가 없어요.` : "아직 발행된 칼럼이 없어요."} />
      ) : (
        <div className="mr-postlist">
          {published.map((n, i) => {
            const unread = readIds && !readIds.has(n.id);
            return (
            <div className="mr-post-item" key={n.id}>
              <button className="mr-post-row" onClick={() => openPost(n)}>
                <span className="mr-post-row-title">
                  {unread && <span className="mr-unread-dot" />}
                  {n.title}
                </span>
                <span className="mr-post-row-meta">
                  {n.author || "익명"} · {fmtDate(n.createdAt)}
                </span>
              </button>
              {role === "admin" && (
                <div className="mr-reorder">
                  <button onClick={() => move(i, -1)} disabled={i === 0} title="위로">▲</button>
                  <button onClick={() => move(i, 1)} disabled={i === published.length - 1} title="아래로">▼</button>
                </div>
              )}
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ===================== 공지사항 =====================
   칼럼과 같은 columns 테이블을 쓰고 category 를 'notice' 로 저장한다.
   분류 탭이 없고, 최신 글이 위로 오는 단순한 게시판. */
function Announcements({ role, student, kakaoId, posts, onAdd, onDelete, onEdit, onReorder, onSetRule, readIds, onRead, initialNo, initialSub, urlBase, pushUrl }) {
  const goUrl = (path) => { if (pushUrl) pushUrl(path); };
  const [view, setView] = useState("list"); // list | write | read | edit
  const step = useStep({ list: 0, read: 1, write: 1, edit: 2 }[view] || 0);
  const [openId, setOpenId] = useState(null);
  const [draftId, setDraftId] = useState(null);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [savedNote, setSavedNote] = useState("");
  const [q, setQ] = useState("");

  const authorName = () => (kakaoId || "").trim() || (student || "").trim() || "익명";
  const rulePost = posts.find((n) => n.isRule && !n.isDraft) || null;

  // 주소로 들어온 공지가 있으면 자동으로 열기
  useEffect(() => {
    if (!initialNo) return;
    const n = findByNo(posts, initialNo);
    if (n) {
      setOpenId(n.id);
      setView("read");
      if (onRead) onRead(n.id);
    }
  }, [posts, initialNo]);

  // /rules 로 들어오면 규칙으로 지정된 글을 연다
  useEffect(() => {
    if (initialSub !== "rules" || !rulePost) return;
    setOpenId(rulePost.id);
    setView("read");
    if (onRead) onRead(rulePost.id);
  }, [initialSub, rulePost && rulePost.id]);

  const openPost = (n) => {
    if (onRead) onRead(n.id);
    setOpenId(n.id);
    setView("read");
    if (n.no) goUrl("/" + urlBase + "/" + n.no);
  };
  const backToList = () => { setView("list"); goUrl("/notice"); };

  const newWrite = () => {
    setTitle(""); setBody(""); setDraftId(null); setSavedNote(""); setView("write");
  };
  const resumeDraft = (d) => {
    setTitle(d.title === "(제목 없음)" ? "" : d.title);
    setBody(d.body); setDraftId(d.id); setSavedNote(""); setView("write");
  };

  const saveDraft = async () => {
    if (!title.trim() && !body.trim()) return alert("내용을 입력하세요.");
    let ok;
    if (draftId) {
      ok = await onEdit(draftId, title.trim() || "(제목 없음)", body, true, "notice");
    } else {
      const newId = await onAdd({ title: title.trim() || "(제목 없음)", body, author: authorName(), isDraft: true, category: "notice" });
      if (newId && newId !== true) setDraftId(newId);
      ok = !!newId;
    }
    if (ok) setSavedNote("임시저장됐어요");
  };

  const post = async () => {
    if (!title.trim()) return alert("제목을 입력하세요.");
    let ok;
    if (draftId) {
      ok = await onEdit(draftId, title.trim(), body, false, "notice");
    } else {
      ok = await onAdd({ title: title.trim(), body, author: authorName(), isDraft: false, category: "notice" });
    }
    if (!ok) return; // 실패 시 작성 내용 보존
    setTitle(""); setBody(""); setDraftId(null); setView("list");
  };

  const remove = async (id) => {
    if (!confirm("이 공지를 삭제할까요?")) return;
    await onDelete(id);
    setOpenId(null);
    setView("list");
  };

  const saveEdit = async () => {
    if (!title.trim()) return alert("제목을 입력하세요.");
    const ok = await onEdit(openId, title.trim(), body, false, "notice");
    if (ok) setView("read");
  };

  if (view === "write")
    return (
      <div className={"mr-col" + step} key="write">
        <button className="mr-back" onClick={() => setView("list")}>공지사항</button>
        <section className="mr-card mr-writer">
          <div className="mr-card-tag">{draftId ? "임시저장 이어쓰기" : "새 공지 쓰기"}</div>
          <input className="mr-input mr-title-input" placeholder="제목" value={title}
            onChange={(e) => { setTitle(e.target.value); setSavedNote(""); }} />
          <RichEditor value={body} onChange={(v) => { setBody(v); setSavedNote(""); }}
            placeholder="회원들에게 알릴 내용을 적어주세요." />
          <div className="mr-row-between" style={{ marginTop: "14px" }}>
            <span className="mr-ok-msg">{savedNote}</span>
            <div className="mr-gap">
              <button className="mr-btn-ghost" onClick={saveDraft}>임시저장</button>
              <button className="mr-btn" onClick={post}>발행하기</button>
            </div>
          </div>
        </section>
      </div>
    );

  if (view === "edit")
    return (
      <div className={"mr-col" + step} key="edit">
        <button className="mr-back" onClick={() => setView("read")}>공지 보기</button>
        <section className="mr-card mr-writer">
          <div className="mr-card-tag">공지 수정하기</div>
          <input className="mr-input mr-title-input" placeholder="제목" value={title}
            onChange={(e) => setTitle(e.target.value)} />
          <RichEditor value={body} onChange={setBody} placeholder="내용을 입력하세요." />
          <div className="mr-row-end">
            <button className="mr-btn" onClick={saveEdit}>수정 완료</button>
          </div>
        </section>
      </div>
    );

  if (view === "read") {
    const n = posts.find((x) => x.id === openId);
    return (
      <div className={"mr-col" + step} key="read">
        <button className="mr-back" onClick={backToList}>공지사항</button>
        {!n ? (
          <Empty text="공지를 찾을 수 없어요." />
        ) : (
          <article className="mr-card mr-notice mr-post">
            {n.isRule && <div className="mr-rule-tag">메인규칙</div>}
            <h1 className="mr-post-title">{n.title}</h1>
            <div className="mr-post-byline">
              {/* the rules post shows the date only, no author */}
              {!n.isRule && <span className="mr-avatar sm">{(n.author || "익")[0]}</span>}
              {n.isRule ? fmtDate(n.createdAt) : (n.author || "익명") + " · " + fmtDate(n.createdAt)}
              {n.no && (
                <span className="mr-post-share">
                  <ShareButton path={"/" + urlBase + "/" + n.no} title={n.title} />
                </span>
              )}
            </div>
            <div className="mr-post-divider" />
            {n.body ? <div className="mr-notice-body" dangerouslySetInnerHTML={{ __html: n.body }} /> : <p className="mr-muted">내용이 없어요.</p>}
            {role === "admin" && (
              <div className="mr-detail-actions" style={{ marginTop: "20px", justifyContent: "flex-end" }}>
                {onSetRule && (
                  <button className="mr-mini-btn" onClick={() => onSetRule(n.isRule ? null : n.id)}>
                    {n.isRule ? "규칙 해제" : "메인규칙으로"}
                  </button>
                )}
                <button className="mr-mini-btn" onClick={() => { setTitle(n.title); setBody(n.body); setDraftId(null); setView("edit"); }}>수정</button>
                <button className="mr-mini-btn danger" onClick={() => remove(n.id)}>삭제</button>
              </div>
            )}
          </article>
        )}
      </div>
    );
  }

  // 목록
  const kw = q.trim();
  // 규칙은 목록에서 빼고 위쪽에 따로 둔다. 안 그러면 새 공지가 규칙 아래로 밀린다
  const published = posts
    .filter((n) => !n.isDraft && !n.isRule && matchPost(n, kw))
    .sort((a, b) => (a.sortOrder - b.sortOrder) || (b.createdAt - a.createdAt));
  const drafts = posts.filter((n) => n.isDraft);

  const move = async (idx, dir) => {
    const j = idx + dir;
    if (j < 0 || j >= published.length) return;
    const ids = published.map((n) => n.id);
    const t = ids[idx];
    ids[idx] = ids[j];
    ids[j] = t;
    await onReorder(ids);
  };

  return (
    <div className={"mr-col" + step} key="list">
      <div className="mr-list-top">
        <span className="mr-list-title">공지사항</span>
        {role === "admin" && <button className="mr-btn" onClick={newWrite}>공지 쓰기</button>}
      </div>

      {rulePost && (
        <button className="mr-rule-row" onClick={() => openPost(rulePost)}>
          <span className="mr-rule-row-tag">규칙</span>
          <span className="mr-rule-row-title">{rulePost.title}</span>
          <span className="mr-rule-row-go" aria-hidden="true" />
        </button>
      )}

      <input
        className="mr-input mr-search"
        placeholder="제목 · 내용 검색"
        value={q}
        onChange={(e) => setQ(e.target.value)}
      />

      {role === "admin" && drafts.length > 0 && (
        <>
          <div className="mr-draft-head">임시저장 {drafts.length}</div>
          <div className="mr-postlist">
            {drafts.map((n) => (
              <button key={n.id} className="mr-post-row" onClick={() => resumeDraft(n)}>
                <span className="mr-post-row-title">
                  {n.title}
                  <span className="mr-draft-badge">임시저장</span>
                </span>
                <span className="mr-post-row-meta">{fmtDate(n.createdAt)}</span>
              </button>
            ))}
          </div>
        </>
      )}

      {published.length === 0 ? (
        <Empty text={kw ? `\u0027${kw}\u0027 검색 결과가 없어요.` : "아직 등록된 공지가 없어요."} />
      ) : (
        <div className="mr-postlist">
          {published.map((n, i) => {
            const unread = readIds && !readIds.has(n.id);
            return (
              <div className="mr-post-item" key={n.id}>
                <button className="mr-post-row" onClick={() => openPost(n)}>
                  <span className="mr-post-row-title">
                    {unread && <span className="mr-unread-dot" />}
                    {n.title}
                  </span>
                  <span className="mr-post-row-meta">{n.author || "익명"} · {fmtDate(n.createdAt)}</span>
                </button>
                {role === "admin" && (
                  <div className="mr-reorder">
                    <button onClick={() => move(i, -1)} disabled={i === 0} title="위로">▲</button>
                    <button onClick={() => move(i, 1)} disabled={i === published.length - 1} title="아래로">▼</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ===================== 서식 입력기 (칼럼용) ===================== */
/* ===== 글 안의 링크: 쓰는 중에 바로 하이퍼링크로 바뀐다 ===== */
const LINK_FIND = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+\.[^\s<>"']{2,})/g;
const LINK_WHOLE = /^(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+\.[^\s<>"']{2,})$/i;
const hrefOf = (t) => (/^https?:\/\//i.test(t) ? t : "https://" + t);

// 커서 위치를 글자 수로 기억해 둔다 (링크로 바꾼 뒤 되돌리기 위해)
function caretOffsetIn(root) {
  try {
    const sel = document.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!root.contains(r.startContainer)) return null;
    const pre = r.cloneRange();
    pre.selectNodeContents(root);
    pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
  } catch (e) { return null; }
}
function setCaretOffset(root, offset) {
  if (offset === null || offset === undefined) return;
  try {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let acc = 0, node;
    while ((node = walker.nextNode())) {
      const len = node.nodeValue.length;
      if (acc + len >= offset) {
        const r = document.createRange();
        r.setStart(node, Math.max(0, Math.min(len, offset - acc)));
        r.collapse(true);
        const sel = document.getSelection();
        sel.removeAllRanges(); sel.addRange(r);
        return;
      }
      acc += len;
    }
    const r = document.createRange();
    r.selectNodeContents(root); r.collapse(false);
    const sel = document.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  } catch (e) {}
}
// 링크 상태를 글자에 맞춰 다시 맞춘다. 바뀐 게 있으면 true
function refreshLinks(root) {
  let changed = false;
  // 지금 커서가 어디 있는지 (아직 쓰는 중인 주소에서 문장부호를 떼어내지 않기 위해)
  let caretNode = null, caretOff = -1, caretLink = null;
  try {
    const sel = document.getSelection();
    if (sel && sel.rangeCount && root.contains(sel.getRangeAt(0).startContainer)) {
      const r = sel.getRangeAt(0);
      caretNode = r.startContainer; caretOff = r.startOffset;
      const el = caretNode.nodeType === 3 ? caretNode.parentElement : caretNode;
      if (el && el.closest) caretLink = el.closest("a.mrlink");
    }
  } catch (e) {}
  // 1) 이미 링크인 것: 글자가 바뀌었으면 주소를 고치고, 더는 주소가 아니면 링크를 푼다
  [].slice.call(root.querySelectorAll("a.mrlink")).forEach((a) => {
    const text = a.textContent || "";
    // 아직 이 링크에 커서가 있으면 쓰는 중이므로 뒤 문장부호를 그대로 둔다
    const tail = a === caretLink ? "" : (text.match(/[\s),.!?;:]+$/) || [""])[0];
    const core = tail ? text.slice(0, text.length - tail.length) : text;
    if (!LINK_WHOLE.test(core)) {
      a.parentNode.replaceChild(document.createTextNode(text), a);
      changed = true;
      return;
    }
    if (tail) {
      a.textContent = core;
      if (a.nextSibling && a.nextSibling.nodeType === 3) a.nextSibling.nodeValue = tail + a.nextSibling.nodeValue;
      else a.parentNode.insertBefore(document.createTextNode(tail), a.nextSibling);
      changed = true;
    }
    const href = hrefOf(core);
    if (a.getAttribute("href") !== href) { a.setAttribute("href", href); changed = true; }
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  });
  // 2) 아직 링크가 아닌 글자 중 주소처럼 생긴 것을 링크로 만든다
  //    (쪼개져 있는 글자 조각을 먼저 합쳐야 주소가 통째로 잡힌다)
  try { root.normalize(); } catch (e) {}
  const targets = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  while ((n = walker.nextNode())) {
    const p = n.parentElement;
    if (p && p.closest && p.closest("a, .mchip")) continue; // 링크 안·수식 칩은 건드리지 않음
    LINK_FIND.lastIndex = 0;
    if (LINK_FIND.test(n.nodeValue || "")) targets.push(n);
  }
  targets.forEach((t) => {
    const s = t.nodeValue || "";
    const frag = document.createDocumentFragment();
    let last = 0, m, made = false;
    LINK_FIND.lastIndex = 0;
    while ((m = LINK_FIND.exec(s))) {
      const endIdx = m.index + m[0].length;
      const after = s.charAt(endIdx); // 주소 바로 뒤 글자 (없으면 빈 문자열)
      const caretHere = t === caretNode && caretOff === endIdx;
      // 아직 주소를 치고 있는 중이면 그대로 둔다.
      // 띄어쓰기로 끝났거나, 커서가 다른 곳으로 옮겨갔을 때만 링크로 만든다.
      if (!(after && /\s/.test(after)) && caretHere) continue;
      let url = m[0];
      const tail = (url.match(/[),.!?;:]+$/) || [""])[0];
      if (tail) url = url.slice(0, url.length - tail.length);
      if (!url) continue;
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const a = document.createElement("a");
      a.className = "mrlink";
      a.href = hrefOf(url);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = url;
      frag.appendChild(a);
      if (tail) frag.appendChild(document.createTextNode(tail));
      last = endIdx;
      made = true;
    }
    if (!made) return; // 이 조각은 손대지 않는다 (커서가 튀지 않게)
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag, t);
    changed = true;
  });
  return changed;
}

/* 사진 한 장을 적당한 크기로 줄여 저장소에 올린다.
   올리기에 실패하면 글 안에 그대로 담아 저장한다 (사진이 사라지지 않게). */
function uploadPicture(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("사진을 읽지 못했어요."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("사진을 열지 못했어요."));
      img.onload = () => {
        const max = 1600;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement("canvas");
        c.width = width;
        c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = c.toDataURL("image/jpeg", 0.9);
        c.toBlob(
          async (blob) => {
            if (!blob) { resolve(dataUrl); return; }
            try {
              const path = "col-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
              const up = await sb.storage.from("exam-images").upload(path, blob, { contentType: "image/jpeg", upsert: false });
              if (up.error) throw up.error;
              const { data: pub } = sb.storage.from("exam-images").getPublicUrl(path);
              resolve(pub.publicUrl);
            } catch (err) {
              console.warn("사진 업로드 실패, 글에 담아서 저장:", err);
              resolve(dataUrl);
            }
          },
          "image/jpeg",
          0.9
        );
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function RichEditor({ value, onChange, placeholder }) {
  const ref = React.useRef(null);
  const lastRange = React.useRef(null);
  const draft = React.useRef({ latex: "", tree: null });
  const fileRef = React.useRef(null);
  const [picBusy, setPicBusy] = useState(false);
  const [building, setBuilding] = useState(null);
  React.useEffect(() => {
    if (ref.current && (value || "") !== ref.current.innerHTML) {
      ref.current.innerHTML = value || "";
    }
    // 최초 1회만 초기화 (입력 중 커서 유지)
  }, []);
  // 한글을 조합하는 중에는 글자를 건드리면 입력이 깨지므로 그때는 링크 처리를 미룬다
  const composing = React.useRef(false);
  const sync = () => {
    const el = ref.current;
    if (!el) return;
    if (composing.current) { onChange(el.innerHTML); return; }
    // 쓰는 중에 주소를 바로 링크로 바꾼다 (커서 자리는 그대로 유지)
    const off = caretOffsetIn(el);
    if (refreshLinks(el)) setCaretOffset(el, off);
    onChange(el.innerHTML);
  };
  const exec = (cmd, arg) => {
    document.execCommand(cmd, false, arg);
    if (ref.current) ref.current.focus();
    sync();
  };
  const tool = (e, cmd, arg) => {
    e.preventDefault(); // 선택 영역 유지
    exec(cmd, arg);
  };
  const saveRange = () => {
    const sel = document.getSelection();
    if (sel && sel.rangeCount && ref.current && ref.current.contains(sel.anchorNode)) {
      lastRange.current = sel.getRangeAt(0).cloneRange();
    }
  };
  const openNewMath = (e) => { e.preventDefault(); saveRange(); draft.current = { latex: "", tree: null }; setBuilding({ mode: "new" }); };
  /* 사진 넣기: 커서 자리에 글자처럼 끼워 넣는다 */
  const pickPicture = (e) => {
    e.preventDefault();
    saveRange();
    if (fileRef.current) fileRef.current.click();
  };
  const insertPicture = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPicBusy(true);
    try {
      const url = await uploadPicture(file);
      const el = ref.current;
      const img = document.createElement("img");
      img.src = url;
      img.className = "mrpic";
      const sp = document.createTextNode(" ");
      const range = lastRange.current && el && el.contains(lastRange.current.commonAncestorContainer) ? lastRange.current : null;
      if (range) {
        range.collapse(false);
        const frag = document.createDocumentFragment();
        frag.appendChild(img);
        frag.appendChild(sp);
        range.insertNode(frag);
        const r2 = document.createRange();
        r2.setStartAfter(sp); r2.collapse(true);
        const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r2);
      } else if (el) {
        el.appendChild(img);
        el.appendChild(sp);
      }
      sync();
      if (ref.current) ref.current.focus();
    } catch (err) {
      alert("사진을 넣지 못했어요. 잠시 후 다시 시도해 주세요.");
    } finally {
      setPicBusy(false);
    }
  };
  const openEditMath = (chip) => {
    draft.current = { latex: chip.dataset.latex || "", tree: null };
    setBuilding({ mode: "edit", chip });
  };
  const onBoxClick = (e) => {
    const chip = e.target && e.target.closest ? e.target.closest(".mchip") : null;
    if (chip) { e.preventDefault(); openEditMath(chip); }
  };
  const finishMath = () => {
    if (!building) return;
    const { latex } = draft.current;
    if (!String(latex || "").trim()) {
      // 비워서 완료하면: 수정 중이던 수식 칩은 삭제 (지우기 동작)
      if (building.mode === "edit" && building.chip && building.chip.parentNode) building.chip.parentNode.removeChild(building.chip);
      setBuilding(null);
      sync();
      return;
    }
    if (building.mode === "edit" && building.chip) {
      const chip = building.chip;
      chip.dataset.latex = latex;
      chip.dataset.tree = "";
      chip.innerHTML = chipInnerHtml(latex);
    } else {
      const el = ref.current;
      const frag = buildMixedFragment([{ type: "math", latex, tree: null }]);
      const sp = document.createTextNode("\u00A0");
      frag.appendChild(sp);
      const range = lastRange.current && el && el.contains(lastRange.current.commonAncestorContainer) ? lastRange.current : null;
      if (range) {
        range.collapse(false);
        range.insertNode(frag);
        const r2 = document.createRange();
        r2.setStartAfter(sp); r2.collapse(true);
        const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r2);
      } else if (el) {
        el.appendChild(frag);
      }
    }
    setBuilding(null);
    sync();
    if (ref.current) ref.current.focus();
  };
  const colors = ["#2c2347", "#8a8398", "#b23b5e", "#2f6f8f", "#3f7d5a", "#8a5cf0"];
  return (
    <div className="mr-rte-wrap">
      <div className="mr-rte-toolbar">
        <div className="mr-rte-tools">
          <button type="button" className="mr-rte-btn sm mathbtn" title="수식 넣기" onMouseDown={openNewMath}>＋수식</button>
          <button type="button" className="mr-rte-btn sm picbtn" title="사진 넣기" onMouseDown={pickPicture} disabled={picBusy}>
            {picBusy ? "올리는 중…" : "＋사진"}
          </button>
          <input ref={fileRef} type="file" accept="image/*" hidden onChange={insertPicture} />
          <span className="mr-rte-div" />
          <button type="button" className="mr-rte-btn" style={{ fontWeight: 800 }} title="굵게" onMouseDown={(e) => tool(e, "bold")}>가</button>
          <button type="button" className="mr-rte-btn" style={{ fontStyle: "italic" }} title="기울임" onMouseDown={(e) => tool(e, "italic")}>가</button>
          <button type="button" className="mr-rte-btn" style={{ textDecoration: "underline" }} title="밑줄" onMouseDown={(e) => tool(e, "underline")}>가</button>
          <button type="button" className="mr-rte-btn" style={{ textDecoration: "line-through" }} title="취소선" onMouseDown={(e) => tool(e, "strikeThrough")}>가</button>
          <span className="mr-rte-div" />
          <button type="button" className="mr-rte-btn sm" title="작게" onMouseDown={(e) => tool(e, "fontSize", "2")}>작게</button>
          <button type="button" className="mr-rte-btn sm" title="보통" onMouseDown={(e) => tool(e, "fontSize", "4")}>보통</button>
          <button type="button" className="mr-rte-btn sm" title="크게" onMouseDown={(e) => tool(e, "fontSize", "6")}>크게</button>
          <span className="mr-rte-div" />
          <button type="button" className="mr-rte-btn sm" title="고딕체" onMouseDown={(e) => tool(e, "fontName", "'Pretendard', sans-serif")}>고딕</button>
          <button type="button" className="mr-rte-btn sm" style={{ fontFamily: "serif" }} title="명조체" onMouseDown={(e) => tool(e, "fontName", "serif")}>명조</button>
          <span className="mr-rte-div" />
          {colors.map((c) => (
            <button
              type="button"
              key={c}
              className="mr-rte-color"
              style={{ background: c }}
              title="글자색"
              onMouseDown={(e) => tool(e, "foreColor", c)}
            />
          ))}
          <span className="mr-rte-div" />
          <button type="button" className="mr-rte-btn sm" title="색·크기 등 서식 지우기" onMouseDown={(e) => tool(e, "removeFormat")}>지우기</button>
        </div>
      </div>
      {building && (
        <div className="mr-rte-mathedit">
          <MathField initialLatex={draft.current.latex} onChange={(latex) => { draft.current = { latex, tree: null }; }} />
          <div className="mr-rich-mrow">
            <button type="button" className="mr-btn" onClick={finishMath}>{building.mode === "edit" ? "수정 완료" : "이 수식 넣기"}</button>
            <button type="button" className="mr-btn-text" onClick={() => setBuilding(null)}>취소</button>
          </div>
        </div>
      )}
      <div
        ref={ref}
        className="mr-rte"
        contentEditable
        suppressContentEditableWarning
        data-placeholder={placeholder || ""}
        onInput={sync}
        onCompositionStart={() => { composing.current = true; }}
        onCompositionEnd={() => { composing.current = false; sync(); }}
        onBlur={() => { saveRange(); sync(); }}
        onKeyUp={saveRange}
        onMouseUp={saveRange}
        onClick={onBoxClick}
      />
    </div>
  );
}
