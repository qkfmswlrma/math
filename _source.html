   - PC: 물리 키보드로 바로 입력 — / 분수, ^ 지수, sqrt 루트, pi π 등 단축 입력 내장
   - LaTeX 붙여넣기 인식, 값은 input 이벤트의 .value(LaTeX)로 받음 */
function MathField({ initialLatex, onChange }) {
  const ref = React.useRef(null);
  const cbRef = React.useRef(onChange);
  cbRef.current = onChange;
  const [latex, setLatex] = useState(initialLatex || "");
  const [ready, setReady] = useState(mathliveReady);

  // 수식 입력기를 열 때 MathLive를 불러온다 (이미 있으면 즉시 준비 완료)
  React.useEffect(() => {
    if (ready) return;
    let ok = true;
    loadMathLive().then(() => { if (ok) setReady(true); });
    return () => { ok = false; };
  }, [ready]);

  React.useEffect(() => {
    if (!ready) return;
    const mf = ref.current;
    if (!mf) return;
    try { mf.setAttribute("placeholder", "\\text{수식을 입력하세요}"); } catch (e) {}
    mf.value = initialLatex || "";
    const emit = () => {
      const v = mf.value || "";
      setLatex(v);
      cbRef.current(v, null);
    };
    emit(); // 수정 모드: 초기값도 부모에 전달해 바로 '수정 완료' 가능
    mf.addEventListener("input", emit);
    const t = setTimeout(() => { try { mf.focus(); } catch (e) {} }, 80);
    return () => { clearTimeout(t); mf.removeEventListener("input", emit); };
  }, [ready]);

  return (
    <div className="mr-mathfield">
      {ready
        ? <math-field ref={ref}></math-field>
        : <div className="mf-loading">수식 입력기 불러오는 중…</div>}
      {latex.trim() ? (
        <div className="mr-math-preview">
          <span className="mr-math-preview-tag">문제에 이렇게 보여요</span>
          <MathView latex={latex} block />
        </div>
      ) : null}
      <p className="mf-hint">키보드로 바로 입력돼요 — <b>/</b> 분수 · <b>^</b> 지수 · <b>sqrt</b> 루트 · <b>pi</b> π. 휴대폰은 입력창을 누르면 수식 키패드가 열리고, LaTeX 붙여넣기도 돼요.</p>
    </div>
  );
}

// 본문 표시: 텍스트+수식 조각을 한 줄로 인라인 렌더
function QuestionBody({ body }) {
  if (!body || !body.length) return null;
  // boxstart 와 boxend 사이는 조건 박스 안에 넣는다. 표시가 없는 예전 문제는 그대로 흐른다
  const out = [];
  let box = null;
  body.forEach((s, i) => {
    if (s.type === "boxstart") { box = []; return; }
    if (s.type === "boxend") {
      if (box) out.push(<div key={"box" + i} className="mr-qbox">{box}</div>);
      box = null;
      return;
    }
    const node = s.type === "text"
      ? <span key={i} className="mr-qbody-t">{s.v}</span>
      : <MathView key={i} latex={s.latex} />;
    (box || out).push(node);
  });
  if (box && box.length) out.push(<div key="boxlast" className="mr-qbox">{box}</div>);
  return <div className="mr-qbody">{out}</div>;
}
// 본문(신규 body) 우선, 없으면 옛 latex/text 폴백
function QBody({ q }) {
  if (q.body && q.body.length) return <QuestionBody body={q.body} />;
  return (
    <React.Fragment>
      {q.latex ? <MathView latex={q.latex} block /> : null}
      {q.text ? <div className="mr-q-cap">{q.text}</div> : null}
    </React.Fragment>
  );
}

let _segid = 0;
const segId = () => "s" + ++_segid;
// 편집기: 텍스트칸/수식칸을 순서대로 만드는 본문 작성기
function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function chipInnerHtml(latex) {
  try { return window.katex ? window.katex.renderToString(latex || "", { throwOnError: false }) : escapeHtml(latex); }
  catch (e) { return escapeHtml(latex); }
}
function chipHtml(latex, tree) {
  const t = tree ? encodeURIComponent(JSON.stringify(tree)) : "";
  return '<span class="mchip" contenteditable="false" data-latex="' + escapeHtml(latex || "") + '" data-tree="' + t + '">' + chipInnerHtml(latex) + "</span>";
}
// 조각들 → DOM 프래그먼트 (텍스트 노드 + 수식 칩)
function buildMixedFragment(parts) {
  const frag = document.createDocumentFragment();
  parts.forEach((p) => {
    if (p.type === "text") {
      String(p.v).split("\n").forEach((ln, i) => {
        if (i > 0) frag.appendChild(document.createElement("br"));
        if (ln) frag.appendChild(document.createTextNode(ln));
      });
    } else {
      const tmp = document.createElement("div");
      tmp.innerHTML = chipHtml(p.latex, p.tree);
      if (tmp.firstChild) frag.appendChild(tmp.firstChild);
    }
  });
  return frag;
}
function bodyToHtml(body) {
  if (!body || !body.length) return "";
  const piece = (s) => (s.type === "text" ? escapeHtml(s.v) : chipHtml(s.latex, s.tree));
  let html = "", buf = null;
  body.forEach((s) => {
    if (s.type === "boxstart") { buf = ""; return; }
    if (s.type === "boxend") { html += '<div class="qbox">' + (buf || "") + "</div>"; buf = null; return; }
    if (buf === null) html += piece(s);
    else buf += piece(s);
  });
  if (buf !== null) html += '<div class="qbox">' + buf + "</div>"; // 끝이 안 닫혔어도 살린다
  return html;
}
function htmlToBody(el) {
  const out = [];
  const pushText = (v) => {
    if (!v) return;
    if (out.length && out[out.length - 1].type === "text") out[out.length - 1].v += v;
    else out.push({ type: "text", v });
  };
  const walk = (node) => {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) { pushText(n.textContent); return; }
      if (n.nodeType !== 1) return;
      if (n.classList && n.classList.contains("mchip")) {
        let tree = null;
        try { tree = JSON.parse(decodeURIComponent(n.dataset.tree || "")); } catch (e) {}
        out.push({ type: "math", latex: n.dataset.latex || "", tree });
        return;
      }
      if (n.tagName === "BR") { pushText("\n"); return; }
      // 조건 박스: 안쪽을 시작과 끝 표시로 감싼다 (아래 블록 처리보다 먼저 봐야 한다)
      if (n.classList && n.classList.contains("qbox")) {
        out.push({ type: "boxstart" });
        walk(n);
        out.push({ type: "boxend" });
        return;
      }
      // div/p 등 줄 단위 래퍼: 줄바꿈 후 내부를 재귀 탐색 (중첩 칩 보존)
      const block = /^(DIV|P|LI)$/.test(n.tagName);
      if (block && out.length && !(out[out.length - 1].type === "text" && out[out.length - 1].v.endsWith("\n"))) pushText("\n");
      walk(n);
    });
  };
  walk(el);
  return out;
}

function RichBody({ value, onChange, ph }) {
  const ref = React.useRef(null);
  const lastRange = React.useRef(null);
  const draft = React.useRef({ latex: "", tree: null });
  const [building, setBuilding] = useState(null); // null | {mode:'new'} | {mode:'edit', chip}

  useEffect(() => {
    if (ref.current) ref.current.innerHTML = bodyToHtml(value);
  }, []);

  const saveRange = () => {
    const sel = document.getSelection();
    if (sel && sel.rangeCount && ref.current && ref.current.contains(sel.anchorNode)) {
      lastRange.current = sel.getRangeAt(0).cloneRange();
    }
  };
  const serialize = () => { if (ref.current) onChange(htmlToBody(ref.current)); };

  const openNew = () => { saveRange(); draft.current = { latex: "", tree: null }; setBuilding({ mode: "new" }); };
  const openEdit = (chip) => {
    draft.current = { latex: chip.dataset.latex || "", tree: null };
    setBuilding({ mode: "edit", chip });
  };
  const onBoxClick = (e) => {
    const chip = e.target && e.target.closest ? e.target.closest(".mchip") : null;
    if (chip) { e.preventDefault(); openEdit(chip); }
  };
  // 조건 박스 넣기: 커서 자리에 빈 박스를 만들고 그 안으로 커서를 옮긴다
  const insertBox = () => {
    const el = ref.current;
    if (!el) return;
    saveRange();
    const box = document.createElement("div");
    box.className = "qbox";
    box.appendChild(document.createElement("br"));
    const range = lastRange.current && el.contains(lastRange.current.commonAncestorContainer) ? lastRange.current : null;
    if (range) { range.collapse(false); range.insertNode(box); } else { el.appendChild(box); }
    try {
      const r = document.createRange();
      r.setStart(box, 0);
      r.collapse(true);
      const sel = document.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (err) {}
    el.focus();
    serialize();
  };
  const finishMath = () => {
    if (!building) return;
    const { latex } = draft.current;
    if (!String(latex || "").trim()) {
      // 비워서 완료하면: 수정 중이던 수식 칩은 삭제 (지우기 동작)
      if (building.mode === "edit" && building.chip && building.chip.parentNode) building.chip.parentNode.removeChild(building.chip);
      setBuilding(null);
      serialize();
      return;
    }
    if (building.mode === "edit" && building.chip) {
      const chip = building.chip;
      chip.dataset.latex = latex;
      chip.dataset.tree = "";
      chip.innerHTML = chipInnerHtml(latex);
    } else {
      const el = ref.current;
      const frag = buildMixedFragment([{ type: "math", latex, tree: null }]);
      const sp = document.createTextNode("\u00A0");
      frag.appendChild(sp);
      const range = lastRange.current && el && el.contains(lastRange.current.commonAncestorContainer) ? lastRange.current : null;
      if (range) {
        range.collapse(false);
        range.insertNode(frag);
        const r2 = document.createRange();
        r2.setStartAfter(sp); r2.collapse(true);
        const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r2);
      } else if (el) {
        el.appendChild(frag);
      }
    }
    setBuilding(null);
    serialize();
    if (ref.current) ref.current.focus();
  };

  return (
    <div className="mr-rich">
      <div
        ref={ref}
        className="mr-rich-box"
        contentEditable
        suppressContentEditableWarning
        onInput={serialize}
        onBlur={() => { saveRange(); serialize(); }}
        onKeyUp={saveRange}
        onMouseUp={saveRange}
        onClick={onBoxClick}
        data-ph={ph || "문제 본문을 입력하세요. 수식은 아래 ＋수식 버튼으로 넣어요."}
      />
      <div className="mr-rich-add">
        <button type="button" className="mr-btn-soft" onClick={openNew}>＋ 수식 넣기</button>
        <button type="button" className="mr-btn-soft" onClick={insertBox}>＋ 조건 박스</button>
        <span className="mr-rich-tip">조건 박스 안에도 수식을 넣을 수 있어요</span>
      </div>
      {building && (
        <div className="mr-rich-mathedit">
          <MathField initialLatex={draft.current.latex} onChange={(latex) => { draft.current = { latex, tree: null }; }} />
          <div className="mr-rich-mrow">
            <button type="button" className="mr-btn" onClick={finishMath}>{building.mode === "edit" ? "수정 완료" : "이 수식 넣기"}</button>
            <button type="button" className="mr-btn-text" onClick={() => setBuilding(null)}>취소</button>
          </div>
        </div>
      )}
    </div>
  );
}

function QuestionImage({ value, onChange }) {
  const [busy, setBusy] = useState(false);

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s);
          height = Math.round(height * s);
        }
        const c = document.createElement("canvas");
        c.width = width;
        c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = c.toDataURL("image/jpeg", 0.92);
        c.toBlob(
          async (blob) => {
            if (!blob) {
              onChange(dataUrl);
              return;
            }
            setBusy(true);
            try {
              const path = "q-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
              const up = await sb.storage.from("exam-images").upload(path, blob, { contentType: "image/jpeg", upsert: false });
              if (up.error) throw up.error;
              const { data: pub } = sb.storage.from("exam-images").getPublicUrl(path);
              onChange(pub.publicUrl);
            } catch (err) {
              console.warn("이미지 업로드 실패, 내장 방식으로 저장:", err);
              onChange(dataUrl); // 실패 시 base64로 폴백 (기능은 유지)
            } finally {
              setBusy(false);
            }
          },
          "image/jpeg",
          0.92
        );
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  if (busy)
    return (
      <div className="mr-img-drop">
        <span className="mr-img-main">업로드 중…</span>
      </div>
    );

  if (value)
    return (
      <div className="mr-img-preview">
        <img src={value} alt="문제 미리보기" />
        <label className="mr-img-change">
          <input type="file" accept="image/*" onChange={onFile} hidden />
          사진 변경
        </label>
        <button className="mr-img-del" onClick={() => onChange("")}>
          삭제
        </button>
      </div>
    );

  return (
    <label className="mr-img-drop">
      <input type="file" accept="image/*" onChange={onFile} hidden />
      <span className="mr-img-icon">📷</span>
      <span className="mr-img-main">문제 사진 올리기</span>
      <span className="mr-img-sub">탭해서 사진 선택 · 손글씨/인쇄 문제 모두 가능</span>
    </label>
  );
}

/* ===== 토글: 켜진 칸으로 흰 알약이 미끄러져 간다 =====
   .mr-slide 를 붙이고 칸 개수(--n)와 켜진 칸 번호(--i)를 넘기면 알약이 움직인다.
   버튼이 flex:1 이라 칸 너비가 모두 같으므로 번호만으로 자리를 구할 수 있다 */
/* 세로 스크롤은 그대로 두고 가로로 끄는 것만 우리가 처리한다 */
.mr-slide{position:relative; isolation:isolate; touch-action:pan-y; -webkit-user-select:none; user-select:none}
.mr-slide::before{
  content:""; position:absolute; z-index:-1; top:var(--sp); bottom:var(--sp); left:var(--sp);
  width:calc((100% - 2 * var(--sp) - (var(--n) - 1) * var(--sg)) / var(--n));
  transform:translateX(calc(var(--i) * (100% + var(--sg))));
  background:#fff; border-radius:var(--sr); box-shadow:0 1px 3px rgba(0,0,0,.08);
  transition:transform .34s var(--ease-screen);
}
/* 끄는 동안에는 손가락을 그대로 따라와야 하므로 부드럽게 따라가는 설정을 끈다.
   위 규칙과 우선순위가 같으므로 반드시 뒤에 와야 이긴다 */
.mr-dragging::before{transition:none}
/* 알약이 대신 그려주므로 버튼 자신은 배경을 그리지 않는다 (어두운 모드 몫은 맨 아래에) */
.mr-slide button.on{background:transparent; box-shadow:none}
.mr-subtabs.mr-slide{--sp:4px; --sg:6px; --sr:10px}
.mr-cat-seg.mr-slide{--sp:4px; --sg:4px; --sr:8px}
.mr-sortseg.mr-slide{--sp:3px; --sg:2px; --sr:8px}
.mr-seg.mr-slide{--sp:3px; --sg:2px; --sr:7px}
.mr-seg.mr-slide button{flex:1}
.mr-member-row{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent;
  border:0; border-bottom:1px solid var(--line-soft); padding:14px 18px; cursor:pointer;
  font-family:inherit; transition:background .12s;
}
.mr-member-row:last-child{border-bottom:0}
.mr-member-row:hover{background:var(--bg)}
.mr-member-row .mr-member-info{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
.mr-detail-actions{display:flex; gap:8px; margin-top:14px}
.mr-record{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line-soft); animation:rise .5s var(--ease) both}
.mr-record:last-child{border-bottom:0}
.mr-record-btn{width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line-soft); font-family:inherit; cursor:pointer; transition:background .12s}
.mr-record-btn:hover{background:var(--bg)}
.mr-record-info{flex:1; min-width:0}
.mr-record-title{font-size:15px; font-weight:700; color:var(--t1); letter-spacing:-0.3px}
.mr-record-meta{font-size:12.5px; color:var(--t3); font-weight:600; margin-top:3px}
.mr-record-score{font-size:19px; font-weight:800; letter-spacing:-0.5px; flex:none}
.mr-record-score.good{color:var(--green)}
.mr-record-score.mid{color:var(--blue)}
.mr-record-score.low{color:var(--red)}
.mr-record-max{font-size:13px; font-weight:700; color:var(--t3)}
.mr-stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.mr-stat{background:var(--bg); border-radius:14px; padding:14px 8px; text-align:center}
.mr-stat-num{font-size:22px; font-weight:800; color:var(--blue); letter-spacing:-0.5px}
.mr-stat-label{font-size:12px; font-weight:700; color:var(--t2); margin-top:2px}
.mr-member-list{display:flex; flex-direction:column}
.mr-member:last-child{border-bottom:0}
.mr-member-info{flex:1; min-width:0}
.mr-member-name{display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:700; color:var(--t1)}
.mr-member-meta{font-size:12px; color:var(--t3); font-weight:600; margin-top:2px}
.mr-member-nick{font-weight:800; color:var(--t1)}
.mr-user-badge{font-size:10.5px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:middle}
.mr-user-badge.super{color:#fff; background:var(--grad); box-shadow:0 2px 8px rgba(124,92,255,0.35)}
.mr-super-note{margin-top:14px; font-size:12.5px; color:var(--t3); font-weight:600; line-height:1.6; background:var(--bg); border-radius:11px; padding:11px 13px; text-align:center}
.mr-mini-btn{border:0; background:var(--bg); color:var(--t2); font-family:inherit; font-weight:700; font-size:12px; padding:7px 10px; border-radius:9px; cursor:pointer; white-space:nowrap}
.mr-mini-btn:hover{background:var(--blue-bg); color:var(--blue)}
.mr-mini-btn.danger:hover{background:var(--red-bg); color:var(--red)}
.mr-exam-summary{display:flex; flex-direction:column}
.mr-exam-sum-row{padding:12px 0; border-bottom:1px solid var(--line-soft)}
.mr-exam-sum-row:last-child{border-bottom:0}
.mr-exam-sum-title{font-size:14.5px; font-weight:700; color:var(--t1)}
.mr-exam-sum-meta{font-size:12.5px; color:var(--t3); font-weight:600; margin-top:3px}
.mr-log-list{display:flex; flex-direction:column}
.mr-log-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-soft)}
.mr-log-row:last-child{border-bottom:0}
.mr-log-main{display:flex; align-items:center; gap:7px; flex-wrap:wrap; min-width:0}
.mr-log-actor{font-size:13.5px; font-weight:800; color:var(--t1)}
.mr-log-action{font-size:13px; font-weight:700; color:var(--blue); background:var(--blue-bg); padding:3px 9px; border-radius:20px}
.mr-log-target{font-size:13px; color:var(--t2); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px}
.mr-log-time{font-size:12px; color:var(--t3); font-weight:600; white-space:nowrap; flex:none}

/* 모달 */
.mr-modal-overlay{
  position:fixed; inset:0; z-index:400; background:rgba(180,170,200,.10);
  -webkit-backdrop-filter:blur(14px) saturate(120%); backdrop-filter:blur(14px) saturate(120%);
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fade .28s var(--ease) both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mr-modal{
  width:100%; max-width:360px; background:var(--card); border-radius:24px; padding:24px;
  display:flex; flex-direction:column; gap:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.25); animation:popIn .34s var(--ease) both;
}
.mr-modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
.mr-modal-title{font-size:20px; font-weight:800; letter-spacing:-0.5px}
.mr-modal-x{border:0; background:none; font-size:26px; line-height:1; color:var(--t3); cursor:pointer; padding:0 2px}
.mr-modal .mr-input{margin-top:0}
.mr-modal-submit{margin-top:6px; width:100%; padding:14px}
.mr-modal-switch{text-align:center; font-size:13px; color:var(--t3); margin-top:4px}
.mr-modal-switch button{border:0; background:none; color:var(--blue); font-weight:700; font-family:inherit; font-size:13px; cursor:pointer; padding:0}


/* layout */
/* 좌우 여백은 헤더(20px)와 같게 맞춘다. 로고·본문·뒤로가기 왼쪽 끝이 한 줄로 떨어진다 */
.mr-main{max-width:var(--col); margin:0 auto; padding:20px}
.mr-col{display:flex; flex-direction:column; gap:12px}

/* home */
.mr-hero{padding:14px 4px 6px}
.mr-hero-greet{font-size:14px; font-weight:700; color:var(--blue); margin-bottom:8px}
.mr-hero-title{font-size:26px; font-weight:800; line-height:1.35; letter-spacing:-0.6px; color:var(--t1)}
.mr-sectors{display:flex; flex-direction:column; gap:12px; margin-top:6px}
.mr-pick2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px}
.mr-pick-card{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; background:var(--card); border:0; border-radius:20px; padding:30px 16px; box-shadow:0 1px 2px rgba(0,0,0,.03); cursor:pointer; font-family:inherit; transition:transform .1s, box-shadow .15s; animation:rise .5s var(--ease) both}
.mr-pick-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.07)}
.mr-pick-card:active{transform:scale(.98)}
.mr-pick-icon{width:60px; height:60px; border-radius:18px; display:grid; place-items:center; font-size:30px; position:relative}
.mr-mathfield{display:flex; flex-direction:column; gap:8px; margin-top:4px}
.mr-qbody{font-size:13.5px; line-height:1.85; color:var(--t1); white-space:pre-wrap; word-break:break-word; overflow-x:auto}
.mr-qbody .katex{font-size:1em}
.mr-qbody-t{white-space:pre-wrap}
.mr-qbody .mr-math{margin:0 2px; vertical-align:middle}
/* 조건 박스: 시험지의 (가) (나) 조건을 담는 네모칸. 경계가 분명히 보여야 한다 */
.mr-qbox{display:block; border:1.5px solid rgba(120,95,170,0.38); border-radius:10px; padding:13px 15px; margin:11px 0; background:var(--card)}
.mr-qbox .mr-qbody-t{white-space:pre-wrap}
.mr-rich{display:flex; flex-direction:column; gap:8px; margin-top:4px}
.mr-rich-box{min-height:80px; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card); font-size:15.5px; line-height:2; color:var(--t1); outline:none; white-space:pre-wrap; word-break:break-word}
.mr-rich-box:focus{border-color:var(--blue)}
.mr-rich-box:empty:before{content:attr(data-ph); color:var(--t3)}
.mr-rich-box .mchip{display:inline-block; vertical-align:middle; margin:0 2px; padding:1px 5px; background:var(--blue-bg); border-radius:6px; cursor:pointer; font-size:17px}
/* 쓰는 중에도 박스가 보이게 */
.mr-rich-box .qbox{border:1.5px solid rgba(120,95,170,0.38); border-radius:10px; padding:10px 12px; margin:8px 0; background:var(--bg)}
.mr-rich-mathedit{border:1.5px solid var(--blue); border-radius:12px; padding:10px; background:var(--blue-bg)}
.mr-rich-mrow{display:flex; gap:10px; align-items:center; margin-top:8px}
.mr-rich-add{display:flex; gap:10px; align-items:center}
.mr-rich-tip{font-size:12px; color:var(--t3)}
.mr-btn-soft{border:1px dashed var(--line); background:var(--bg); color:var(--t2); font-family:inherit; font-size:14px; font-weight:700; padding:10px 14px; border-radius:10px; cursor:pointer}
.mr-btn-soft:active{background:var(--blue-bg); color:var(--blue)}
.mr-math-preview{background:var(--bg); border-radius:12px; padding:18px 14px 14px; text-align:center; position:relative; overflow-x:auto}
/* ===== MathLive 수식 입력창 ===== */
math-field{display:block; width:100%; font-size:19px; min-height:52px; padding:6px 8px;
  border:1.5px solid var(--line); border-radius:12px; background:rgba(255,255,255,0.92); color:var(--t1);
  --caret-color:#8a5cf0; --selection-background-color:rgba(140,92,240,0.25)}
math-field:focus-within{outline:none; box-shadow:inset 0 0 0 2px var(--blue); background:#fff}
math-field::part(menu-toggle){display:none}
body{--keyboard-zindex:700} /* 수식 키패드가 카드 오버레이(150)·모달(460)보다 위에 뜨도록 */
.mf-hint{font-size:12px; color:var(--t3); margin:8px 2px 0; line-height:1.5}
.mf-loading{font-size:13px; color:var(--t3); font-weight:600; padding:18px; text-align:center; background:var(--bg); border-radius:12px}
.mr-math-preview-tag{position:absolute; top:6px; left:10px; font-size:10.5px; font-weight:700; color:var(--t3)}
.mr-math-block{display:block; margin:6px 0; overflow-x:auto}
.mr-math{display:inline-block}
.mr-pick-icon.blue{background:var(--blue-bg)}
.mr-pick-icon.green{background:var(--green-bg)}
.mr-pick-title{font-size:17px; font-weight:800; color:var(--t1); letter-spacing:-0.4px}
.mr-pick-desc{font-size:12.5px; color:var(--t3); font-weight:600}
.mr-sector{
  display:flex; align-items:center; gap:15px; width:100%; text-align:left;
  background:var(--card); border:0; border-radius:20px; padding:20px;
  box-shadow:0 1px 2px rgba(0,0,0,.03); cursor:pointer; font-family:inherit;
  transition:transform .1s, box-shadow .15s; animation:rise .5s var(--ease) both;
}
.mr-sector:hover{box-shadow:0 6px 18px rgba(0,0,0,.07)}
.mr-sector:active{transform:scale(.99)}
.mr-sector.soon{cursor:default; opacity:.7}
.mr-sector.soon:hover{box-shadow:0 1px 2px rgba(0,0,0,.03)}
.mr-sector-icon{
  width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
  font-size:26px; flex:none; position:relative;
}
.mr-sector-dot{position:absolute; top:-2px; right:-2px; width:12px; height:12px; border-radius:50%; background:var(--red); border:2.5px solid var(--card)}
.mr-sector-icon.blue{background:var(--blue-bg)}
.mr-sector-icon.green{background:var(--green-bg)}
.mr-sector-icon.gray{background:var(--bg)}
.mr-sector-text{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
.mr-sector-title{font-size:18px; font-weight:800; color:var(--t1); letter-spacing:-0.4px}
.mr-sector-desc{font-size:13.5px; color:var(--t2); line-height:1.4}
.mr-sector-meta{font-size:12.5px; color:var(--t3); font-weight:600; margin-top:2px}
.mr-sector-arrow{font-size:20px; color:var(--t3); flex:none; font-weight:700}
.mr-loading,.mr-empty{text-align:center; color:var(--t3); padding:56px 0; font-size:15px; font-weight:600}
.mr-empty{background:var(--card); border-radius:20px}

/* cards */
.mr-card{
  background:var(--card); border-radius:20px; padding:20px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
  animation:rise .5s var(--ease) both;
}
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
/* 모달, 시트, 달력처럼 떠오르는 것은 살짝 커지면서 나타난다 */
@keyframes popIn{from{opacity:0; transform:translateY(16px) scale(.96)}to{opacity:1; transform:none}}
/* 목록은 한꺼번에 튀어나오지 않고 위에서부터 차례로 올라온다 */
.mr-sector:nth-child(2),.mr-post-item:nth-child(2),.mr-pick-card:nth-child(2),.mr-record:nth-child(2){animation-delay:.045s}
.mr-sector:nth-child(3),.mr-post-item:nth-child(3),.mr-pick-card:nth-child(3),.mr-record:nth-child(3){animation-delay:.09s}
.mr-sector:nth-child(4),.mr-post-item:nth-child(4),.mr-pick-card:nth-child(4),.mr-record:nth-child(4){animation-delay:.135s}
.mr-sector:nth-child(5),.mr-post-item:nth-child(5),.mr-pick-card:nth-child(5),.mr-record:nth-child(5){animation-delay:.18s}
.mr-sector:nth-child(n+6),.mr-post-item:nth-child(n+6),.mr-pick-card:nth-child(n+6),.mr-record:nth-child(n+6){animation-delay:.225s}
.mr-card-tag{display:block; font-size:17px; font-weight:800; color:var(--t1); margin-bottom:14px; letter-spacing:-0.4px}
.mr-notice-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.mr-notice-head h3{font-size:17px; font-weight:800; letter-spacing:-0.4px; line-height:1.4}
.mr-date{font-size:12.5px; color:var(--t3); white-space:nowrap; font-weight:600}
.mr-notice-body{margin-top:8px; color:var(--t2); line-height:1.65; white-space:pre-wrap; font-size:14.5px}
.mr-link-del{margin-top:12px; border:0; background:none; color:var(--t3); cursor:pointer; font-size:13px; font-family:inherit; font-weight:700}
.mr-link-del:hover{color:var(--red)}
.mr-exam-meta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:9px; font-size:13.5px; color:var(--t2); font-weight:600}
.mr-sched-tag{display:inline-block; margin-top:8px; background:#FFF4E5; color:#C2540A; font-size:12.5px; font-weight:800; padding:5px 11px; border-radius:8px}
.mr-sched-hint{font-size:12.5px; color:var(--t3); line-height:1.6; margin:8px 2px 0}
.mr-exam-meta span:nth-child(even){color:var(--line)}
/* 응시 화면의 공유 버튼은 오른쪽 끝으로. 버튼이 색을 직접 정하므로 위 흐린 색 규칙에 안 걸린다 */
.mr-exam-share{margin-left:auto}

/* inputs */
.mr-input,.mr-textarea{
  width:100%; border:none; background:var(--bg); border-radius:12px; padding:13px 14px;
  font-family:inherit; font-size:15px; color:var(--t1); margin-top:10px; transition:background .15s;
}
.mr-input::placeholder,.mr-textarea::placeholder{color:var(--t3)}
.mr-input:focus,.mr-textarea:focus{outline:none; background:#fff; box-shadow:inset 0 0 0 2px var(--blue)}
.mr-textarea{resize:vertical; line-height:1.6}
.mr-writer .mr-input:first-of-type{margin-top:0}

/* 서식 입력기 */
.mr-rte-wrap{margin-top:10px; border-radius:12px; background:#fff; box-shadow:inset 0 0 0 1px var(--line)}
.mr-rte-toolbar{position:sticky; top:72px; z-index:9; background:#fff; border-bottom:1px solid var(--line-soft); border-radius:12px 12px 0 0; padding:6px 8px; box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.mr-rte-toolbar::after{content:""; position:absolute; top:6px; right:0; bottom:6px; width:26px; background:linear-gradient(to left, #fff 25%, rgba(255,255,255,0)); pointer-events:none; border-radius:0 12px 0 0}
.mr-rte-tools{display:flex; align-items:center; gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-right:18px}
.mr-rte-tools::-webkit-scrollbar{display:none}
.mr-rte-tools > *{flex:0 0 auto}
.mr-rte-btn.mathbtn{background:var(--blue-bg); color:var(--blue); font-weight:800}
.mr-rte-btn.picbtn{background:var(--green-bg); color:var(--green); font-weight:800}
.mr-rte-btn.picbtn:hover{background:var(--green-bg); color:var(--green)}
.mr-rte-btn:disabled{opacity:.6; cursor:default}
/* 글 안의 사진: 글자처럼 줄 안에 흐르고, 화면보다 커지지 않는다 */
.mr-rte img,.mr-notice-body img{max-width:100%; height:auto; vertical-align:middle; border-radius:12px; margin:2px 0}
/* 글 안의 링크 */
.mr-rte a.mrlink,.mr-notice-body a{color:var(--blue); font-weight:700; text-decoration:underline; text-underline-offset:2px; word-break:break-all}
.mr-notice-body a:hover{filter:brightness(1.1)}
.mr-rte-mathedit{border:1.5px solid var(--blue); margin:8px; border-radius:12px; padding:10px; background:var(--blue-bg)}
.mr-rte .mchip{display:inline-block; vertical-align:middle; margin:0 2px; padding:1px 5px; background:var(--blue-bg); border-radius:6px; cursor:pointer; font-size:16px}
.mr-rte-btn{border:0; background:var(--bg); color:var(--t1); min-width:34px; height:34px; padding:0 9px; border-radius:8px; font-family:inherit; font-size:15px; cursor:pointer; transition:background .12s; line-height:1}
.mr-rte-btn.sm{font-size:13px; font-weight:700}
.mr-rte-btn:hover{background:var(--blue-bg); color:var(--blue)}
.mr-rte-div{width:1px; height:20px; background:var(--line); margin:0 3px}
.mr-rte-color{width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; transition:transform .1s}
.mr-rte-color:hover{transform:scale(1.15)}
.mr-rte{min-height:240px; padding:14px; font-size:15px; line-height:1.75; color:var(--t1); outline:none; white-space:pre-wrap; word-break:break-word}
.mr-rte:empty:before{content:attr(data-placeholder); color:var(--t3)}

/* buttons */
.mr-btn{
  border:0; background:var(--grad); color:#fff; padding:12px 20px; border-radius:14px;
  font-family:inherit; font-weight:700; font-size:15px; cursor:pointer; transition:filter .15s,transform .08s;
  box-shadow:0 8px 20px rgba(124,92,255,0.35), inset 0 1px 1px rgba(255,255,255,0.5);
}
.mr-btn:hover{filter:brightness(1.05)}
.mr-btn:active{transform:scale(.98)}
.mr-btn-ghost{
  border:0; background:var(--blue-bg); color:var(--blue); padding:11px 18px; border-radius:13px;
  font-family:inherit; font-weight:700; font-size:14.5px; cursor:pointer; transition:background .15s;
}
.mr-btn-ghost:hover{background:#DBEAFE}
.mr-btn-ghost.danger{background:var(--red-bg); color:var(--red)}
.mr-btn-ghost.danger:hover{background:#FBD5DA}
.mr-btn-text{border:0; background:none; color:var(--t2); cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:700; align-self:flex-start; padding:4px 0}
.mr-back,.mr-page-back{display:inline-flex; align-items:center; gap:7px; align-self:flex-start; border:1px solid var(--line); background:var(--card); color:var(--t2); cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; padding:9px 16px 9px 13px; border-radius:999px; margin-bottom:6px; box-shadow:0 4px 14px rgba(91,55,140,0.10); transition:background .15s,color .15s}
.mr-back:hover,.mr-page-back:hover{background:var(--blue-bg); color:var(--blue)}
.mr-back:active,.mr-page-back:active{transform:scale(.97)}
/* 주소로 바로 들어온 화면에는 오버레이가 없어서 홈으로 가는 뒤로가기를 따로 둔다.
   .mr-col 의 gap 12px 만큼을 직접 띄워 화면 안 뒤로가기와 간격을 맞춘다 */
.mr-page-back{display:flex; width:fit-content; margin-bottom:18px}
.mr-row-end{display:flex; justify-content:flex-end; margin-top:14px}
.mr-row-between{display:flex; justify-content:space-between; align-items:center; gap:10px}
.mr-gap{display:flex; gap:8px; align-items:center}

/* exam editor */
.mr-qedit-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:4px}
.mr-qnum{font-weight:800; color:var(--blue); font-size:16px}
.mr-qnum-sm{font-weight:800; color:var(--blue); margin-right:5px}
.mr-seg{display:flex; background:var(--bg); border-radius:9px; padding:3px; gap:2px}
.mr-seg button{border:0; background:transparent; padding:6px 13px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--t3); font-weight:700; border-radius:7px; transition:background .15s,color .15s,border-color .15s,transform .15s}
.mr-seg button.on{background:#fff; color:var(--t1); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mr-points{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--t3); font-weight:600; margin-left:auto}
.mr-points input{width:60px; border:none; background:var(--bg); border-radius:8px; padding:7px 9px; font-family:inherit; font-weight:700; color:var(--t1)}
.mr-points input:focus{outline:2px solid var(--blue); outline-offset:-1px}
.mr-options{margin-top:12px; display:flex; flex-direction:column; gap:8px}
.mr-opt-row{display:flex; align-items:center; gap:9px}
.mr-opt-row input[type=radio]{width:18px; height:18px; accent-color:var(--blue); flex:none}
.mr-opt-label{font-size:15px; color:var(--t3); width:18px; text-align:center; flex:none}
.mr-opt-input{margin-top:0; flex:1; padding:10px 12px}
.mr-x{border:0; background:var(--bg); color:var(--t3); width:30px; height:30px; border-radius:9px; cursor:pointer; font-size:17px; flex:none}
.mr-x:hover{background:var(--red-bg); color:var(--red)}
.mr-add-opt{align-self:flex-start; border:0; background:var(--bg); color:var(--t2); padding:8px 14px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700}
.mr-add-opt:hover{background:var(--blue-bg); color:var(--blue)}
.mr-hint{font-size:12.5px; color:var(--t3); margin-top:9px; line-height:1.5}

/* submissions / grading */
.mr-sub{padding:0; overflow:hidden}
.mr-sub-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; cursor:pointer}
.mr-sub-name{display:flex; align-items:center; gap:11px}
.mr-avatar{width:38px; height:38px; border-radius:50%; background:var(--blue-bg); color:var(--blue); display:grid; place-items:center; font-weight:800; flex:none}
.mr-strong{font-weight:700; font-size:14.5px}
.mr-sub-score{display:flex; align-items:center; gap:10px}
.mr-score-done{font-weight:800; color:var(--green); font-size:15px}
.mr-chevron{font-size:9px; color:var(--t3)}
.mr-badge-red{background:var(--red-bg); color:var(--red); font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; white-space:nowrap}
.mr-sub-body{border-top:1px solid var(--line-soft); padding:6px 20px 18px}
.mr-grade-q{padding:14px 0; border-bottom:1px solid var(--line-soft)}
.mr-grade-q:last-of-type{border-bottom:0}
.mr-grade-qtext{font-size:15px; line-height:1.55; font-weight:600}

/* 칼럼 읽기 */
.mr-title-input{font-size:18px; font-weight:800}

/* 칼럼 게시판 */
.mr-list-top{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 4px}
.mr-list-title{font-size:22px; font-weight:800; letter-spacing:-0.5px; color:var(--t1)}
.mr-postlist{display:flex; flex-direction:column; gap:10px}
.mr-post-row{
  display:flex; flex-direction:column; gap:5px; width:100%; text-align:left; background:transparent;
  border:0; padding:17px 18px; cursor:pointer;
  font-family:inherit; transition:background .12s;
}
.mr-post-row:last-child{border-bottom:0}
.mr-post-row:hover{background:var(--bg)}
.mr-post-row:active{background:var(--bg)}
.mr-post-row-title{font-size:15.5px; font-weight:700; color:var(--t1); letter-spacing:-0.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mr-unread-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-right:7px; vertical-align:middle}
.mr-post-row-meta{font-size:12.5px; color:var(--t3); font-weight:600}
.mr-draft-head{font-size:13px; font-weight:800; color:var(--t3); padding:2px 2px 0}
.mr-draft-badge{font-size:11px; font-weight:700; color:#B26A00; background:#FFF4E0; padding:2px 7px; border-radius:6px; margin-left:8px; vertical-align:middle}
/* 메인규칙: 공지 목록 위에 따로 놓는 한 줄과 글 위의 표시 */
.mr-rule-tag{display:inline-block; font-size:12px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:5px 11px; border-radius:8px; margin-bottom:11px}
.mr-rule-row{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--glass-sh);
  border-radius:16px; padding:14px 16px; font-family:inherit;
  transition:background .15s}
.mr-rule-row:hover{background:var(--blue-bg)}
.mr-rule-row:active{transform:scale(.99)}
.mr-rule-row-tag{flex:none; font-size:11px; font-weight:800; color:#fff; background:var(--grad); padding:3px 9px; border-radius:7px}
.mr-rule-row-title{flex:1; min-width:0; font-size:14.5px; font-weight:800; color:var(--t1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mr-rule-row-go{flex:none; width:7px; height:7px; border-top:2px solid var(--t3); border-right:2px solid var(--t3); transform:rotate(45deg)}
.mr-cat-label{font-size:12.5px; font-weight:700; color:var(--t2); margin-top:14px}
.mr-cat-seg{display:flex; gap:4px; background:var(--bg); border-radius:11px; padding:4px; margin-top:8px}
.mr-cat-seg button{flex:1; border:0; background:transparent; padding:9px; font-family:inherit; font-weight:700; font-size:13.5px; color:var(--t3); border-radius:8px; cursor:pointer; transition:background .15s,color .15s,border-color .15s,transform .15s}
.mr-cat-seg button.on{background:#fff; color:var(--t1); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mr-post-item{display:flex; align-items:stretch; background:rgba(255,255,255,0.72); border:1px solid var(--line); border-radius:18px; box-shadow:var(--glass-sh); overflow:hidden; animation:rise .5s var(--ease) both}
.mr-post-item:last-child{border-bottom:1px solid var(--line)}
.mr-post-item .mr-post-row{border-bottom:0; flex:1; min-width:0}
.mr-reorder{display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 12px; flex:none}
.mr-reorder button{border:0; background:var(--bg); color:var(--t2); width:30px; height:22px; border-radius:6px; cursor:pointer; font-size:10px; line-height:1; font-family:inherit}
.mr-reorder button:disabled{opacity:.3; cursor:default}
.mr-reorder button:hover:not(:disabled){background:var(--blue-bg); color:var(--blue)}
.mr-qrate-list{display:flex; flex-direction:column}
.mr-qrate-row{display:flex; align-items:center; gap:9px; padding:11px 0; border-bottom:1px solid var(--line-soft)}
.mr-qrate-row:last-child{border-bottom:0}
.mr-qrate-val{font-size:14px; font-weight:800; color:var(--blue)}
.mr-qrate-sub{font-size:12.5px; color:var(--t3); font-weight:600; margin-left:auto}
.mr-qrate-wrong{font-size:13px; font-weight:700; color:var(--red); margin-left:auto}

/* 칼럼 상세 */
.mr-post-title{font-size:23px; font-weight:800; line-height:1.4; letter-spacing:-0.5px}
.mr-post-byline{display:flex; align-items:center; gap:8px; margin-top:13px; font-size:13px; color:var(--t2); font-weight:600}
/* 글쓴이와 날짜는 왼쪽, 공유는 오른쪽 끝으로 */
.mr-post-share{margin-left:auto}
.mr-share{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card);
  color:var(--t2); cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700;
  padding:7px 12px 7px 10px; border-radius:999px; white-space:nowrap;
  transition:background .15s, color .15s}
.mr-share:hover{background:var(--blue-bg); color:var(--blue)}
.mr-share:active{transform:scale(.97)}
.mr-share svg{flex:none; display:block}
.mr-avatar.sm{width:26px; height:26px; font-size:12px}
.mr-post-divider{height:1px; background:var(--line-soft); margin:16px 0}
.mr-notice .mr-notice-head h3{font-size:20px; line-height:1.4}
.mr-notice-body{font-size:15.5px; line-height:1.85; color:#333D4B; margin-top:12px}
/* 기둥이 넓어져도 읽는 글은 한 줄이 너무 길어지지 않게 잡아둔다 */
.mr-post .mr-notice-body{max-width:740px}

/* 문제 사진 업로드 */
.mr-img-drop{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  margin-top:12px; padding:26px 16px; background:var(--bg); border:2px dashed #D1D6DB;
  border-radius:14px; cursor:pointer; text-align:center; transition:background .15s,color .15s,border-color .15s,transform .15s;
}
.mr-img-drop:hover{border-color:var(--blue); background:var(--blue-bg)}
.mr-img-icon{font-size:26px}
.mr-img-main{font-size:14.5px; font-weight:700; color:var(--t1)}
.mr-img-sub{font-size:12px; color:var(--t3)}
.mr-img-preview{margin-top:12px; display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px}
.mr-img-preview > img{width:100%; border-radius:14px; display:block}
.mr-img-change,.mr-img-del{
  display:inline-block; font-size:13px; font-weight:700; padding:7px 13px; border-radius:9px;
  cursor:pointer; border:0; font-family:inherit;
}
.mr-img-change{background:var(--blue-bg); color:var(--blue)}
.mr-img-del{background:var(--bg); color:var(--t3)}
.mr-img-del:hover{background:var(--red-bg); color:var(--red)}

/* 출제된 문제 사진 표시 */
.mr-q-img{width:100%; border-radius:13px; margin-top:10px; display:block; background:var(--bg)}
.mr-q-img.sm{margin-top:8px}
.mr-q-cap{margin-top:8px; font-size:14px; color:var(--t2); line-height:1.55}
.mr-short-answer{margin-top:12px}
.mr-ans-label{display:block; font-size:11.5px; font-weight:700; color:var(--t3); margin-bottom:4px}
.mr-accept{margin-top:8px; font-size:13.5px; color:var(--t2)}
.mr-accept strong{color:var(--green); font-weight:700}
.mr-reset{border:0; background:var(--bg); color:var(--t3); font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; cursor:pointer; font-family:inherit}
.mr-reset:hover{background:var(--blue-bg); color:var(--blue)}
.mr-mc-review{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.mr-mc-opt{font-size:13.5px; padding:9px 12px; border-radius:10px; background:var(--bg); display:flex; align-items:center; gap:8px; color:var(--t2)}
.mr-mc-opt.is-answer{background:var(--green-bg); color:var(--green); font-weight:700}
.mr-mc-opt.is-wrong{background:var(--red-bg); color:var(--red); font-weight:700}
.mr-tag-correct{font-size:11px; background:var(--green); color:#fff; padding:2px 7px; border-radius:5px; margin-left:auto; font-weight:700}
.mr-tag-chosen{font-size:11px; border:1px solid currentColor; padding:2px 7px; border-radius:5px; font-weight:700}
.mr-auto-mark{margin-top:8px; font-size:12.5px; font-weight:700}
.mr-auto-mark.ok{color:var(--green)} .mr-auto-mark.no{color:var(--red)}
.mr-answer-box{margin-top:10px; background:var(--bg); border-radius:12px; padding:12px 14px; line-height:1.6; white-space:pre-wrap; font-size:14.5px; color:var(--t1)}
.mr-manual{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13.5px; color:var(--t3); font-weight:600}
.mr-manual input{width:66px; border:none; background:var(--blue-bg); border-radius:9px; padding:8px 10px; font-family:inherit; color:var(--blue); font-weight:800; text-align:center}
.mr-manual input:focus{outline:2px solid var(--blue); outline-offset:-1px}
.mr-muted{color:var(--t3)} .mr-ink{color:var(--t1)}
.mr-grade-foot{margin-top:16px; font-size:13.5px; color:var(--t2); font-weight:600}

/* take exam */
.mr-pts-tag{font-size:12px; color:var(--t3); margin-left:8px; background:var(--bg); padding:3px 9px; border-radius:20px; font-weight:700}
.mr-rate-tag{font-size:12px; color:var(--blue); margin-left:6px; background:var(--bg); padding:3px 9px; border-radius:20px; font-weight:700}
.mr-take-options{margin-top:14px; display:flex; flex-direction:column; gap:9px}
.mr-take-opt{display:flex; align-items:center; gap:10px; padding:14px; background:var(--bg); border-radius:13px; cursor:pointer; font-size:14.5px; font-weight:600; transition:background .15s,color .15s,border-color .15s,transform .15s; border:2px solid transparent}
.mr-take-opt.review{cursor:default}
.mr-take-opt.review.ans{border-color:var(--green); background:var(--green-bg)}
.mr-take-opt.review.mychoice{border-color:var(--red); background:var(--red-bg)}
.mr-opt-flag{margin-left:auto; font-size:11px; font-weight:800; padding:2px 9px; border-radius:7px}
.mr-opt-flag.ans{color:var(--green); background:#fff}
.mr-opt-flag.mine{color:var(--red); background:#fff}
.mr-ox{font-size:12px; font-weight:800; padding:3px 11px; border-radius:20px; margin-left:6px}
.mr-ox.o{color:var(--green); background:var(--green-bg)}
.mr-ox.x{color:var(--red); background:var(--red-bg)}
.mr-take-q.wrong{border-left:3px solid var(--red)}
.mr-short-review{margin-top:12px; display:flex; flex-direction:column; gap:8px}
.mr-sr-row{display:flex; gap:10px; align-items:center}
.mr-sr-k{font-size:12px; font-weight:700; color:var(--t3); width:44px; flex:none}
.mr-sr-v{font-size:14.5px; font-weight:700; color:var(--t1)}
.mr-sr-v.ok{color:var(--green)}
.mr-sr-v.no{color:var(--red)}
.mr-explain-btn{margin-top:14px; width:100%; border:0; background:var(--blue-bg); color:var(--blue); font-family:inherit; font-weight:700; font-size:14px; padding:12px; border-radius:12px; cursor:pointer; transition:background .15s}
.mr-explain-btn:active{background:rgba(140,92,240,0.26)}
.mr-explain{margin-top:14px; background:var(--blue-bg); border-radius:12px; padding:12px 14px}
.mr-explain-tag{font-size:12px; font-weight:800; color:var(--blue); margin-bottom:7px}
.mr-explain .mr-qbody{font-size:14px; line-height:1.85}
.mr-explain-none{margin-top:14px; font-size:12.5px; color:var(--t3); font-weight:600; line-height:1.6; background:var(--bg); border-radius:11px; padding:11px 13px}
.mr-explain-none b{color:var(--t2); font-weight:800}
.mr-search{margin-top:0}
.mr-need-login{text-align:center; padding:34px 22px}
.mr-need-icon{font-size:40px; line-height:1; margin-bottom:14px}
.mr-need-title{font-size:18px; font-weight:800; color:var(--t1); letter-spacing:-0.4px; margin:0 0 10px}
.mr-need-sub{font-size:13.5px; color:var(--t2); line-height:1.75; margin:0 0 20px}
.mr-need-btn{width:100%; padding:14px; font-size:15.5px}
.mr-wrong-hint{font-size:12.5px; color:var(--t3); font-weight:600; padding:2px 4px; line-height:1.6}
.mr-wrong-from{font-size:12px; font-weight:700; color:var(--blue); background:var(--blue-bg); display:inline-block; padding:4px 10px; border-radius:8px; margin-bottom:10px}
.mr-take-opt.sel{background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:700}
.mr-take-opt input{width:18px; height:18px; accent-color:var(--blue); flex:none}
.mr-result-pill{font-weight:800; color:var(--green); background:var(--green-bg); padding:9px 15px; border-radius:11px; font-size:14.5px}
/* 이미 푼 시험은 점수를 눌러 채점 결과로 간다 */
.mr-result-open{display:inline-flex; align-items:center; gap:9px; border:0; font-family:inherit;
  cursor:pointer; transition:background .15s, color .15s}
.mr-result-open:hover{background:var(--blue-bg); color:var(--blue)}
.mr-result-open:active{transform:scale(.97)}
.mr-result-more{font-size:12.5px; font-weight:700; opacity:.72}
.mr-result-more::after{content:""; display:inline-block; width:6px; height:6px; margin-left:5px;
  border-top:2px solid currentColor; border-right:2px solid currentColor;
  transform:rotate(45deg) translateY(-1px)}
.mr-guest-note{background:var(--red-bg); color:var(--red); font-size:13.5px; font-weight:700; padding:12px 14px; border-radius:12px; text-align:center; line-height:1.5}
.mr-resume-note{background:var(--blue-bg); color:var(--blue); font-size:13px; font-weight:700; padding:11px 14px; border-radius:12px; text-align:center; line-height:1.5}
.mr-c-good{color:var(--green)}
.mr-c-bad{color:var(--red)}
.mr-game-intro{text-align:center; padding:32px 22px}
.mr-game-emoji{font-size:48px; line-height:1}
.mr-game-title{font-size:22px; font-weight:800; color:var(--t1); margin:12px 0 10px; letter-spacing:-0.5px}
.mr-game-rules{font-size:14px; color:var(--t2); line-height:1.8; margin:0 0 18px}
.mr-game-best{font-size:13px; font-weight:700; color:var(--t3); margin-bottom:18px}
.mr-game-start{width:100%; padding:15px; font-size:16px; margin-top:20px}
.mr-game-final{font-size:52px; font-weight:800; color:var(--blue); letter-spacing:-1.5px; line-height:1.1; margin:6px 0}
.mr-game-final span{font-size:20px; color:var(--t3); font-weight:700; margin-left:8px; letter-spacing:0}
.mr-game-stats2{display:flex; justify-content:center; gap:8px; font-size:13.5px; color:var(--t3); font-weight:600; margin:14px 0 0}
.mr-game-new{margin-top:16px; font-size:15px; font-weight:800; color:var(--green)}
.mr-game-play{transition:background .1s}
.mr-game-play.fl-good{background:rgba(0,178,98,.06)}
.mr-game-play.fl-bad{background:rgba(240,68,82,.08)}
.mr-game-play.fl-crit{background:rgba(249,115,22,.10)}
.mr-game-top{display:flex; align-items:center; justify-content:space-between; padding:2px 4px}
.mr-game-score{font-size:30px; font-weight:800; color:var(--t1); letter-spacing:-1px}
.mr-game-combo{font-size:13.5px; font-weight:800; color:var(--t3)}
.mr-game-combo.hot{color:#F97316}
.mr-game-timebar{position:relative; height:26px; background:var(--bg); border-radius:13px; overflow:hidden; margin:4px 0 2px}
.mr-game-timefill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#9b6cff,#ff8fc8); border-radius:13px; transition:width .12s linear}
.mr-game-timetext{position:absolute; right:12px; top:0; line-height:26px; font-size:12.5px; font-weight:800; color:var(--t1)}
.mr-game-crit{text-align:center; font-size:16px; font-weight:800; color:#F97316; animation:rise .3s var(--ease) both}
.mr-game-qcard{text-align:center; padding:24px 20px}
.mr-game-q{font-size:40px; font-weight:800; color:var(--t1); letter-spacing:0.5px}
.mr-game-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px}
.mr-game-opt{padding:22px; font-size:26px; font-weight:800; color:var(--t1); background:var(--card); border:2px solid transparent; border-radius:16px; cursor:pointer; font-family:inherit; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:transform .08s, background .12s, border-color .12s}
.mr-game-opt:active{transform:scale(.97)}
.mr-game-opt.correct{background:var(--green-bg); border-color:var(--green); color:var(--green)}
.mr-game-opt.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red)}
.mr-game-opt:disabled{cursor:default}
.mr-rank-warn{text-align:center}
.mr-myrank{display:flex; align-items:center; gap:7px; background:var(--blue-bg); border-radius:12px; padding:12px 14px; margin:6px 0 4px; font-size:14px}
.mr-myrank-label{font-weight:700; color:var(--blue)}
.mr-myrank-rank{font-weight:800; color:var(--blue); font-size:16px}
.mr-myrank-sep{color:var(--blue); opacity:.5}
.mr-myrank-score{font-weight:800; color:var(--t1)}
.mr-myrank-total{margin-left:auto; font-size:12.5px; color:var(--t3); font-weight:600}
.mr-game-rankbtn{width:100%; margin-top:10px; background:var(--bg); border:0; color:var(--t2); font-family:inherit; font-weight:700; font-size:15px; padding:13px; border-radius:12px; cursor:pointer}
.mr-game-rankbtn:hover{background:var(--line-soft)}
.mr-warnpop{align-items:stretch; text-align:center; padding:28px 24px 22px; gap:0}
.mr-warnpop-icon{font-size:44px; line-height:1; margin-bottom:14px}
.mr-warnpop-title{font-size:19px; font-weight:800; color:var(--red); letter-spacing:-0.5px; margin:0 0 8px}
.mr-warnpop-sub{font-size:14px; color:var(--t2); line-height:1.65; margin:0 0 22px}
.mr-warnpop-btns{display:flex; flex-direction:column; gap:9px}
.mr-warnpop-primary{width:100%; padding:15px; font-size:15.5px}
.mr-warnpop-ghost{width:100%; background:var(--bg); border:0; color:var(--t1); font-family:inherit; font-weight:700; font-size:15px; padding:14px; border-radius:13px; cursor:pointer; transition:background .15s}
.mr-warnpop-ghost:hover{background:var(--line-soft)}
.mr-warnpop-mute{background:none; border:0; color:var(--t3); font-family:inherit; font-weight:600; font-size:13px; padding:6px; cursor:pointer; margin-top:2px}
.mr-warnpop-mute:hover{color:var(--t2)}
.mr-rank-empty{text-align:center; color:var(--t3); font-size:14px; padding:14px 0}
.mr-rank-list{list-style:none; margin:6px 0 0; padding:0}
.mr-rank-row{display:flex; align-items:center; gap:12px; padding:11px 6px; border-bottom:1px solid var(--line-soft); font-size:15px}
.mr-rank-row:last-child{border-bottom:0}
.mr-rank-row.me{background:var(--blue-bg); border-radius:10px; border-bottom:0; font-weight:800}
.mr-rank-no{width:24px; text-align:center; font-weight:800; color:var(--t3)}
.mr-rank-row.me .mr-rank-no{color:var(--blue)}
.mr-rank-row:nth-child(1) .mr-rank-no,.mr-rank-row:nth-child(2) .mr-rank-no,.mr-rank-row:nth-child(3) .mr-rank-no{color:#F97316}
.mr-rank-nick{flex:1; color:var(--t1); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mr-rank-score{font-weight:800; color:var(--t1); font-variant-numeric:tabular-nums}

.mr-foot{
  max-width:var(--col); margin:28px auto 0; padding:0 20px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-size:12px; color:var(--t3); line-height:1.6; font-weight:500;
}
.mr-foot-row{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap}
.mr-foot-install{
  border:1px solid var(--line); background:var(--card); color:var(--t2); font-family:inherit;
  font-size:12px; font-weight:700; padding:7px 14px; border-radius:999px; cursor:pointer; transition:background .15s,color .15s;
}
.mr-foot-install:hover{background:var(--blue-bg); color:var(--blue)}
.mr-foot-link{background:none; border:0; color:var(--t2); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; padding:4px}
.mr-foot-link:hover{color:var(--blue)}
.mr-foot-sep{color:var(--t3)}
.mr-foot-copy{}
.mr-cl-now{font-size:12.5px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:8px 12px; border-radius:10px; display:inline-block; margin-bottom:6px}
.mr-cl-block{padding:16px 0; border-bottom:1px solid var(--line-soft)}
.mr-cl-block:last-child{border-bottom:0}
.mr-cl-head{display:flex; align-items:center; gap:8px}
.mr-cl-ver{font-size:16px; font-weight:800; color:var(--t1); letter-spacing:-0.4px}
.mr-cl-latest{font-size:10.5px; font-weight:800; color:#fff; background:var(--grad); padding:2px 8px; border-radius:6px}
.mr-cl-date{margin-left:auto; font-size:12px; color:var(--t3); font-weight:600}
.mr-cl-list{margin:9px 0 0; padding-left:18px}
.mr-cl-list li{font-size:13.5px; color:var(--t2); line-height:1.7; margin:5px 0}
.mr-cl-admin{display:inline-block; font-size:10px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:2px 6px; border-radius:5px; margin-right:6px; vertical-align:middle}
.mr-cl-hidden{color:var(--t3); font-style:italic}
.mr-pp-title{font-size:21px; font-weight:800; color:var(--t1); letter-spacing:-0.5px; padding-bottom:12px; border-bottom:2px solid var(--t1); margin:0 0 14px}
.mr-pp-intro{font-size:13.5px; color:var(--t2); line-height:1.7; margin:0}
.mr-pp-h2{font-size:16px; font-weight:800; color:var(--blue); margin:26px 0 9px; letter-spacing:-0.3px}
.mr-pp p{font-size:13.5px; color:var(--t2); line-height:1.7; margin:0 0 6px}
.mr-pp-ul{margin:6px 0 4px; padding-left:18px}
.mr-pp-ul li{font-size:13.5px; color:var(--t2); line-height:1.65; margin:6px 0}
.mr-pp-table{width:100%; border-collapse:collapse; margin:12px 0; font-size:12.5px}
.mr-pp-table th,.mr-pp-table td{border:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top; color:var(--t2); line-height:1.5}
.mr-pp-table th{background:var(--bg); color:var(--t1); font-weight:700}
.mr-pp-note{background:var(--bg); border-radius:14px; padding:16px; margin:16px 0}
.mr-pp-note-tag{display:inline-block; font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-bg); padding:4px 10px; border-radius:8px; margin-bottom:9px; letter-spacing:-0.2px}
.mr-pp-note p{font-size:13px; color:var(--t2); line-height:1.7; margin:0}
.mr-pp a{color:var(--blue); font-weight:700; text-decoration:underline}
.mr-consent{display:flex; align-items:flex-start; gap:9px; margin:4px 2px 2px; font-size:13px; color:var(--t2); line-height:1.5; cursor:pointer}
.mr-consent input{margin-top:2px; flex:none; width:16px; height:16px; accent-color:var(--blue)}
.mr-consent-link{background:none; border:0; padding:0; font:inherit; color:var(--blue); font-weight:700; text-decoration:underline; cursor:pointer}
.mr-policy-modal{background:var(--card); border-radius:20px; width:100%; max-width:560px; max-height:84vh; display:flex; flex-direction:column; overflow:hidden}
.mr-policy-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line-soft); flex:none}
.mr-policy-scroll{overflow-y:auto; padding:16px}
.mr-policy-scroll .mr-card{box-shadow:none; padding:0}

/* ===== 글래스모피즘 1단계 (성능 최적화) ===== */
/* 반복되는 카드엔 실시간 블러 X (렉 방지) — 반투명 흰색으로 유리 느낌만 */
.mr-card,.mr-sector,.mr-pick-card{
  background:rgba(255,255,255,0.72); border:1px solid var(--line); box-shadow:var(--glass-sh); border-radius:26px;
}
.mr-empty{background:rgba(255,255,255,0.72); border:1px solid var(--line); box-shadow:var(--glass-sh); border-radius:26px}
.mr-sector:hover,.mr-pick-card:hover{box-shadow:0 18px 40px rgba(91,55,140,0.2), inset 0 1px 1px rgba(255,255,255,0.92)}
/* 화면에 1~2개뿐인 것만 진짜 블러 */
.mr-header,.mr-modal,.mr-policy-modal,.mr-rte-toolbar{
  -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%);
}
.mr-header{border-bottom:1px solid var(--line-soft); background:rgba(255,255,255,0.7)}
.mr-modal{background:rgba(255,255,255,0.82); border:1px solid var(--line); box-shadow:0 24px 70px rgba(72,40,110,0.3), inset 0 1px 1px rgba(255,255,255,0.92)}
.mr-input,.mr-textarea{background:rgba(255,255,255,0.6); border:1px solid var(--line)}
.mr-input:focus,.mr-textarea:focus{background:rgba(255,255,255,0.92); box-shadow:inset 0 0 0 2px var(--blue)}
.mr-pick-icon.blue,.mr-sector-icon.blue{background:var(--grad); color:#fff}
.mr-sector-icon.green,.mr-pick-icon.green{background:linear-gradient(140deg,#7c9bff,#aec3ff); color:#fff}
.mr-btn-ghost{background:rgba(140,92,240,0.16)}
.mr-account-avatar{background:var(--grad); color:#fff}
/* 카드 확장 트랜지션: 카드 자리에서 펼쳐지며 그 안에 상세화면 */
.mr-ov-scrim{position:fixed; top:74px; left:0; right:0; bottom:0; z-index:149; background:linear-gradient(165deg,#efe2ff,#fbe2ef 46%,#e2e9ff); transition:opacity .4s ease}
.mr-ov{background:linear-gradient(165deg,#f4e9ff 0%,#fde9f4 46%,#e9eeff 100%); border:0; box-shadow:none;
  transition:top .5s cubic-bezier(.4,0,.2,1), left .5s cubic-bezier(.4,0,.2,1), width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1), border-radius .5s cubic-bezier(.4,0,.2,1);}
/* 뒤로가기가 내용과 같은 흐름에 있으므로 위 여백은 10px + .mr-main 8px = 18px */
/* scrollbar-gutter: 스크롤이 생기든 말든 스크롤바 자리를 늘 비워둔다.
   안 그러면 내용이 짧은 화면을 열 때만 기둥이 스크롤바 폭만큼 옆으로 밀린다 */
.mr-ov-inner{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-top:10px; scrollbar-gutter:stable}
.mr-ov-inner .mr-main{padding-top:8px}
.mr-back::before,.mr-page-back::before{
  content:""; width:8px; height:8px; flex:none;
  border-left:2.2px solid currentColor; border-bottom:2.2px solid currentColor;
  transform:rotate(45deg); border-radius:1px;
}
/* 화면이 자기 뒤로가기를 가지고 있으면 홈으로 가는 것은 숨긴다 (화살표가 두 개 뜨지 않게) */
.mr-main:has(.mr-back) .mr-page-back{display:none}
/* 화면 전체는 가볍게 떠오르기만 하고, 실제 움직임은 안쪽 카드들이 차례로 만든다.
   여기서 크기까지 바꾸면 안쪽 카드 움직임과 겹쳐 지저분해진다 */
@keyframes screenIn{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.mr-screen-in{animation:screenIn .5s var(--ease-screen)}
/* 목록과 글 사이를 오갈 때는 화면이 통째로 미끄러져 들어온다 */
@keyframes stepFwd{from{opacity:0; transform:translateX(34px)}to{opacity:1; transform:none}}
@keyframes stepBack{from{opacity:0; transform:translateX(-34px)}to{opacity:1; transform:none}}
.mr-step-fwd{animation:stepFwd .5s var(--ease-screen)}
.mr-step-back{animation:stepBack .5s var(--ease-screen)}
/* 통째로 움직이는 동안 안쪽 카드가 따로 또 움직이면 지저분해진다.
   카드가 펼쳐지는 전환 안에서도 마찬가지다. 상자가 커지는 사이 안쪽 여백이
   줄면서 글자가 옆으로 밀리는데, 거기에 카드까지 각자 뜨면 흔들려 보인다 */
.mr-step-fwd .mr-card,.mr-step-back .mr-card,.mr-ov .mr-card,
.mr-step-fwd .mr-post-item,.mr-step-back .mr-post-item,.mr-ov .mr-post-item,
.mr-step-fwd .mr-record,.mr-step-back .mr-record,.mr-ov .mr-record,
.mr-step-fwd .mr-pick-card,.mr-step-back .mr-pick-card,.mr-ov .mr-pick-card,
.mr-step-fwd .mr-daily-hero,.mr-step-back .mr-daily-hero,.mr-ov .mr-daily-hero{animation:none}

/* ===== 홈 화면에 추가: 하단 배너 + 안내 시트 ===== */
.mr-a2hs-banner{
  position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:440;
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:20px;
  background:var(--card); border:1px solid var(--line); box-shadow:0 16px 40px rgba(72,40,110,0.28);
  -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%);
  max-width:520px; margin:0 auto; animation:a2hsUp .45s var(--ease) both;
}
@keyframes a2hsUp{from{opacity:0; transform:translateY(20px)}to{opacity:1; transform:none}}
.mr-a2hs-bicon{width:42px; height:42px; border-radius:13px; background:var(--grad); color:#fff; display:grid; place-items:center; font-size:22px; font-weight:800; flex:none}
.mr-a2hs-btext{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.mr-a2hs-btext b{font-size:14.5px; font-weight:800; color:var(--t1); letter-spacing:-0.3px}
.mr-a2hs-btext em{font-size:12.5px; font-weight:600; color:var(--t3); font-style:normal}
.mr-a2hs-badd{border:0; background:var(--grad); color:#fff; font-family:inherit; font-weight:800; font-size:14px; padding:10px 16px; border-radius:12px; cursor:pointer; flex:none; box-shadow:0 6px 16px rgba(124,92,255,0.35)}
.mr-a2hs-bx{border:0; background:none; color:var(--t3); font-size:22px; line-height:1; cursor:pointer; padding:0 2px; flex:none}
.mr-a2hs-sheet{
  width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:20px;
  box-shadow:0 24px 70px rgba(0,0,0,.3); animation:popIn .34s var(--ease) both; max-height:86vh; overflow-y:auto;
}
.mr-a2hs-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.mr-a2hs-hero{display:flex; align-items:center; gap:13px; padding:14px; border-radius:18px; background:var(--bg); margin-bottom:16px}
.mr-a2hs-icon{width:52px; height:52px; border-radius:16px; background:var(--grad); color:#fff; display:grid; place-items:center; font-size:27px; font-weight:800; flex:none}
.mr-a2hs-hero-title{font-size:16px; font-weight:800; color:var(--t1)}
.mr-a2hs-hero-sub{font-size:12.5px; font-weight:600; color:var(--t3); margin-top:3px; line-height:1.5}
.mr-a2hs-warn{background:var(--red-bg); color:var(--red); font-size:13px; font-weight:700; padding:11px 13px; border-radius:12px; line-height:1.5; margin-bottom:14px}
.mr-a2hs-steps{list-style:none; display:flex; flex-direction:column; gap:12px; margin:0 0 18px; padding:0}
.mr-a2hs-steps li{display:flex; align-items:flex-start; gap:11px}
.mr-a2hs-num{width:26px; height:26px; border-radius:50%; background:var(--grad); color:#fff; font-size:13.5px; font-weight:800; display:grid; place-items:center; flex:none}
.mr-a2hs-step-text{display:flex; flex-direction:column; gap:2px; min-width:0}
.mr-a2hs-step-text b{font-size:15px; font-weight:800; color:var(--t1); letter-spacing:-0.3px}
.mr-a2hs-step-text em{font-size:12.5px; font-weight:600; color:var(--t3); font-style:normal}
.mr-a2hs-done{width:100%; padding:14px; font-size:15.5px}

/* ===== 화면 설정: 토글 스위치 ===== */
.mr-setting-row{display:flex; align-items:center; justify-content:space-between; gap:14px}
.mr-setting-text{min-width:0}
.mr-setting-name{font-size:15px; font-weight:700; color:var(--t1)}
.mr-setting-desc{font-size:12.5px; color:var(--t3); font-weight:600; margin-top:3px}
.mr-switch{position:relative; width:52px; height:30px; border-radius:999px; border:0; background:rgba(140,92,180,0.28); cursor:pointer; padding:0; flex:none; transition:background .2s}
.mr-switch.on{background:var(--blue)}
.mr-switch-dot{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.mr-switch.on .mr-switch-dot{transform:translateX(22px)}

/* ===== 시험 난이도 뱃지 ===== */
/* 난이도 뱃지: 색은 정답률과 같은 기준(rateColor)으로 화면에서 직접 넣는다 */
.mr-diff{display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:7px; letter-spacing:-0.2px; vertical-align:middle; white-space:nowrap}

/* ===== 시험 목록 검색·정렬 ===== */
.mr-listtools{display:flex; flex-direction:column; gap:8px; margin-bottom:2px}
.mr-listtools .mr-input{margin-top:0}
.mr-sortseg{display:flex; background:var(--bg); border-radius:11px; padding:3px; gap:2px}
.mr-sortseg button{flex:1; border:0; background:transparent; padding:9px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--t3); font-weight:700; border-radius:8px; white-space:nowrap; transition:background .15s,color .15s}
.mr-sortseg button.on{background:#fff; color:var(--t1); box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ===== 내 기록 대시보드 ===== */
.mr-dash-title{font-size:12.5px; font-weight:700; color:var(--t3); margin:14px 2px 8px}
.mr-spark{display:flex; align-items:flex-end; gap:5px; height:82px; padding:12px 12px 8px; background:var(--card); border-radius:20px; border:1px solid var(--line); box-shadow:var(--glass-sh)}
.mr-spark-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; min-width:0}
.mr-spark-bar{width:100%; max-width:28px; min-height:4px; border-radius:6px 6px 3px 3px; background:var(--grad)}
.mr-spark-cap{font-size:10px; font-weight:800; color:var(--t3)}

/* ===== 오늘의 문제: 일일 퍼즐 ===== */
.mr-daily-hero{background:var(--card); border:1px solid var(--line); box-shadow:var(--glass-sh); border-radius:26px; padding:22px; animation:rise .5s var(--ease) both}
.mr-daily-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.mr-daily-badges{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.mr-daily-rate{font-size:13px; font-weight:800; letter-spacing:-0.2px}
.mr-daily-badge{display:inline-block; font-size:12px; font-weight:800; color:#fff; background:var(--grad); padding:5px 12px; border-radius:20px; letter-spacing:-0.2px}
.mr-daily-title{font-size:20px; font-weight:800; letter-spacing:-0.5px; line-height:1.4; color:var(--t1); margin:0 0 14px}
.mr-daily-q{font-size:16px; line-height:1.9; color:var(--t1); margin-bottom:6px}
.mr-daily-q .mr-qbody{font-size:16px}
.mr-daily-meta{font-size:13.5px; color:var(--t3); font-weight:600; margin:4px 0 16px}
.mr-daily-start{width:100%; padding:15px; font-size:16px; margin-top:6px}
.mr-daily-donerow{margin-top:8px}
.mr-daily-solve{margin-top:14px}
.mr-daily-opts{display:flex; flex-direction:column; gap:10px}
.mr-daily-opt{display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; padding:14px 16px; border-radius:14px; background:var(--bg); border:2px solid transparent; font-family:inherit; font-size:15px; font-weight:600; line-height:1.6; color:var(--t1); cursor:pointer; transition:transform .08s, background .15s, border-color .15s}
button.mr-daily-opt:hover{background:var(--blue-bg)}
button.mr-daily-opt:active{transform:scale(.99)}
.mr-daily-opt-label{width:22px; flex:none; display:flex; justify-content:center; font-size:15px; color:var(--t3); font-weight:800; line-height:1.6}
.mr-daily-opt-txt{flex:1; min-width:0; word-break:break-word; overflow-wrap:anywhere}
.mr-daily-opt.right{background:var(--green-bg); border-color:var(--green); color:var(--green)}
.mr-daily-opt.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red)}
.mr-daily-opt.dim{opacity:.5}
/* 채점을 기다리는 동안: 고른 칸만 눌린 티를 내고 맞고 틀림은 아직 안 그린다 */
.mr-daily-opt.picked{background:var(--blue-bg); border-color:var(--blue); color:var(--blue)}
.mr-daily-grading{margin-top:14px; text-align:center; font-size:14px; font-weight:700; color:var(--t3)}
.mr-daily-opt.right .mr-daily-opt-label,.mr-daily-opt.wrong .mr-daily-opt-label{color:inherit}
.mr-daily-flag{margin-left:auto; font-size:11px; font-weight:800; color:#fff; background:var(--green); padding:3px 9px; border-radius:7px}
.mr-daily-short{display:flex; gap:8px; align-items:stretch}
.mr-daily-short .mr-input{margin-top:0; flex:1}
.mr-daily-your{font-size:14.5px; font-weight:700; padding:12px 14px; border-radius:12px; background:var(--bg)}
.mr-daily-your.ok{color:var(--green); background:var(--green-bg)}
.mr-daily-your.no{color:var(--red); background:var(--red-bg)}
.mr-daily-result{margin-top:14px; text-align:center; padding:16px; border-radius:16px; animation:rise .5s var(--ease) both}
.mr-daily-result.ok{background:var(--green-bg)}
.mr-daily-result.no{background:var(--red-bg)}
.mr-daily-result-big{font-size:19px; font-weight:800; letter-spacing:-0.4px}
.mr-daily-result.ok .mr-daily-result-big{color:var(--green)}
.mr-daily-result.no .mr-daily-result-big{color:var(--red)}
.mr-daily-answer{margin-top:8px; font-size:14px; color:var(--t2); font-weight:600}
.mr-daily-answer b{color:var(--t1)}
.mr-daily-result .mr-explain-btn,.mr-daily-result .mr-explain,.mr-daily-result .mr-explain-none{margin-top:12px; text-align:left}
.mr-daily-check{color:var(--green); font-weight:900; margin-right:6px}
.mr-daily-pastcard{margin-top:2px}

/* 하단 날짜 바 (날짜를 누르면 달력) */
.mr-daily-nav{display:flex; align-items:stretch; gap:10px; margin-top:2px}
.mr-daily-arrow{width:50px; border:1px solid var(--line); background:var(--card); box-shadow:var(--glass-sh); color:var(--t1); font-size:22px; cursor:pointer; border-radius:16px; flex:none; display:grid; place-items:center; transition:background .15s}
.mr-daily-arrow:hover:not(:disabled){background:var(--blue-bg); color:var(--blue)}
.mr-daily-arrow:disabled{opacity:.32; cursor:default}
.mr-daily-datebtn{flex:1; min-width:0; border:1px solid var(--line); background:var(--card); box-shadow:var(--glass-sh); color:var(--t1); font-family:inherit; cursor:pointer; border-radius:16px; padding:11px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:background .15s}
.mr-daily-datebtn:hover{background:var(--blue-bg)}
.mr-daily-datebtn-day{font-size:16px; font-weight:800; color:var(--t1); letter-spacing:-0.3px}
.mr-daily-datebtn-hint{font-size:11.5px; font-weight:700; color:var(--blue)}

/* 날짜 선택 달력 */
.mr-cal{width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:18px; box-shadow:0 24px 70px rgba(0,0,0,.3); animation:popIn .34s var(--ease) both}
.mr-cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px}
.mr-cal-nav{display:flex; align-items:center; justify-content:space-between; margin:6px 2px 14px}
.mr-cal-nav span{font-size:16px; font-weight:800; color:var(--t1)}
.mr-cal-nav button{width:34px; height:34px; border:0; background:var(--bg); color:var(--t1); border-radius:10px; font-size:18px; cursor:pointer; transition:background .15s,color .15s}
.mr-cal-nav button:hover{background:var(--blue-bg); color:var(--blue)}
.mr-cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px}
.mr-cal-dow span{text-align:center; font-size:12px; font-weight:700; color:var(--t3)}
.mr-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.mr-cal-cell{position:relative; aspect-ratio:1; border:0; background:transparent; border-radius:11px; font-family:inherit; display:flex; align-items:center; justify-content:center; padding:0}
.mr-cal-cell.empty{visibility:hidden}
.mr-cal-num{font-size:14.5px; font-weight:700; color:var(--t1)}
.mr-cal-cell.none{cursor:default}
.mr-cal-cell.none .mr-cal-num{color:var(--t3); opacity:.5}
.mr-cal-cell.has{background:var(--bg); cursor:pointer}
.mr-cal-cell.has:hover{background:var(--blue-bg)}
.mr-cal-cell.solved{background:var(--blue-bg)}
.mr-cal-cell.sel{background:var(--grad); box-shadow:0 6px 16px rgba(124,92,255,0.4)}
.mr-cal-cell.sel .mr-cal-num{color:#fff}
.mr-cal-check{position:absolute; top:4px; right:6px; font-size:10px; color:var(--blue); font-weight:900; line-height:1}
.mr-cal-cell.sel .mr-cal-check{color:#fff}
.mr-cal-legend{margin-top:14px; font-size:12.5px; color:var(--t3); font-weight:600; text-align:center}
.mr-cal-legend .mr-cal-check{position:static; color:var(--blue)}

/* ============ 어두운 화면 모드 ============ */
html[data-theme="dark"] .mr-root{
  --bg:rgba(255,255,255,0.06); --card:rgba(255,255,255,0.05); --t1:#ece8f5; --t2:#b3a9cc; --t3:#877b9f;
  --blue:#b18cff; --blue-d:#c4a6ff; --blue-bg:rgba(160,120,255,0.20);
  --line:rgba(255,255,255,0.10); --line-soft:rgba(180,150,230,0.13);
  --green:#3dd7b0; --green-bg:rgba(45,190,150,0.18); --red:#ff6fa0; --red-bg:rgba(240,90,140,0.18);
  --glass-sh:0 14px 34px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.05);
}
html[data-theme="dark"] .mr-root::before{
  background:
   radial-gradient(320px 320px at 12% 6%, rgba(130,90,220,0.28), transparent 64%),
   radial-gradient(320px 320px at 88% 82%, rgba(210,90,160,0.22), transparent 64%),
   radial-gradient(280px 280px at 62% 42%, rgba(90,110,210,0.20), transparent 66%);
}
html[data-theme="dark"] .mr-card,
html[data-theme="dark"] .mr-sector,
html[data-theme="dark"] .mr-pick-card,
html[data-theme="dark"] .mr-empty,
html[data-theme="dark"] .mr-post-item{background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.09)}
html[data-theme="dark"] .mr-sector:hover,
html[data-theme="dark"] .mr-pick-card:hover{box-shadow:0 18px 40px rgba(0,0,0,0.5)}
html[data-theme="dark"] .mr-header{background:rgba(26,22,38,0.72)}
html[data-theme="dark"] .mr-modal{background:rgba(34,26,46,0.94); border-color:var(--line)}
html[data-theme="dark"] .mr-input,
html[data-theme="dark"] .mr-textarea{background:rgba(255,255,255,0.07); border-color:var(--line)}
html[data-theme="dark"] .mr-input:focus,
html[data-theme="dark"] .mr-textarea:focus{background:rgba(255,255,255,0.11)}
html[data-theme="dark"] .mr-subtabs button.on,
html[data-theme="dark"] .mr-seg button.on,
html[data-theme="dark"] .mr-cat-seg button.on,
html[data-theme="dark"] .mr-sortseg button.on{background:rgba(255,255,255,0.14); color:var(--t1)}
/* 미끄러지는 알약을 쓰는 토글은 버튼이 배경을 그리지 않는다 (위 규칙보다 뒤에 와야 이긴다) */
html[data-theme="dark"] .mr-slide button.on{background:transparent}
html[data-theme="dark"] .mr-slide::before{background:rgba(255,255,255,0.14); box-shadow:none}
html[data-theme="dark"] .mr-back,
html[data-theme="dark"] .mr-page-back{background:rgba(255,255,255,0.08); color:var(--t2); box-shadow:none}
html[data-theme="dark"] .mr-back:hover,
html[data-theme="dark"] .mr-page-back:hover{background:rgba(255,255,255,0.15); color:var(--t1)}
html[data-theme="dark"] .mr-qbox,
html[data-theme="dark"] .mr-rich-box .qbox{border-color:rgba(255,255,255,0.24)}
html[data-theme="dark"] .mr-ov-scrim{background:linear-gradient(165deg,#1a1626,#221a2b 46%,#181a2b)}
html[data-theme="dark"] .mr-ov{background:linear-gradient(165deg,#1a1626 0%,#221a2b 46%,#181a2b 100%)}
html[data-theme="dark"] math-field{background:rgba(255,255,255,0.08); color:var(--t1)}
html[data-theme="dark"] math-field:focus-within{background:rgba(255,255,255,0.12)}
html[data-theme="dark"] .mr-rte-wrap,
html[data-theme="dark"] .mr-rte-toolbar{background:#241d30}
html[data-theme="dark"] .mr-rte-toolbar::after{background:linear-gradient(to left,#241d30 25%,rgba(36,29,48,0))}
html[data-theme="dark"] .mr-rte-color{border-color:#241d30}
html[data-theme="dark"] .mr-notice-body{color:var(--t2)}
html[data-theme="dark"] .mr-opt-flag.ans,
html[data-theme="dark"] .mr-opt-flag.mine{background:rgba(255,255,255,0.12)}
html[data-theme="dark"] .mr-sched-tag{background:rgba(210,130,30,0.22); color:#ffcf95}
html[data-theme="dark"] .mr-draft-badge{background:rgba(210,150,20,0.22); color:#ffd98f}
html[data-theme="dark"] .mr-img-drop{border-color:rgba(255,255,255,0.18)}
html[data-theme="dark"] .mr-pp-title{border-bottom-color:var(--t2)}
/* 홈·시험 아이콘 타일: 밝은 파스텔 대신 어두운 테마에 맞는 톤다운 보라 계열 */
html[data-theme="dark"] .mr-sector-icon.blue,
html[data-theme="dark"] .mr-pick-icon.blue{background:linear-gradient(140deg,#7b52c9,#b96a97)}
html[data-theme="dark"] .mr-sector-icon.green,
html[data-theme="dark"] .mr-pick-icon.green{background:linear-gradient(140deg,#5a54b4,#8a72c9)}
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
