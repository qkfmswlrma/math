function isPublished(exam) {
  return !exam.publishAt || exam.publishAt <= Date.now();
}

/* 칼럼 읽음 추적 (기기에 저장) */
const COL_READ_KEY = "mrreadcols";
function getReadColIds() {
  try { return new Set(JSON.parse(localStorage.getItem(COL_READ_KEY) || "[]")); } catch (e) { return new Set(); }
}
function saveReadColIds(set) {
  try { localStorage.setItem(COL_READ_KEY, JSON.stringify([...set])); } catch (e) {}
}
/* 시험 확인 추적 (기기에 저장) */
const EXAM_READ_KEY = "mrreadexams";
function getReadExamIds() {
  try { return new Set(JSON.parse(localStorage.getItem(EXAM_READ_KEY) || "[]")); } catch (e) { return new Set(); }
}
function saveReadExamIds(set) {
  try { localStorage.setItem(EXAM_READ_KEY, JSON.stringify([...set])); } catch (e) {}
}
function columnUnreadCount(notices, readIds) {
  return (notices || []).filter((n) => !n.isDraft && !readIds.has(n.id)).length;
}

/* 오늘의 문제 안 본 것 추적: 칼럼 읽음과 동일하게 "확인(열어봄)" 기준 (readIds 공용) */
function isExamViewed(exam, readIds) {
  return readIds && readIds.has(exam.id);
}
function todayUnreadCount(exams, readIds) {
  return (exams || []).filter(
    (e) => (e.examType || "level") === "today" && isPublished(e) && !isExamViewed(e, readIds)
  ).length;
}

function Exams(props) {
  const { initialSub, initialNo, pushUrl } = props;
  const allRates = useAllExamRates(); // null=로딩중, false=서버에 함수 없음, {}=결과
  // 주소가 /exam/310001 이면 그 시험의 종류로 시작
  const byNo = initialNo ? findByNo(props.exams, initialNo) : null;
  const startType =
    byNo ? (byNo.examType || "level")
    : (initialSub === "level" || initialSub === "today") ? initialSub
    : null;
  const [examType, setExamType] = useState(startType); // null=선택화면
  const goUrl = (path) => { if (pushUrl) pushUrl(path); };
  const pick = (t) => { setExamType(t); goUrl("/exam/" + t); };
  if (!examType) return <ExamChooser onPick={pick} todayUnread={todayUnreadCount((props.exams || []).filter(isPublished), props.readIds || new Set())} />;
  const filtered = (props.exams || []).filter((e) => (e.examType || "level") === examType);
  const onBackToChooser = () => { setExamType(null); goUrl("/exam"); };
  const shared = { ...props, examType, onBackToChooser, initialNo, goUrl, allRates };
  if (props.role === "admin")
    return <ExamsAdmin {...shared} exams={filtered} />;
  // 학생/비회원: 공개 시각이 지난 시험만 노출
  const visible = filtered.filter(isPublished);
  return <ExamsStudent {...shared} exams={visible} />;
}

/* ---------- 관리자: 시험 목록 / 출제 / 채점 / (남의 시험) 응시 ---------- */
function ExamsAdmin({ exams, isSuper, allRates, onAddExam, onEditExam, onDeleteExam, subs, onGradeSub, onAddSub, getAnswers, myId, student, loggedIn, guestSubs, examType, onBackToChooser, users, readIds, onView, initialNo, goUrl }) {
  const [mode, setMode] = useState("list");
  const [activeExam, setActiveExam] = useState(null);
  const [taking, setTaking] = useState(() => (initialNo ? findByNo(exams, initialNo) || null : null));
  const url = (p) => { if (goUrl) goUrl(p); };
  const closeExam = () => { setTaking(null); url("/exam/" + examType); };

  const openGrade = (exam) => {
    setActiveExam(exam);
    setMode("grade");
  };
  const openEdit = (exam) => {
    setActiveExam(exam);
    setMode("edit");
  };
  const removeExam = async (exam) => {
    if (!confirm(`'${exam.title}' 시험을 삭제할까요? 되돌릴 수 없어요.`)) return;
    await onDeleteExam(exam.id);
  };

  if (taking)
    return (
      <ExamTaker taking={taking} setTaking={closeExam} student={student} loggedIn={loggedIn} onAddSub={onAddSub} getAnswers={getAnswers} />
    );

  if (mode === "create")
    return (
      <ExamEditor
        defaultType={examType}
        onCancel={() => setMode("list")}
        onSave={async (exam) => {
          await onAddExam(exam);
          setMode("list");
        }}
      />
    );

  if (mode === "edit" && activeExam)
    return (
      <ExamEditor
        initial={activeExam}
        onCancel={() => setMode("list")}
        onSave={async (exam) => {
          await onEditExam(activeExam.id, exam);
          setMode("list");
        }}
      />
    );

  if (mode === "grade" && activeExam)
    return (
      <GradePanel
        exam={activeExam}
        subs={subs.filter((s) => s.examId === activeExam.id)}
        guestSubs={(guestSubs || []).filter((g) => g.exam_id === activeExam.id)}
        users={users}
        onBack={() => setMode("list")}
        onSaveGrade={async (updated) => {
          await onGradeSub(updated);
        }}
      />
    );

  return (
    <div className="mr-col">
      <button className="mr-back" onClick={onBackToChooser}>
        시험 종류
      </button>
      <div className="mr-list-top">
        <span className="mr-list-title">{EXAM_TYPES[examType]}</span>
        <button className="mr-btn" onClick={() => setMode("create")}>
          + 새 시험 출제
        </button>
      </div>
      {exams.length === 0 ? (
        <Empty text="아직 출제된 시험이 없어요." />
      ) : (
        exams.map((ex, i) => {
          const exSubs = subs.filter((s) => s.examId === ex.id);
          const pending = exSubs.filter((s) => !s.graded).length;
          const isMine = ex.authorId && myId && ex.authorId === myId;
          const canEdit = isSuper || isMine || !ex.authorId;
          const myTake = subs.find((s) => s.examId === ex.id && s.student === student && student);
          const unread = examType === "today" && !isExamViewed(ex, readIds);
          return (
            <article className="mr-card" key={ex.id} style={{ animationDelay: `${Math.min(i, 5) * 45}ms` }}>
              <div className="mr-notice-head">
                <h3>{unread && <span className="mr-unread-dot" />}{ex.title}</h3>
                <span className="mr-date">{fmtDate(ex.createdAt)}</span>
              </div>
              {!isPublished(ex) && (
                <div className="mr-sched-tag">⏰ 예약됨 · {new Date(ex.publishAt).getMonth() + 1}월 {new Date(ex.publishAt).getDate()}일 공개</div>
              )}
              <div className="mr-exam-meta">
                <span>출제자 {ex.author || "관리자"}{isMine ? " (나)" : ""}</span>
                <span>·</span>
                <span>문항 {ex.questions.length}개</span>
                <span>·</span>
                <span>만점 {maxScore(ex)}점</span>
                <span>·</span>
                <span>제출 {exSubs.length}건</span>
                <span>·</span>
                {allRates && allRates !== true
                  ? <ExamAvgRate stat={allRates[ex.id]} />
                  : <ExamAvgRateSolo examId={ex.id} questions={ex.questions} />}
                {pending > 0 && <span className="mr-badge-red">채점 대기 {pending}</span>}
              </div>
              <div className="mr-row-between" style={{ marginTop: "14px" }}>
                <div>
                  {!isMine && (myTake ? (
                    <span className="mr-result-pill">
                      내 점수 {totalScore(ex, myTake)} / {maxScore(ex)}
                    </span>
                  ) : (
                    <button className="mr-btn" onClick={() => { if (onView) onView(ex.id); setTaking(ex); if (ex.no) url("/exam/" + ex.no); }}>
                      응시하기
                    </button>
                  ))}
                </div>
                <div className="mr-gap">
                  {canEdit && (
                    <button className="mr-btn-ghost" onClick={() => openEdit(ex)}>
                      수정
                    </button>
                  )}
                  {canEdit && (
                    <button className="mr-btn-ghost danger" onClick={() => removeExam(ex)}>
                      삭제
                    </button>
                  )}
                  <button className="mr-btn-ghost" onClick={() => openGrade(ex)}>
                    제출/채점 보기
                  </button>
                </div>
              </div>
            </article>
          );
        })
      )}
    </div>
  );
}

/* ---------- 시험 출제/수정 에디터 ---------- */
function ExamEditor({ initial, defaultType, onCancel, onSave }) {
  function blankQ() {
    return { id: uid(), type: "mc", text: "", image: "", latex: "", mathTree: null, body: [{ id: segId(), type: "text", v: "" }], points: 10, options: ["", ""], answer: 0, accept: "", explain: null };
  }
  const [title, setTitle] = useState(initial ? initial.title : "");
  const [examType, setExamType] = useState(initial ? (initial.examType || "level") : (defaultType || "level"));
  const toLocalInput = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  const [scheduled, setScheduled] = useState(initial ? !!initial.publishAt : false);
  // 오늘의 문제는 공개 날짜가 곧 며칠자 문제인지를 뜻한다.
  // 예전에 즉시 공개로 올린 글은 만든 날짜를 채워 넣어야 수정만 해도 날짜가 옮겨가지 않는다
  const [publishStr, setPublishStr] = useState(
    initial && initial.publishAt
      ? toLocalInput(initial.publishAt)
      : initial && initial.examType === "today" && initial.createdAt
        ? toLocalInput(initial.createdAt)
        : ""
  );
  React.useEffect(() => {
    if (examType === "today" && !publishStr) setPublishStr(toLocalInput(Date.now()));
  }, [examType]);
  const [questions, setQuestions] = useState(
    initial && initial.questions && initial.questions.length
      ? initial.questions.map((q) => {
          const m = { options: ["", ""], accept: "", answer: 0, latex: "", mathTree: null, body: null, explain: null, ...q };
          if (!m.body || !m.body.length) {
            const segs = [];
            if (m.text) segs.push({ id: segId(), type: "text", v: m.text });
            if (m.latex) segs.push({ id: segId(), type: "math", latex: m.latex, tree: m.mathTree || null });
            m.body = segs.length ? segs : null;
          }
          return m;
        })
      : [blankQ()]
  );
  const [expOpen, setExpOpen] = useState({}); // 해설 입력칸 펼침 상태 (문항별)
  const update = (id, patch) => setQuestions((qs) => qs.map((q) => (q.id === id ? { ...q, ...patch } : q)));
  const addQ = () => setQuestions((qs) => [...qs, blankQ()]);
  const delQ = (id) => setQuestions((qs) => (qs.length > 1 ? qs.filter((q) => q.id !== id) : qs));

  const setOption = (qid, idx, val) =>
    setQuestions((qs) =>
      qs.map((q) => (q.id === qid ? { ...q, options: q.options.map((o, i) => (i === idx ? val : o)) } : q))
    );
  const addOption = (qid) =>
    setQuestions((qs) => qs.map((q) => (q.id === qid ? { ...q, options: [...q.options, ""] } : q)));
  const delOption = (qid, idx) =>
    setQuestions((qs) =>
      qs.map((q) => {
        if (q.id !== qid || q.options.length <= 2) return q;
        const options = q.options.filter((_, i) => i !== idx);
        let answer = q.answer;
        if (idx < answer) answer -= 1; // 정답보다 앞 보기를 지우면 정답이 같은 보기를 계속 가리키게 당김
        if (answer >= options.length) answer = options.length - 1;
        if (answer < 0) answer = 0;
        return { ...q, options, answer };
      })
    );

  const save = () => {
    if (!title.trim()) return alert("시험 제목을 입력하세요.");
    const final = questions.map((q) => ({ ...q, points: Number(q.points) || 0 }));
    for (const q of final) {
      const bodyText = (q.body || []).map((s) => (s.type === "text" ? s.v : s.latex || "")).join("");
      if (!q.image && !bodyText.trim())
        return alert("각 문항에 문제 본문(텍스트·수식) 또는 사진을 넣어주세요.");
      if (q.type === "mc" && q.options.some((o) => !o.trim()))
        return alert("객관식 보기를 모두 입력하세요.");
      if (q.type === "short" && !String(q.accept || "").trim())
        return alert("주관식 문항의 정답을 입력하세요. (자동 채점에 사용됩니다)");
    }
    const midnightOf = (s) => {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d, 0, 0, 0, 0).getTime(); // 그 날 자정에 공개
    };
    let publishAt = null;
    if (examType === "today") {
      // 오늘의 문제는 제목과 무관하게 이 날짜로 달력에 꽂힌다
      if (!publishStr) return alert("문제 날짜를 선택하세요.");
      publishAt = midnightOf(publishStr);
      if (isNaN(publishAt)) return alert("문제 날짜가 올바르지 않아요.");
    } else if (scheduled) {
      if (!publishStr) return alert("공개 날짜를 선택하세요.");
      publishAt = midnightOf(publishStr);
      if (isNaN(publishAt)) return alert("공개 날짜가 올바르지 않아요.");
    }
    onSave({ title: title.trim(), examType, publishAt, questions: final });
  };

  return (
    <div className="mr-col">
      <section className="mr-card mr-writer">
        <div className="mr-card-tag">{initial ? "시험 수정" : "시험 출제"}</div>
        <input
          className="mr-input"
          placeholder="시험 제목"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
        />
        <div className="mr-cat-label">종류</div>
        <SegBar cls="mr-cat-seg" n={2} i={examType === "level" ? 0 : 1} onPick={(k) => setExamType(k === 0 ? "level" : "today")}>
          <button className={examType === "level" ? "on" : ""} onClick={() => setExamType("level")}>레벨테스트</button>
          <button className={examType === "today" ? "on" : ""} onClick={() => setExamType("today")}>오늘의 문제</button>
        </SegBar>
        {examType === "today" ? (
          <>
            <div className="mr-cat-label">문제 날짜</div>
            <input
              className="mr-input"
              type="date"
              value={publishStr}
              onChange={(e) => setPublishStr(e.target.value)}
            />
            <p className="mr-sched-hint">제목과 상관없이 여기서 고른 날짜의 오늘의 문제로 올라가요. 지난 날짜를 고르면 그 자리에 바로 채워지고, 앞으로의 날짜를 고르면 그날 자정부터 보여요.</p>
          </>
        ) : (
          <>
            <div className="mr-cat-label">공개 시점</div>
            <SegBar cls="mr-cat-seg" n={2} i={scheduled ? 1 : 0} onPick={(k) => setScheduled(k === 1)}>
              <button className={!scheduled ? "on" : ""} onClick={() => setScheduled(false)}>즉시 공개</button>
              <button className={scheduled ? "on" : ""} onClick={() => setScheduled(true)}>예약 공개</button>
            </SegBar>
            {scheduled && (
              <>
                <input
                  className="mr-input"
                  type="date"
                  value={publishStr}
                  onChange={(e) => setPublishStr(e.target.value)}
                />
                <p className="mr-sched-hint">선택한 날짜 자정부터 학생과 비회원에게 공개돼요. 그 전까지는 관리자에게만 보여요.</p>
              </>
            )}
          </>
        )}
      </section>

      {questions.map((q, qi) => (
        <section className="mr-card mr-qedit" key={q.id}>
          <div className="mr-qedit-head">
            <span className="mr-qnum">Q{qi + 1}</span>
            <SegBar cls="mr-seg" n={2} i={q.type === "mc" ? 0 : 1} onPick={(k) => update(q.id, { type: k === 0 ? "mc" : "short" })}>
              <button className={q.type === "mc" ? "on" : ""} onClick={() => update(q.id, { type: "mc" })}>
                객관식
              </button>
              <button
                className={q.type === "short" ? "on" : ""}
                onClick={() => update(q.id, { type: "short" })}
              >
                주관식
              </button>
            </SegBar>
            <label className="mr-points">
              배점
              <input
                type="number"
                min={0}
                value={q.points}
                onChange={(e) => update(q.id, { points: e.target.value })}
              />
            </label>
            <button className="mr-link-del" onClick={() => delQ(q.id)}>
              삭제
            </button>
          </div>

          <QuestionImage value={q.image} onChange={(img) => update(q.id, { image: img })} />
          <div className="mr-cat-label">문제 본문 (텍스트 + 수식)</div>
          <RichBody value={q.body} onChange={(body) => update(q.id, { body })} />

          {q.type === "mc" ? (
            <div className="mr-options">
              {q.options.map((opt, oi) => (
                <div className="mr-opt-row" key={oi}>
                  <input
                    type="radio"
                    name={`ans-${q.id}`}
                    checked={q.answer === oi}
                    onChange={() => update(q.id, { answer: oi })}
                    title="정답으로 지정"
                  />
                  <span className="mr-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                  <input
                    className="mr-input mr-opt-input"
                    placeholder={`보기 ${oi + 1}`}
                    value={opt}
                    onChange={(e) => setOption(q.id, oi, e.target.value)}
                  />
                  {q.options.length > 2 && (
                    <button className="mr-x" onClick={() => delOption(q.id, oi)}>
                      ×
                    </button>
                  )}
                </div>
              ))}
              <button className="mr-add-opt" onClick={() => addOption(q.id)}>
                + 보기 추가
              </button>
              <div className="mr-hint">왼쪽 ○ 를 눌러 정답을 지정하세요.</div>
            </div>
          ) : (
            <div className="mr-short-answer">
              <input
                className="mr-input"
                placeholder="정답"
                value={q.accept || ""}
                onChange={(e) => update(q.id, { accept: e.target.value })}
              />
            </div>
          )}
          {expOpen[q.id] || hasExplain(q) ? (
            <>
              <div className="mr-cat-label">해설 (선택 — 채점 결과에서 보여요)</div>
              <RichBody
                value={q.explain}
                onChange={(explain) => update(q.id, { explain })}
                ph="해설을 입력하세요. 비워두면 학생에게 '출제자에게 문의하세요' 안내가 떠요."
              />
            </>
          ) : (
            <button type="button" className="mr-add-opt" style={{ marginTop: "12px" }} onClick={() => setExpOpen((o) => ({ ...o, [q.id]: true }))}>
              ＋ 해설 달기 (선택)
            </button>
          )}
        </section>
      ))}

      <div className="mr-row-between">
        <button className="mr-btn-ghost" onClick={addQ}>
          + 문항 추가
        </button>
        <div className="mr-gap">
          <button className="mr-btn-text" onClick={onCancel}>
            취소
          </button>
          <button className="mr-btn" onClick={save}>
            {initial ? "수정 완료" : "시험 저장"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- 관리자: 채점 패널 ---------- */
function GradePanel({ exam, subs, guestSubs, users, onBack, onSaveGrade }) {
  const [openId, setOpenId] = useState(null);
  const guests = guestSubs || [];
  const rates = useExamRates(exam.id);

  return (
    <div className="mr-col">
      <button className="mr-back" onClick={onBack}>
        시험 목록
      </button>
      <section className="mr-card">
        <div className="mr-notice-head">
          <h3>{exam.title}</h3>
          <span className="mr-date">만점 {maxScore(exam)}점</span>
        </div>
      </section>

      <section className="mr-card">
        <div className="mr-card-tag">문항별 통계</div>
        <div className="mr-qrate-sub" style={{ marginBottom: "10px" }}>
          회원 응시 {subs.length}명 · 비회원 참여 {guests.length}명
        </div>
        <div className="mr-qrate-list">
          {exam.questions.map((q, qi) => {
            // 응시 화면·채점 결과와 같은 서버 집계를 사용해 숫자가 어긋나지 않게 함
            const st = rates[q.id];
            const mRate = st && st.total ? Math.round((100 * st.correct) / st.total) : null;
            const gRate = st && st.gtotal ? Math.round((100 * st.gcorrect) / st.gtotal) : null;
            return (
              <div className="mr-qrate-row" key={q.id}>
                <span className="mr-qnum-sm">Q{qi + 1}</span>
                <span className="mr-qrate-val" style={{ color: rateColor(mRate) }}>회원정답률 {mRate === null ? "—" : mRate + "%"}</span>
                <span className="mr-qrate-wrong" style={{ color: rateColor(gRate) }}>비회원정답률 {gRate === null ? "—" : gRate + "%"}</span>
              </div>
            );
          })}
        </div>
      </section>

      {subs.length === 0 ? (
        <Empty text="아직 제출된 답안이 없어요." />
      ) : (
        subs.map((s) => (
          <SubmissionRow
            key={s.id}
            exam={exam}
            sub={s}
            users={users}
            open={openId === s.id}
            onToggle={() => setOpenId(openId === s.id ? null : s.id)}
            onSaveGrade={onSaveGrade}
          />
        ))
      )}
    </div>
  );
}

function SubmissionRow({ exam, sub, users, open, onToggle, onSaveGrade }) {
  const [manual, setManual] = useState(sub.manualScores || {});
  useEffect(() => setManual(sub.manualScores || {}), [sub]);

  const save = () => {
    const cleaned = {};
    exam.questions
      .filter((q) => q.type === "short")
      .forEach((q) => {
        const raw = manual[q.id];
        if (raw === undefined || raw === null || raw === "") return;
        cleaned[q.id] = Math.max(0, Math.min(Number(q.points) || 0, Number(raw) || 0));
      });
    onSaveGrade({ ...sub, manualScores: cleaned, graded: true });
  };

  const auto = autoScore(exam, sub.answers);
  const total = totalScore(exam, { ...sub, manualScores: manual });

  return (
    <article className="mr-card mr-sub">
      <div className="mr-sub-head" onClick={onToggle}>
        <div className="mr-sub-name">
          <span className="mr-avatar">{(sub.student || "?")[0]}</span>
          <div>
            <div className="mr-strong">{studentName(sub.student, users)}</div>
            <div className="mr-date">{fmtDate(sub.submittedAt)}</div>
          </div>
        </div>
        <div className="mr-sub-score">
          {sub.graded ? (
            <span className="mr-score-done">
              {totalScore(exam, sub)} / {maxScore(exam)}
            </span>
          ) : (
            <span className="mr-badge-red">채점 대기</span>
          )}
          <span className="mr-chevron">{open ? "▲" : "▼"}</span>
        </div>
      </div>

      {open && (
        <div className="mr-sub-body">
          {exam.questions.map((q, qi) => {
            const a = sub.answers[q.id];
            if (q.type === "mc") {
              const correct = a === q.answer;
              return (
                <div className="mr-grade-q" key={q.id}>
                  <div className="mr-grade-qtext">
                    <span className="mr-qnum-sm">Q{qi + 1}</span>
                  </div>
                  {q.image && <img className="mr-q-img sm" src={q.image} alt="문제" />}
                  <QBody q={q} />
                  <div className="mr-mc-review">
                    {q.options.map((opt, oi) => (
                      <div
                        key={oi}
                        className={
                          "mr-mc-opt" +
                          (oi === q.answer ? " is-answer" : "") +
                          (oi === a && oi !== q.answer ? " is-wrong" : "")
                        }
                      >
                        {String.fromCharCode(9311 + oi + 1)} {opt}
                        {oi === q.answer && <span className="mr-tag-correct">정답</span>}
                        {oi === a && <span className="mr-tag-chosen">선택</span>}
                      </div>
                    ))}
                  </div>
                  <div className={"mr-auto-mark " + (correct ? "ok" : "no")}>
                    {correct ? `정답 +${q.points}점` : `오답 0점`} (자동)
                  </div>
                </div>
              );
            }
            const scorrect = isShortCorrect(q, a);
            const overridden = manual[q.id] !== undefined && manual[q.id] !== null && manual[q.id] !== "";
            return (
              <div className="mr-grade-q" key={q.id}>
                <div className="mr-grade-qtext">
                  <span className="mr-qnum-sm">Q{qi + 1}</span>
                </div>
                {q.image && <img className="mr-q-img sm" src={q.image} alt="문제" />}
                <QBody q={q} />
                <div className="mr-answer-box">
                  <span className="mr-ans-label">학생 답안</span>
                  {a ? a : <em className="mr-muted">미응답</em>}
                </div>
                <div className="mr-accept">
                  정답: <strong>{q.accept || "(미설정)"}</strong>
                </div>
                <div className={"mr-auto-mark " + (scorrect ? "ok" : "no")}>
                  {scorrect ? `정답 +${q.points}점` : `오답 0점`} (자동)
                </div>
                <label className="mr-manual">
                  점수 보정
                  <input
                    type="number"
                    min={0}
                    max={q.points}
                    placeholder={String(scorrect ? q.points : 0)}
                    value={manual[q.id] ?? ""}
                    onChange={(e) => setManual({ ...manual, [q.id]: e.target.value })}
                  />
                  <span className="mr-muted">/ {q.points}점</span>
                  {overridden && (
                    <button className="mr-reset" onClick={() => setManual({ ...manual, [q.id]: "" })}>
                      자동으로
                    </button>
                  )}
                </label>
              </div>
            );
          })}
          <div className="mr-row-between mr-grade-foot">
            <span className="mr-muted">
              자동 채점 {auto}점{total !== auto ? ` → 보정 후 ${total}점` : ""} ·{" "}
              <strong className="mr-ink">최종 {total}점</strong> / {maxScore(exam)}점
            </span>
            <button className="mr-btn" onClick={save}>
              보정 저장
            </button>
          </div>
        </div>
      )}
    </article>
  );
}

/* ---------- 오늘의 문제: 체스닷컴 일일 퍼즐 스타일 ---------- */
function dailyDay(ex) { return ex.publishAt || ex.createdAt || 0; }
function fmtDay(ms) { const d = new Date(ms); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }

/* 정답을 맞히면 초록, 틀리면 빨강으로 즉시 반응하고 제출을 기록한다 (1문항 전용) */
function DailySolve({ exam, loggedIn, student, onAddSub, onGuestSubmit, getAnswers, onView }) {
  // graded: 제출 뒤 정답까지 채워진 시험. 정답이 딸려온 상태면 처음부터 이게 곧 exam 이다
  const [graded, setGraded] = useState(exam);
  const q = graded.questions[0];
  const [picked, setPicked] = useState(null);
  const [typed, setTyped] = useState("");
  const [done, setDone] = useState(false);   // 답을 골라 더 못 고치는 상태
  const [ready, setReady] = useState(false); // 맞았는지 틀렸는지 아는 상태
  const [correct, setCorrect] = useState(false);
  const lock = React.useRef(false);

  // 기록하고, 정답이 빠져 있었으면 서버에서 받아온다
  const record = async (answers) => {
    if (onView) onView(exam.id);
    const clean = (student || "").trim();
    try {
      if (loggedIn && clean) {
        await onAddSub({ examId: exam.id, student: clean, answers, manualScores: {}, graded: true });
        if (answersHidden(exam) && getAnswers) return await getAnswers(exam.id);
      } else {
        return await onGuestSubmit(exam.id, answers);
      }
    } catch (e) {}
    return null;
  };
  const finish = async (answers) => {
    if (lock.current) return;
    lock.current = true;
    // 정답을 이미 갖고 있으면 기다릴 것 없이 바로 알려준다
    if (!answersHidden(exam)) {
      setCorrect(isQCorrect(q, { answers, manualScores: {} }));
      setDone(true);
      setReady(true);
      record(answers);
      return;
    }
    // 서버 답을 기다리는 동안은 판정을 그리지 않는다.
    // 먼저 그리면 아직 모르는 상태가 오답으로 보였다가 정답으로 바뀐다
    setDone(true);
    const qs = await record(answers);
    const g = qs ? withAnswers(exam, qs) : exam;
    setGraded(g);
    setCorrect(isQCorrect(g.questions[0], { answers, manualScores: {} }));
    setReady(true);
  };

  if (q.type === "mc")
    return (
      <div className="mr-daily-solve">
        <div className="mr-daily-opts">
          {q.options.map((opt, oi) => {
            let cls = "mr-daily-opt";
            if (ready) cls += oi === q.answer ? " right" : oi === picked ? " wrong" : " dim";
            else if (done && oi === picked) cls += " picked"; // 채점 중에는 고른 것만 표시
            return (
              <button key={oi} className={cls} disabled={done}
                onClick={() => { setPicked(oi); finish({ [q.id]: oi }); }}>
                <span className="mr-daily-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                <span className="mr-daily-opt-txt">{opt}</span>
                {ready && oi === q.answer && <span className="mr-daily-flag">정답</span>}
              </button>
            );
          })}
        </div>
        {done && !ready && <div className="mr-daily-grading">채점 중…</div>}
        {ready && <DailyResult correct={correct} q={q} exam={graded} />}
      </div>
    );

  return (
    <div className="mr-daily-solve">
      {!done ? (
        <div className="mr-daily-short">
          <input className="mr-input" placeholder="답을 입력하세요" value={typed}
            onChange={(e) => setTyped(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && typed.trim()) finish({ [q.id]: typed.trim() }); }} />
          <button className="mr-btn" disabled={!typed.trim()}
            onClick={() => finish({ [q.id]: typed.trim() })}>확인</button>
        </div>
      ) : (
        <>
          <div className={"mr-daily-your" + (ready ? (correct ? " ok" : " no") : "")}>내 답 {typed}</div>
          {ready ? <DailyResult correct={correct} q={q} exam={graded} />
                 : <div className="mr-daily-grading">채점 중…</div>}
        </>
      )}
    </div>
  );
}

/* 이미 푼 1문항 문제의 결과를 다시 보여준다 */
function DailyReview({ exam, sub }) {
  const q = exam.questions[0];
  const correct = isQCorrect(q, sub);
  const mine = sub.answers[q.id];
  return (
    <div className="mr-daily-solve">
      {q.type === "mc" ? (
        <div className="mr-daily-opts">
          {q.options.map((opt, oi) => {
            let cls = "mr-daily-opt";
            cls += oi === q.answer ? " right" : oi === mine ? " wrong" : " dim";
            return (
              <div key={oi} className={cls}>
                <span className="mr-daily-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                <span className="mr-daily-opt-txt">{opt}</span>
                {oi === q.answer && <span className="mr-daily-flag">정답</span>}
              </div>
            );
          })}
        </div>
      ) : (
        <div className={"mr-daily-your " + (correct ? "ok" : "no")}>내 답 {(mine && String(mine).trim()) || "(미작성)"}</div>
      )}
      <DailyResult correct={correct} q={q} exam={exam} />
    </div>
  );
}

function DailyResult({ correct, q, exam }) {
  return (
    <div className={"mr-daily-result " + (correct ? "ok" : "no")}>
      <div className="mr-daily-result-big">{correct ? "정답이에요! 🎉" : "아쉬워요"}</div>
      {!correct && q.type === "short" && q.accept ? <div className="mr-daily-answer">정답 <b>{q.accept}</b></div> : null}
      {hasExplain(q) && <ExplainBlock q={q} exam={exam} />}
    </div>
  );
}

function dayKey(ms) { const d = new Date(ms); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

/* 날짜 선택 달력 — 푼 날은 보라 ✓, 선택일은 보라 강조, 문제 없는 날은 흐리게 */
function DailyCalendar({ days, solvedIds, selId, onPick, onClose }) {
  const byDay = {};
  days.forEach((ex) => { const k = dayKey(dailyDay(ex)); if (!(k in byDay)) byDay[k] = ex; });
  const selEx = days.find((d) => d.id === selId);
  const selMs = selEx ? dailyDay(selEx) : Date.now();
  const [ym, setYm] = useState(() => { const d = new Date(selMs); return { y: d.getFullYear(), m: d.getMonth() }; });
  const startDow = (new Date(ym.y, ym.m, 1).getDay() + 6) % 7; // 월요일=0
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const shift = (n) => setYm((p) => { let m = p.m + n, y = p.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { y, m }; });
  return (
    <div className="mr-modal-overlay" onClick={onClose} style={{ zIndex: 460 }}>
      <div className="mr-cal" onClick={(e) => e.stopPropagation()}>
        <div className="mr-cal-head">
          <span className="mr-modal-title">날짜 선택</span>
          <button className="mr-modal-x" onClick={onClose}>×</button>
        </div>
        <div className="mr-cal-nav">
          <button onClick={() => shift(-1)} aria-label="이전 달">‹</button>
          <span>{ym.y}년 {ym.m + 1}월</span>
          <button onClick={() => shift(1)} aria-label="다음 달">›</button>
        </div>
        <div className="mr-cal-dow">{["월", "화", "수", "목", "금", "토", "일"].map((w) => <span key={w}>{w}</span>)}</div>
        <div className="mr-cal-grid">
          {cells.map((d, i) => {
            if (d === null) return <span key={"e" + i} className="mr-cal-cell empty" />;
            const ex = byDay[ym.y * 10000 + (ym.m + 1) * 100 + d];
            const solved = ex && solvedIds.has(ex.id);
            const isSel = ex && ex.id === selId;
            const cls = "mr-cal-cell" + (ex ? " has" : " none") + (solved ? " solved" : "") + (isSel ? " sel" : "");
            return (
              <button key={d} className={cls} disabled={!ex} onClick={() => { if (ex) { onPick(ex); onClose(); } }}>
                <span className="mr-cal-num">{d}</span>
                {solved && <span className="mr-cal-check">✓</span>}
              </button>
            );
          })}
        </div>
        <div className="mr-cal-legend"><span className="mr-cal-check">✓</span> 푼 문제</div>
      </div>
    </div>
  );
}

function TodayPuzzle({ exams, subs, student, loggedIn, allRates, onAddSub, onGuestSubmit, getAnswers, onOpen, onView, onBackToChooser }) {
  const days = (exams || []).slice().sort((a, b) => dailyDay(b) - dailyDay(a));
  const mine = (subs || []).filter((s) => s.student && student && s.student === student);
  const myOf = (id) => mine.find((s) => s.examId === id) || null;
  const solvedIds = new Set(mine.map((s) => s.examId));

  const [selId, setSelId] = useState(days[0] ? days[0].id : null);
  const [calOpen, setCalOpen] = useState(false);
  const sel = days.find((d) => d.id === selId) || days[0] || null;
  const idx = sel ? days.findIndex((d) => d.id === sel.id) : -1;
  const newer = idx > 0 ? days[idx - 1] : null;                 // 더 최신 문제
  const older = idx >= 0 && idx < days.length - 1 ? days[idx + 1] : null; // 더 지난 문제
  const sSub = sel ? myOf(sel.id) : null;
  const sRate = sel && allRates && typeof allRates === "object" ? combinedRate(allRates[sel.id]) : null;
  const sDiff = difficultyOf(sRate);

  return (
    <div className="mr-col">
      <button className="mr-back" onClick={onBackToChooser}>시험 종류</button>
      {!sel ? (
        <Empty text="아직 오늘의 문제가 없어요." />
      ) : (
        <>
          <article className="mr-daily-hero">
            <div className="mr-daily-badges">
              <span className="mr-daily-badge">오늘의 문제</span>
              {sDiff && <span className="mr-diff" style={{ color: rateColor(sRate), background: rateColor(sRate) + "22" }}>{sDiff.label}</span>}
              {sRate !== null && <span className="mr-daily-rate" style={{ color: rateColor(sRate) }}>평균정답률 {sRate}%</span>}
            </div>
            <h2 className="mr-daily-title">{sel.title}</h2>
            {sel.questions.length === 1 ? (
              <>
                {/* the picture lives on the question, and QBody does not draw it */}
                {sel.questions[0].image && <img className="mr-q-img" src={sel.questions[0].image} alt="문제" />}
                <div className="mr-daily-q"><QBody q={sel.questions[0]} /></div>
                {/* key resets the solve state when the day changes */}
                {sSub
                  ? <DailyReview key={sel.id} exam={sel} sub={sSub} />
                  : <DailySolve key={sel.id} exam={sel} loggedIn={loggedIn} student={student} onAddSub={onAddSub} onGuestSubmit={onGuestSubmit} getAnswers={getAnswers} onView={onView} />}
              </>
            ) : (
              <>
                <div className="mr-daily-meta">문항 {sel.questions.length}개 · 만점 {maxScore(sel)}점</div>
                {sSub ? (
                  <div className="mr-daily-donerow">
                    <span className="mr-result-pill">내 점수 {totalScore(sel, sSub)} / {maxScore(sel)}</span>
                  </div>
                ) : (
                  <button className="mr-btn mr-daily-start" onClick={() => onOpen(sel)}>풀기</button>
                )}
              </>
            )}
          </article>

          {/* bottom date bar: arrows change day, tap the date to open the calendar */}
          <div className="mr-daily-nav">
            <button className="mr-daily-arrow" disabled={!older} onClick={() => older && setSelId(older.id)} aria-label="이전 문제">‹</button>
            <button className="mr-daily-datebtn" onClick={() => setCalOpen(true)}>
              <span className="mr-daily-datebtn-day">{fmtDay(dailyDay(sel))}</span>
              <span className="mr-daily-datebtn-hint">날짜 선택</span>
            </button>
            <button className="mr-daily-arrow" disabled={!newer} onClick={() => newer && setSelId(newer.id)} aria-label="다음 문제">›</button>
          </div>

          {calOpen && (
            <DailyCalendar days={days} solvedIds={solvedIds} selId={sel.id}
              onPick={(ex) => setSelId(ex.id)} onClose={() => setCalOpen(false)} />
          )}
        </>
      )}
    </div>
  );
}

/* ---------- 참여자: 시험 목록 / 응시 / 결과 ---------- */
function ExamsStudent({ student, loggedIn, allRates, requireLogin, exams, subs, onAddSub, onGuestSubmit, getAnswers, examType, onBackToChooser, readIds, onView, initialNo, goUrl }) {
  const [taking, setTaking] = useState(() => (initialNo ? findByNo(exams, initialNo) || null : null));
  // 이미 푼 시험의 채점 결과를 목록에서 바로 열어보는 화면
  const [reviewing, setReviewing] = useState(null);
  const step = useStep(taking || reviewing ? 1 : 0);
  const url = (p) => { if (goUrl) goUrl(p); };
  const openExam = (ex) => { if (onView) onView(ex.id); setTaking(ex); if (ex.no) url("/exam/" + ex.no); };
  const closeExam = () => { setTaking(null); url("/exam/" + examType); };

  const [q, setQ] = useState("");
  const [sort, setSort] = useState("recent");
  const SORTS = ["recent", "easy", "hard"];
  const rateOf = (ex) => (allRates && typeof allRates === "object" ? combinedRate(allRates[ex.id]) : null);
  const kw = q.trim().toLowerCase();
  let shown = exams.filter((ex) =>
    !kw || (ex.title || "").toLowerCase().includes(kw) || (ex.author || "").toLowerCase().includes(kw)
  );
  if (sort !== "recent") {
    // 정답률 데이터가 없는 시험은 뒤로 보낸다
    shown = shown.slice().sort((a, b) => {
      const ra = rateOf(a), rb = rateOf(b);
      if (ra === null && rb === null) return 0;
      if (ra === null) return 1;
      if (rb === null) return -1;
      return sort === "hard" ? ra - rb : rb - ra;
    });
  }

  if (taking)
    return (
      <div className={step.trim()} key="taking">
        <ExamTaker taking={taking} setTaking={closeExam} student={student} loggedIn={loggedIn} onAddSub={onAddSub} onGuestSubmit={onGuestSubmit} getAnswers={getAnswers} />
      </div>
    );

  if (reviewing) {
    const { exam, sub } = reviewing;
    const score = totalScore(exam, sub);
    const max = maxScore(exam);
    const ratio = max ? score / max : 0;
    const tone = ratio >= 0.8 ? "good" : ratio >= 0.5 ? "mid" : "low";
    return (
      <div className={"mr-col" + step} key="review">
        <button className="mr-back" onClick={() => setReviewing(null)}>{EXAM_TYPES[examType]}</button>
        <section className="mr-card" style={{ textAlign: "center", padding: "28px 20px" }}>
          <div className="mr-card-tag" style={{ marginBottom: "10px" }}>{exam.title}</div>
          <div className={"mr-record-score " + tone} style={{ fontSize: "40px" }}>
            {score}
            <span className="mr-record-max"> / {max}</span>
          </div>
          <div className="mr-record-meta" style={{ marginTop: "10px" }}>{fmtDate(sub.submittedAt)}</div>
        </section>
        <div className="mr-list-top">
          <span className="mr-list-title">채점 결과</span>
        </div>
        <ReviewList exam={exam} sub={sub} />
      </div>
    );
  }

  if (examType === "today")
    return (
      <div className={step.trim()} key="today">
        <TodayPuzzle exams={exams} subs={subs} student={student} loggedIn={loggedIn} allRates={allRates}
          onAddSub={onAddSub} onGuestSubmit={onGuestSubmit} getAnswers={getAnswers} onOpen={openExam} onView={onView} onBackToChooser={onBackToChooser} />
      </div>
    );

  return (
    <div className={"mr-col" + step} key="list">
      <button className="mr-back" onClick={onBackToChooser}>
        시험 종류
      </button>
      <div className="mr-list-top">
        <span className="mr-list-title">{EXAM_TYPES[examType]}</span>
      </div>
      {exams.length === 0 ? (
        <Empty text="아직 응시할 시험이 없어요." />
      ) : (
        <>
          {exams.length > 1 && (
            <div className="mr-listtools">
              <input
                className="mr-input mr-search"
                placeholder="제목이나 출제자로 검색"
                value={q}
                onChange={(e) => setQ(e.target.value)}
              />
              <SegBar cls="mr-sortseg" n={3} i={Math.max(0, SORTS.indexOf(sort))} onPick={(k) => setSort(SORTS[k])}>
                <button className={sort === "recent" ? "on" : ""} onClick={() => setSort("recent")}>최신순</button>
                <button className={sort === "easy" ? "on" : ""} onClick={() => setSort("easy")}>쉬운순</button>
                <button className={sort === "hard" ? "on" : ""} onClick={() => setSort("hard")}>어려운순</button>
              </SegBar>
            </div>
          )}
          {shown.length === 0 ? (
            <Empty text="검색 결과가 없어요." />
          ) : (
            shown.map((ex, i) => {
              const mine = subs.find((s) => s.examId === ex.id && s.student === student && student);
              const unread = examType === "today" && !isExamViewed(ex, readIds);
              const rate = rateOf(ex);
              const diff = difficultyOf(rate);
              return (
                <article className="mr-card" key={ex.id} style={{ animationDelay: `${Math.min(i, 5) * 45}ms` }}>
                  <div className="mr-notice-head">
                    <h3>{unread && <span className="mr-unread-dot" />}{ex.title}</h3>
                    <span className="mr-date">{fmtDate(ex.createdAt)}</span>
                  </div>
                  <div className="mr-exam-meta">
                    <span>출제자 {ex.author || "관리자"}</span>
                    <span>·</span>
                    <span>문항 {ex.questions.length}개</span>
                    <span>·</span>
                    <span>만점 {maxScore(ex)}점</span>
                    <span>·</span>
                    {allRates && allRates !== true
                      ? <ExamAvgRate stat={allRates[ex.id]} />
                      : <ExamAvgRateSolo examId={ex.id} questions={ex.questions} />}
                    {diff && <b className="mr-diff" style={{ color: rateColor(rate), background: rateColor(rate) + "22" }}>{diff.label}</b>}
                  </div>
                  <div className="mr-row-end">
                    {mine ? (
                      mine.graded ? (
                        <button className="mr-result-pill mr-result-open"
                          onClick={() => setReviewing({ exam: ex, sub: mine })}>
                          내 점수 {totalScore(ex, mine)} / {maxScore(ex)}
                          <span className="mr-result-more">채점 결과 보기</span>
                        </button>
                      ) : (
                        <span className="mr-badge-red">채점 중…</span>
                      )
                    ) : (
                      <button
                        className="mr-btn"
                        onClick={() => openExam(ex)}
                      >
                        응시하기
                      </button>
                    )}
                  </div>
                </article>
              );
            })
          )}
        </>
      )}
    </div>
  );
}

function TakeExam({ exam: rawExam, student, loggedIn, onGuestSubmit, getAnswers, onCancel, onSubmit }) {
  // 제출 전에는 정답이 빠진 채로 온다. 제출하면 서버가 정답을 주고 그때부터 이걸 쓴다
  const [graded, setGraded] = useState(null);
  const exam = graded || rawExam;
  const draftKey = "mrdraft:" + exam.id + ":" + ((student || "").trim() || "guest");
  const [answers, setAnswers] = useState(() => {
    try {
      const raw = localStorage.getItem(draftKey);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  });
  const [result, setResult] = useState(null);
  const rates = useExamRates(exam.id);
  const [restored, setRestored] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const submitLock = React.useRef(false);
  const set = (qid, val) => setAnswers((a) => ({ ...a, [qid]: val }));

  // 마운트 시 임시저장된 답안이 있었는지 표시
  useEffect(() => {
    try {
      const raw = localStorage.getItem(draftKey);
      if (raw && Object.keys(JSON.parse(raw) || {}).length > 0) setRestored(true);
    } catch (e) {}
  }, []);

  // 답안이 바뀔 때마다 자동 임시저장 (제출 전까지)
  useEffect(() => {
    if (result) return;
    try {
      localStorage.setItem(draftKey, JSON.stringify(answers));
    } catch (e) {}
  }, [answers, result]);

  const clearDraft = () => {
    try {
      localStorage.removeItem(draftKey);
    } catch (e) {}
  };

  const memRate = (qid) => {
    const st = rates[qid];
    return st && st.total ? Math.round((100 * st.correct) / st.total) : null;
  };
  const guestRate = (qid) => {
    const st = rates[qid];
    return st && st.gtotal ? Math.round((100 * st.gcorrect) / st.gtotal) : null;
  };

  const submit = async () => {
    if (submitLock.current) return; // 이미 제출 처리 중이면 무시 (중복 제출 방지)
    const unanswered = exam.questions.filter((q) => {
      const a = answers[q.id];
      if (q.type === "mc") return a === undefined || a === null;
      return !a || !String(a).trim();
    }).length;
    if (unanswered > 0 && !confirm(`아직 풀지 않은 문항이 ${unanswered}개 있어요. 그래도 제출할까요?`)) return;

    submitLock.current = true;
    setSubmitting(true);

    const sub = {
      id: uid(),
      examId: exam.id,
      student: (student || "").trim() || "비회원",
      answers,
      manualScores: {},
      graded: true,
      submittedAt: Date.now(),
    };
    const hidden = answersHidden(rawExam);
    if (loggedIn && student.trim()) {
      const res = await onSubmit(sub); // 회원: 기록 저장 (목록 이동은 리뷰 화면에서)
      if (res && res.error) {
        alert("제출 저장에 실패했어요: " + res.error + "\n네트워크를 확인하고 다시 시도해주세요.");
        submitLock.current = false;
        setSubmitting(false);
        return;
      }
      // 정답이 빠져 있었으면 채점 화면을 그리기 전에 받아온다
      if (hidden && getAnswers) {
        const qs = await getAnswers(rawExam.id);
        if (qs) setGraded(withAnswers(rawExam, qs));
      }
    } else if (onGuestSubmit) {
      const qs = await onGuestSubmit(exam.id, answers); // 비회원: 익명 집계 + 정답
      if (hidden && qs) setGraded(withAnswers(rawExam, qs));
    }
    clearDraft(); // 제출 완료 → 임시저장 삭제
    setResult(sub); // 회원·비회원 모두 채점 리뷰 화면 표시
  };

  if (result) {
    const sub = result;
    const score = totalScore(exam, sub);
    const max = maxScore(exam);
    const ratio = max ? score / max : 0;
    const tone = ratio >= 0.8 ? "good" : ratio >= 0.5 ? "mid" : "low";
    return (
      <div className="mr-col">
        <section className="mr-card" style={{ textAlign: "center", padding: "28px 20px" }}>
          <div className="mr-card-tag" style={{ marginBottom: "10px" }}>{exam.title}</div>
          <div className={"mr-record-score " + tone} style={{ fontSize: "40px" }}>
            {score}
            <span className="mr-record-max"> / {max}</span>
          </div>
          {!loggedIn && (
            <p className="mr-guest-note" style={{ marginTop: "16px" }}>
              비회원은 시험 기록이 저장되지 않습니다
            </p>
          )}
        </section>

        <div className="mr-list-top">
          <span className="mr-list-title">채점 결과</span>
        </div>

        <ReviewList exam={exam} sub={sub} />

        <div className="mr-row-end">
          <button className="mr-btn" onClick={onCancel}>목록으로</button>
        </div>
      </div>
    );
  }

  return (
    <div className="mr-col">
      <button className="mr-back" onClick={onCancel}>
        시험 목록
      </button>
      <section className="mr-card">
        <div className="mr-notice-head">
          <h3>{exam.title}</h3>
          <span className="mr-date">만점 {maxScore(exam)}점</span>
        </div>
        <div className="mr-exam-meta">
          <span>출제자 {exam.author || "관리자"}</span>
          {exam.no && (
            <span className="mr-exam-share">
              <ShareButton path={"/exam/" + exam.no} title={exam.title} />
            </span>
          )}
        </div>
      </section>

      {restored && !result && (
        <div className="mr-resume-note">이전에 풀던 답안을 불러왔어요. 이어서 풀 수 있어요.</div>
      )}

      {!loggedIn && (
        <div className="mr-guest-note">비회원은 시험 기록이 저장되지 않습니다</div>
      )}

      {exam.questions.map((q, qi) => (
        <section className="mr-card mr-take-q" key={q.id}>
          <div className="mr-grade-qtext">
            <span className="mr-qnum">Q{qi + 1}</span>
            <span className="mr-pts-tag">{q.points}점</span>
            <span className="mr-rate-tag" style={{ color: rateColor(memRate(q.id)) }}>회원정답률 {memRate(q.id) === null ? "—" : memRate(q.id) + "%"}</span>
            <span className="mr-rate-tag" style={{ color: rateColor(guestRate(q.id)) }}>비회원정답률 {guestRate(q.id) === null ? "—" : guestRate(q.id) + "%"}</span>
          </div>
          {q.image && <img className="mr-q-img" src={q.image} alt={"문제 " + (qi + 1)} />}
          <QBody q={q} />
          {q.type === "mc" ? (
            <div className="mr-take-options">
              {q.options.map((opt, oi) => (
                <label
                  key={oi}
                  className={"mr-take-opt" + (answers[q.id] === oi ? " sel" : "")}
                >
                  <input
                    type="radio"
                    name={`take-${q.id}`}
                    checked={answers[q.id] === oi}
                    onChange={() => set(q.id, oi)}
                  />
                  <span className="mr-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                  {opt}
                </label>
              ))}
            </div>
          ) : (
            <textarea
              className="mr-textarea"
              rows={3}
              placeholder="답안을 작성하세요"
              value={answers[q.id] || ""}
              onChange={(e) => set(q.id, e.target.value)}
            />
          )}
        </section>
      ))}

      <div className="mr-row-end">
        <button className="mr-btn" onClick={submit} disabled={submitting}>
          {submitting ? "제출 중…" : "제출하기"}
        </button>
      </div>
    </div>
  );
}

/* ---------- 공통 ---------- */
function Empty({ text }) {
  return <div className="mr-empty">{text}</div>;
}

/* ---------- 스피드 연산 게임 (무한 모드 · 콤보 지수 배율) ---------- */
/* 랭킹 카드 (랭킹 화면 + 게임 결과 화면 공용) */
function RankingCard({ ranking, myRankBar, canRank, nickname, showGuestNote }) {
  return (
    <section className="mr-card">
      <div className="mr-card-tag">🏆 랭킹 TOP 50</div>
      {myRankBar}
      {showGuestNote && (
        <div className="mr-rank-empty">로그인하면 랭킹에 참여할 수 있어요.</div>
      )}
      {ranking === null ? (
        <div className="mr-rank-empty">불러오는 중…</div>
      ) : ranking.length === 0 ? (
        <div className="mr-rank-empty">아직 랭킹이 없어요. 첫 주인공이 되어보세요!</div>
      ) : (
        <ol className="mr-rank-list">
          {ranking.map((r, i) => (
            <li key={i} className={"mr-rank-row" + (canRank && r.nickname === nickname ? " me" : "")}>
              <span className="mr-rank-no">{i + 1}</span>
              <span className="mr-rank-nick">{r.nickname}</span>
              <span className="mr-rank-score">{Number(r.best_score).toLocaleString()}</span>
            </li>
          ))}
        </ol>
      )}
    </section>
  );
}

function SpeedGame({ onBack, auth, onGoAccount, onLogin, initialSub, pushUrl }) {
  const goSub = (p) => { if (pushUrl) pushUrl(p); };
  const loggedIn = !!auth;
  const nickname = auth && auth.kakaoId ? auth.kakaoId.trim() : "";
  const canRank = loggedIn && !!nickname;
  const START = 40;
  const BONUS = 2; // 정답 +2초
  const PENALTY = 5; // 오답 -5초 (4지선다 찍기 기댓값: 0.25*2 - 0.75*5 = -3.25초, 음수 유지)
  const rand = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;

  // 우선순위 계산 (×,÷ 먼저). 나눗셈은 떨어지게 생성하므로 정수 보장.
  const evalExpr = (nums, ops) => {
    const n = nums.slice(), o = ops.slice();
    for (let i = 0; i < o.length; ) {
      if (o[i] === "×" || o[i] === "÷") {
        const v = o[i] === "×" ? n[i] * n[i + 1] : n[i] / n[i + 1];
        n.splice(i, 2, v); o.splice(i, 1);
      } else i++;
    }
    let r = n[0];
    for (let i = 0; i < o.length; i++) {
      if (o[i] === "+") r += n[i + 1];
      else if (o[i] === "−" || o[i] === "-") r -= n[i + 1]; // 뺄셈 기호를 명시적으로 처리 (연산자 추가에 안전)
    }
    return r;
  };
  // 자릿수 사다리 (○ = 사칙연산 아무거나). 콤보 오를수록 단계 상승.
  const STAGES = [
    [1, 1],       // 한자리 ○ 한자리
    [1, 2],       // 한자리 ○ 두자리
    [2, 2],       // 두자리 ○ 두자리
    [2, 1, 1],    // 두자리 ○ 한자리 ○ 한자리
    [2, 2, 1],    // 두자리 ○ 두자리 ○ 한자리
    [2, 3],       // 두자리 ○ 세자리
    [2, 2, 2],    // 두자리 ○ 두자리 ○ 두자리
  ];
  const numOfDigits = (d) => (d <= 1 ? rand(2, 9) : rand(Math.pow(10, d - 1), Math.pow(10, d) - 1));

  const makeQ = (combo) => {
    // 단계별 등장 콤보 기준 (뒤 어려운 단계는 한참 뒤에)
    const THRESH = [0, 9, 18, 27, 36, 45, 54];
    let stage = 0;
    for (let i = 0; i < THRESH.length; i++) if (combo >= THRESH[i]) stage = i;
    const digits = STAGES[stage];

    let nums, ops, ans, guard = 0;
    do {
      guard++;
      nums = [numOfDigits(digits[0])];
      ops = [];
      for (let i = 1; i < digits.length; i++) {
        let pool = stage >= 3 ? ["+", "−", "×", "÷"] : ["+", "−", "×"]; // 나눗셈은 후반(단계4~)부터
        if (ops[ops.length - 1] === "÷") pool = pool.filter((x) => x !== "÷"); // ÷ 연속이면 앞 나눗셈의 정수 보장이 깨져 재시도만 낭비됨
        const op = pool[rand(0, pool.length - 1)];
        ops.push(op);
        if (op === "÷") {
          // 직전 항을 (이번 항 × 몫)으로 다시 맞춰 정수 나눗셈 보장
          const divisor = numOfDigits(digits[i]);
          const quotient = rand(2, 9);
          nums[i - 1] = divisor * quotient;
          nums.push(divisor);
        } else {
          nums.push(numOfDigits(digits[i]));
        }
      }
      ans = evalExpr(nums, ops);
    } while ((ans < 0 || !Number.isInteger(ans)) && guard < 40);
    if (ans < 0 || !Number.isInteger(ans)) { nums = [numOfDigits(digits[0]), numOfDigits(digits[digits.length - 1])]; ops = ["+"]; ans = nums[0] + nums[1]; }

    let text = String(nums[0]);
    for (let i = 0; i < ops.length; i++) text += " " + ops[i] + " " + nums[i + 1];

    // 보기: 정답 + 정답 근처 오답 3개
    const opts = new Set([ans]);
    let g2 = 0;
    while (opts.size < 4 && g2 < 80) {
      g2++;
      const spread = Math.max(2, Math.round(Math.abs(ans) * 0.08) + 1);
      let cand = ans + rand(-spread, spread);
      if (cand === ans || cand < 0) cand = ans + (rand(0, 1) ? 1 : -1) * rand(1, spread + 2);
      if (cand !== ans && cand >= 0) opts.add(cand);
    }
    const options = Array.from(opts).sort(() => Math.random() - 0.5);
    return { text, ans, options };
  };

  const [phase, setPhase] = useState("ready"); // ready | playing | over | rank
  useEffect(() => {
    try { window.scrollTo(0, 0); } catch (e) {}
  }, [phase]);
  const [q, setQ] = useState(null);
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [comboMax, setComboMax] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const startRef = React.useRef(0);
  const [timeLeft, setTimeLeft] = useState(START);
  const [flash, setFlash] = useState(""); // "" | "good" | "bad" | "crit"
  const [best, setBest] = useState(0);
  const [picked, setPicked] = useState(null); // 방금 누른 보기(잠깐 표시)
  const [ranking, setRanking] = useState(null); // 랭킹 목록 (null=로딩전/미로드)
  const [myRank, setMyRank] = useState(null); // {my_rank, best_score, total} | null
  const [showGuestPopup, setShowGuestPopup] = useState(false);
  const guestWarnHidden = () => {
    try {
      const t = Number(localStorage.getItem("mrspeedguestwarn") || 0);
      return Date.now() - t < 24 * 60 * 60 * 1000; // 24시간 이내면 숨김
    } catch (e) { return false; }
  };
  const dontShowGuestWarn = () => {
    try { localStorage.setItem("mrspeedguestwarn", String(Date.now())); } catch (e) {}
    setShowGuestPopup(false);
    doStart();
  };
  const loadRanking = async () => {
    setRanking(null);
    setMyRank(null);
    try {
      const { data } = await sb.rpc("speed_ranking", { p_limit: 50 });
      setRanking(data || []);
    } catch (e) { setRanking([]); }
    if (canRank) {
      try {
        const { data } = await sb.rpc("my_speed_rank");
        if (data && data.length) setMyRank(data[0]);
      } catch (e) {}
    }
  };
  const openRanking = () => { setPhase("rank"); loadRanking(); goSub("/game/rank"); };
  // 주소로 랭킹에 바로 들어온 경우
  useEffect(() => { if (initialSub === "rank") { setPhase("rank"); loadRanking(); } }, []);

  useEffect(() => {
    try { setBest(Number(localStorage.getItem("mrspeedbest") || 0)); } catch (e) {}
  }, []);

  // 타이머
  useEffect(() => {
    if (phase !== "playing") return;
    const id = setInterval(() => {
      setTimeLeft((t) => Math.max(0, +(t - 0.1).toFixed(1)));
    }, 100);
    return () => clearInterval(id);
  }, [phase]);

  // 시간 종료 감지
  useEffect(() => {
    if (phase === "playing" && timeLeft <= 0) {
      setPhase("over");
      setBest((b) => {
        const nb = Math.max(b, score);
        try { localStorage.setItem("mrspeedbest", String(nb)); } catch (e) {}
        return nb;
      });
      // 랭킹 등록(닉네임 있는 회원만) 후 랭킹 불러오기
      (async () => {
        try {
          if (canRank && score > 0) {
            const seconds = startRef.current ? (Date.now() - startRef.current) / 1000 : 0;
            await sb.rpc("submit_speed_score", {
              p_score: score,
              p_correct: correctCount,
              p_combo: comboMax,
              p_seconds: Math.round(seconds),
            });
          }
        } catch (e) {}
        if (loggedIn) await loadRanking();
      })();
    }
  }, [timeLeft, phase, score]);

  const doStart = () => {
    setScore(0); setCombo(0); setComboMax(0); setCorrectCount(0); setTimeLeft(START);
    startRef.current = Date.now();
    setPicked(null); setFlash(""); setRanking(null); setQ(makeQ(0)); setPhase("playing");
  };
  const start = () => {
    if (!canRank && !guestWarnHidden()) { setShowGuestPopup(true); return; } // 비회원/닉네임無 → 경고 팝업
    doStart();
  };

  const flashFor = (kind) => {
    setFlash(kind);
    setTimeout(() => setFlash(""), 280);
  };

  const choose = (val) => {
    if (phase !== "playing" || !q || picked !== null) return;
    const correct = val === q.ans;
    setPicked(val);
    if (correct) {
      const nc = combo + 1;
      const mult = Math.pow(1.15, nc);
      setScore((s) => s + Math.round(10 * mult));
      setCombo(nc);
      setComboMax((x) => Math.max(x, nc));
      setCorrectCount((x) => x + 1);
      setTimeLeft((t) => +(t + BONUS).toFixed(1));
      flashFor(nc % 5 === 0 ? "crit" : "good");
    } else {
      setCombo(0);
      setTimeLeft((t) => Math.max(0, +(t - PENALTY).toFixed(1)));
      flashFor("bad");
    }
    setTimeout(() => {
      setPicked(null);
      setQ(makeQ(correct ? combo + 1 : 0));
    }, 130);
  };

  const mult = Math.pow(1.15, combo);
  const timePct = Math.max(0, Math.min(100, (timeLeft / START) * 100));

  const guestPopup = showGuestPopup ? (
    <div className="mr-modal-overlay" onClick={() => setShowGuestPopup(false)}>
      <div className="mr-modal mr-warnpop" onClick={(e) => e.stopPropagation()}>
        <div className="mr-warnpop-icon">⚠️</div>
        <h3 className="mr-warnpop-title">
          {loggedIn ? "닉네임을 등록해주세요" : "비회원은 랭킹에 못 올라가요"}
        </h3>
        <p className="mr-warnpop-sub">
          {loggedIn
            ? "채팅방 닉네임을 저장해야 기록이 랭킹에 등록돼요."
            : "로그인하고 채팅방 닉네임을 저장하면 최고점이 랭킹에 올라가요."}
        </p>
        <div className="mr-warnpop-btns">
          {loggedIn ? (
            <button className="mr-btn mr-warnpop-primary" onClick={() => { setShowGuestPopup(false); onGoAccount(); }}>닉네임 등록하러 가기</button>
          ) : (
            <button className="mr-btn mr-warnpop-primary" onClick={() => { setShowGuestPopup(false); onLogin(); }}>로그인하기</button>
          )}
          <button className="mr-warnpop-ghost" onClick={() => { setShowGuestPopup(false); doStart(); }}>그냥 시작하기</button>
          <button className="mr-warnpop-mute" onClick={dontShowGuestWarn}>1일 동안 다시 보지 않기</button>
        </div>
      </div>
    </div>
  ) : null;

  const myRankBar = canRank && myRank ? (
    <div className="mr-myrank">
      <span className="mr-myrank-label">내 순위</span>
      <span className="mr-myrank-rank">{myRank.my_rank}등</span>
      <span className="mr-myrank-sep">·</span>
      <span className="mr-myrank-score">{Number(myRank.best_score).toLocaleString()}점</span>
      <span className="mr-myrank-total">/ {myRank.total}명</span>
    </div>
  ) : null;

  if (phase === "rank")
    return (
      <div className="mr-col">
        <button className="mr-back" onClick={() => { setPhase("ready"); goSub("/game"); }}>게임으로</button>
        <RankingCard ranking={ranking} myRankBar={myRankBar} canRank={canRank} nickname={nickname} showGuestNote={!loggedIn} />
        <button className="mr-btn mr-game-start" onClick={start}>게임 시작</button>
        {guestPopup}
      </div>
    );

  if (phase === "ready")
    return (
      <div className="mr-col">
        <section className="mr-card mr-game-intro">
          <div className="mr-game-emoji">⚡</div>
          <h2 className="mr-game-title">스피드 연산</h2>
          <p className="mr-game-rules">
            무한 모드예요. 시작 시간은 {START}초.<br />
            맞히면 <b className="mr-c-good">+{BONUS}초</b>, 틀리면 <b className="mr-c-bad">−{PENALTY}초</b>.<br />
            연속으로 맞힐수록 콤보 배율이 <b>눈덩이처럼</b> 불어나요 🔥
          </p>
          <div className="mr-game-best">최고 점수 {best.toLocaleString()}</div>
          <button className="mr-btn mr-game-start" onClick={start}>시작하기</button>
          <button className="mr-game-rankbtn" onClick={openRanking}>🏆 랭킹 보기</button>
        </section>
        {guestPopup}
      </div>
    );

  if (phase === "over")
    return (
      <div className="mr-col">
        <section className="mr-card mr-game-intro">
          <div className="mr-game-emoji">🏁</div>
          <h2 className="mr-game-title">게임 끝!</h2>
          <div className="mr-game-final">{score.toLocaleString()}<span>점</span></div>
          <div className="mr-game-stats2">
            <span>최고 콤보 {comboMax}</span>
            <span>·</span>
            <span>최고 점수 {best.toLocaleString()}</span>
          </div>
          {score >= best && score > 0 && <div className="mr-game-new">🎉 신기록 달성!</div>}
          <button className="mr-btn mr-game-start" onClick={start}>다시 도전</button>
        </section>

        {loggedIn && !nickname && (
          <section className="mr-card mr-rank-warn">
            <p className="mr-withdraw-warn" style={{ margin: "0 0 12px" }}>채팅방 닉네임을 저장해야 랭킹에 등록돼요.</p>
            <button className="mr-btn" onClick={onGoAccount}>닉네임 저장하러 가기</button>
          </section>
        )}

        {loggedIn && (
          <RankingCard ranking={ranking} myRankBar={myRankBar} canRank={canRank} nickname={nickname} showGuestNote={false} />
        )}
        {guestPopup}
      </div>
    );

  // playing
  return (
    <div className={"mr-col mr-game-play" + (flash ? " fl-" + flash : "")}>
      <div className="mr-game-top">
        <span className="mr-game-score">{score.toLocaleString()}</span>
        <span className={"mr-game-combo" + (combo >= 5 ? " hot" : "")}>
          {combo > 0 ? "x" + combo + " · ×" + mult.toFixed(1) : "콤보 없음"}
        </span>
      </div>

      <div className="mr-game-timebar">
        <div className="mr-game-timefill" style={{ width: timePct + "%" }} />
        <span className="mr-game-timetext">{timeLeft.toFixed(1)}s</span>
      </div>

      {flash === "crit" && <div className="mr-game-crit">🔥 크리티컬! ×{mult.toFixed(1)}</div>}

      <section className="mr-card mr-game-qcard">
        <div className="mr-game-q">{q ? q.text : ""}</div>
      </section>

      <div className="mr-game-opts">
        {q && q.options.map((opt) => {
          let cls = "mr-game-opt";
          if (picked !== null) {
            if (opt === q.ans) cls += " correct";
            else if (opt === picked) cls += " wrong";
          }
          return (
            <button key={opt} className={cls} onClick={() => choose(opt)} disabled={picked !== null}>
              {opt}
            </button>
          );
        })}
      </div>

      <button className="mr-btn-text" onClick={() => setTimeLeft(0)}>그만하기</button>
    </div>
  );
}

/* 문항별 정답률 불러오기 (응시 화면·채점 리뷰 공용) */
function useExamRates(examId) {
  const [rates, setRates] = useState({});
  useEffect(() => {
    let active = true;
    sb.rpc("exam_question_stats", { p_exam_id: examId })
      .then(({ data }) => {
        if (!active || !data) return;
        const m = {};
        data.forEach((r) => { m[r.qid] = { total: r.total, correct: r.correct, gtotal: r.gtotal, gcorrect: r.gcorrect }; });
        setRates(m);
      })
      .catch(() => {});
    return () => { active = false; };
  }, [examId]);
  return rates;
}

/* 시험 목록의 정답률: 모든 시험 통계를 한 번에 받아온다.
   서버에 exam_stats_all 이 없으면 null 을 돌려주고, 화면은 예전 방식으로 넘어간다. */
function useAllExamRates() {
  const [map, setMap] = useState(null); // null = 아직 모름/사용 불가
  useEffect(() => {
    let active = true;
    sb.rpc("exam_stats_all")
      .then(({ data, error }) => {
        if (!active) return;
        if (error || !data) { setMap(false); return; }
        const o = {};
        data.forEach((r) => { o[r.exam_id] = r; });
        setMap(o);
      })
      .catch(() => { if (active) setMap(false); });
    return () => { active = false; };
  }, []);
  return map;
}

function rateSpan(avg) {
  return (
    <span style={{ color: rateColor(avg), fontWeight: 700 }}>
      평균정답률 {avg === null ? "—" : avg + "%"}
    </span>
  );
}

// 한꺼번에 받아온 통계로 표시
function ExamAvgRate({ stat }) {
  const tot = stat ? Number(stat.total || 0) + Number(stat.gtotal || 0) : 0;
  const cor = stat ? Number(stat.correct || 0) + Number(stat.gcorrect || 0) : 0;
  return rateSpan(tot ? Math.round((100 * cor) / tot) : null);
}

// 예비용: 시험 하나씩 따로 집계 (exam_stats_all 이 없을 때)
function ExamAvgRateSolo({ examId, questions }) {
  const rates = useExamRates(examId);
  let tot = 0, cor = 0;
  (questions || []).forEach((q) => {
    const st = rates[q.id];
    if (!st) return;
    tot += (st.total || 0) + (st.gtotal || 0);
    cor += (st.correct || 0) + (st.gcorrect || 0);
  });
  return rateSpan(tot ? Math.round((100 * cor) / tot) : null);
}

/* 해설이 실제로 작성돼 있는지 (빈 조각뿐이면 없음으로 처리) */
function hasExplain(q) {
  const ex = q && q.explain;
  if (!ex || !ex.length) return false;
  return ex.some((s) => (s.type === "text" ? String(s.v || "").trim() : String(s.latex || "").trim()));
}

/* 채점 리뷰의 해설 블록: 있으면 버튼으로 펼치고, 없으면 출제자 문의 안내 */
function ExplainBlock({ q, exam }) {
  const [open, setOpen] = useState(false);
  if (!hasExplain(q))
    return (
      <div className="mr-explain-none">
        이 문제는 아직 해설이 없어요. 해설이 필요하면 출제자 <b>{exam.author || "관리자"}</b>님께 문의해 주세요.
      </div>
    );
  if (!open)
    return (
      <button type="button" className="mr-explain-btn" onClick={() => setOpen(true)}>
        💡 해설 보기
      </button>
    );
  return (
    <div className="mr-explain">
      <div className="mr-explain-tag">💡 해설</div>
      <QuestionBody body={q.explain} />
    </div>
  );
}

// 채점 리뷰(문항별 정오·내 답·정답·정답률·해설) — 응시 직후 / 내 시험 기록에서 공용 사용
function ReviewList({ exam, sub }) {
  const rates = useExamRates(exam.id);
  const memRate = (qid) => {
    const st = rates[qid];
    return st && st.total ? Math.round((100 * st.correct) / st.total) : null;
  };
  const guestRate = (qid) => {
    const st = rates[qid];
    return st && st.gtotal ? Math.round((100 * st.gcorrect) / st.gtotal) : null;
  };
  return (
    <>
      {exam.questions.map((q, qi) => {
        const correct = isQCorrect(q, sub);
        const mine = sub.answers[q.id];
        return (
          <section className={"mr-card mr-take-q" + (correct ? "" : " wrong")} key={q.id}>
            <div className="mr-grade-qtext">
              <span className="mr-qnum">Q{qi + 1}</span>
              <span className="mr-pts-tag">{q.points}점</span>
              <span className={"mr-ox " + (correct ? "o" : "x")}>{correct ? "O 정답" : "X 오답"}</span>
              <span className="mr-rate-tag" style={{ color: rateColor(memRate(q.id)) }}>회원정답률 {memRate(q.id) === null ? "—" : memRate(q.id) + "%"}</span>
              <span className="mr-rate-tag" style={{ color: rateColor(guestRate(q.id)) }}>비회원정답률 {guestRate(q.id) === null ? "—" : guestRate(q.id) + "%"}</span>
            </div>
            {q.image && <img className="mr-q-img" src={q.image} alt={"문제 " + (qi + 1)} />}
            <QBody q={q} />
            {q.type === "mc" ? (
              <div className="mr-take-options">
                {q.options.map((opt, oi) => {
                  const isAns = oi === q.answer;
                  const isMine = mine === oi;
                  let cls = "mr-take-opt review";
                  if (isAns) cls += " ans";
                  if (isMine && !isAns) cls += " mychoice";
                  return (
                    <div key={oi} className={cls}>
                      <span className="mr-opt-label">{String.fromCharCode(9311 + oi + 1)}</span>
                      {opt}
                      {isAns && <span className="mr-opt-flag ans">정답</span>}
                      {isMine && !isAns && <span className="mr-opt-flag mine">내 답</span>}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="mr-short-review">
                <div className="mr-sr-row">
                  <span className="mr-sr-k">내 답</span>
                  <span className={"mr-sr-v " + (correct ? "ok" : "no")}>{(mine && String(mine).trim()) || "(미작성)"}</span>
                </div>
                <div className="mr-sr-row">
                  <span className="mr-sr-k">정답</span>
                  <span className="mr-sr-v ans">{q.accept || "—"}</span>
                </div>
              </div>
            )}
            <ExplainBlock q={q} exam={exam} />
          </section>
        );
      })}
    </>
  );
}
